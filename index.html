        // ==================== Page: FlashcardsGame ====================
        function FlashcardsGame({ set, onUpdateSet, onFinish, onExit, savedIds, onSaveToggle }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [results, setResults] = useState([]);
            const [editingCard, setEditingCard] = useState(null);
            const [editWord, setEditWord] = useState('');
            const [editTrans, setEditTrans] = useState('');
            const showToast = useToast();
            const { t } = useI18n();

            const l1 = getLanguageByCode(set.lang1);
            const l2 = getLanguageByCode(set.lang2);

            const cards = useMemo(() => {
                const active = set.words.filter((w) => !w.archived);
                return [...active].sort(() => Math.random() - 0.5);
            }, [set.id, set.words.length]);

            const currentCard = cards[currentIndex];
            const total = cards.length;
            const progress = total > 0 ? (currentIndex / total) * 100 : 0;

            const finishGame = (finalResults) => {
                const updatedSet = { ...set, lastReviewed: new Date().toISOString() };
                onUpdateSet(updatedSet);
                onFinish(finalResults, cards);
            };

            const handleAnswer = (correct) => {
                const newResults = [...results, { id: currentCard.id, correct }];

                const updatedWords = set.words.map((w) => {
                    if (w.id !== currentCard.id) return w;
                    return {
                        ...w,
                        errors: w.errors + (correct ? 0 : 1),
                        correct: w.correct + (correct ? 1 : 0),
                    };
                });
                onUpdateSet({ ...set, words: updatedWords });

                if (currentIndex + 1 >= total) {
                    finishGame(newResults);
                } else {
                    setCurrentIndex(currentIndex + 1);
                    setResults(newResults);
                }
            };

            const handleSkip = () => handleAnswer(false);

            const handleEdit = (card) => {
                setEditingCard(card);
                setEditWord(card.word);
                setEditTrans(card.translation);
            };

            const saveEdit = () => {
                if (!editWord.trim() || !editTrans.trim()) return;
                const updatedWords = set.words.map((w) =>
                    w.id === editingCard.id ? { ...w, word: editWord.trim(), translation: editTrans.trim() } : w
                );
                onUpdateSet({ ...set, words: updatedWords });
                setEditingCard(null);
                showToast('تم تحديث الكلمة', 'success');
            };

            const handleArchive = (id) => {
                const updatedWords = set.words.map((w) =>
                    w.id === id ? { ...w, archived: true } : w
                );
                onUpdateSet({ ...set, words: updatedWords });
                if (currentIndex + 1 >= total) finishGame(results);
                else setCurrentIndex(currentIndex + 1);
            };

            const handleDelete = (id) => {
                if (!confirm('حذف هذه الكلمة نهائياً؟')) return;
                const updatedWords = set.words.filter((w) => w.id !== id);
                onUpdateSet({ ...set, words: updatedWords });
            };

            const isCurrentSaved = savedIds?.has(currentCard?.id) || false;

            useKeyboardShortcuts({
                ' ': () => handleAnswer(true),
                'Enter': () => handleAnswer(true),
                'Escape': onExit,
                'ArrowRight': () => handleAnswer(true),
                'ArrowLeft': () => handleAnswer(false),
            });

            if (!currentCard) {
                return React.createElement('div', { className: 'page' },
                    React.createElement('p', null, 'لا توجد كلمات للعب'),
                    React.createElement('button', { className: 'btn btn-primary', onClick: onExit }, t('goHome'))
                );
            }

            return React.createElement('div', { className: 'page game-page' },
                React.createElement('header', { className: 'game-header' },
                    React.createElement('button', { className: 'icon-btn', onClick: onExit }, '✕'),
                    React.createElement('div', { className: 'game-info' },
                        React.createElement('div', { className: 'game-title' }, set.name),
                        React.createElement('div', { className: 'game-counter' }, 'البطاقة ', currentIndex + 1, ' من ',
                            total)
                    ),
                    React.createElement('button', { className: 'icon-btn', onClick: handleSkip }, '⏭️')
                ),

                React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', { className: 'progress-fill', style: { width: `${progress}%` } })
                ),

                React.createElement('div', { className: 'game-area' },
                    React.createElement(Flashcard, {
                        card: currentCard,
                        lang1Label: `${l1.flag} ${l1.name}`,
                        lang2Label: `${l2.flag} ${l2.name}`,
                        lang1Code: set.lang1,
                        lang2Code: set.lang2,
                        onCorrect: () => handleAnswer(true),
                        onWrong: () => handleAnswer(false),
                        onEdit: handleEdit,
                        onArchive: handleArchive,
                        onDelete: handleDelete,
                        onSaveToggle: () => onSaveToggle?.(currentCard.id),
                        isSaved: isCurrentSaved,
                    })
                ),

                // Answer buttons at bottom
                React.createElement('div', { className: 'game-actions' },
                    React.createElement('button', {
                        className: 'btn btn-danger',
                        onClick: () => handleAnswer(false),
                    }, '✗ ', t('wrong')),
                    React.createElement('button', {
                        className: 'btn btn-success',
                        onClick: () => handleAnswer(true),
                    }, '✓ ', t('correct'))
                ),

                React.createElement('div', { className: 'game-hints' },
                    React.createElement('div', { className: 'hint-wrong' }, '← ', t('swipeLeft')),
                    React.createElement('div', { className: 'hint-correct' }, t('swipeRight'), ' →')
                ),

                editingCard && React.createElement('div', { className: 'modal-overlay', onClick: () => setEditingCard(
                        null) },
                    React.createElement('div', { className: 'modal', onClick: (e) => e.stopPropagation() },
                        React.createElement('h2', null, 'تعديل الكلمة'),
                        React.createElement('div', { className: 'input-group' },
                            React.createElement('label', null, l1.name),
                            React.createElement('input', {
                                type: 'text',
                                value: editWord,
                                onChange: (e) => setEditWord(e.target.value),
                            })
                        ),
                        React.createElement('div', { className: 'input-group' },
                            React.createElement('label', null, l2.name),
                            React.createElement('input', {

        // ==================== Page: MCQ Game ====================
        function MCQGame({ set, onUpdateSet, onFinish, onExit }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [results, setResults] = useState([]);
            const [selected, setSelected] = useState(null);
            const [options, setOptions] = useState([]);
            const { speak } = useSpeech();
            const { t } = useI18n();

            const l1 = getLanguageByCode(set.lang1);
            const l2 = getLanguageByCode(set.lang2);

            const cards = useMemo(() => {
                const active = set.words.filter((w) => !w.archived);
                return [...active].sort(() => Math.random() - 0.5);
            }, [set.id]);

            const currentCard = cards[currentIndex];

            useEffect(() => {
                if (!currentCard) return;

                const allTranslations = set.words.filter((w) => !w.archived).map((w) => w.translation);
                const wrongOptions = allTranslations
                    .filter((t) => t !== currentCard.translation)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);

                const allOptions = [...wrongOptions, currentCard.translation].sort(() => Math.random() - 0.5);
                setOptions(allOptions);
                setSelected(null);
            }, [currentIndex, currentCard]);

            const handleSelect = (option) => {
                if (selected !== null) return;

                const correct = option === currentCard.translation;
                setSelected(option);

                const newResults = [...results, { id: currentCard.id, correct }];
                setResults(newResults);

                const updatedWords = set.words.map((w) => {
                    if (w.id !== currentCard.id) return w;
                    return {
                        ...w,
                        errors: w.errors + (correct ? 0 : 1),
                        correct: w.correct + (correct ? 1 : 0),
                    };
                });
                onUpdateSet({ ...set, words: updatedWords });

                setTimeout(() => {
                    if (currentIndex + 1 >= cards.length) {
                        onFinish(newResults, cards);
                    } else {
                        setCurrentIndex(currentIndex + 1);
                    }
                }, 1000);
            };

            if (!currentCard) {
                return React.createElement('div', { className: 'page' },
                    React.createElement('p', null, 'لا توجد كلمات للعب'),
                    React.createElement('button', { className: 'btn btn-primary', onClick: onExit }, t('goHome'))
                );
            }

            return React.createElement('div', { className: 'page game-page' },
                React.createElement('header', { className: 'game-header' },
                    React.createElement('button', { className: 'icon-btn', onClick: onExit }, '✕'),
                    React.createElement('div', { className: 'game-info' },
                        React.createElement('div', { className: 'game-title' }, set.name, ' - ', t('gameMCQ')),
                        React.createElement('div', { className: 'game-counter' }, 'السؤال ', currentIndex + 1, ' من ',
                            cards.length)
                    )
                ),

                React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', { className: 'progress-fill', style: { width: `${(currentIndex / cards.length) * 100}%` } })
                ),

                React.createElement('div', { className: 'mcq-game' },
                    React.createElement('div', { className: 'mcq-word' },
                        React.createElement('button', {
                            className: 'speak-btn',
                            style: { position: 'absolute', top: '12px', right: '12px' },
                            onClick: () => speak(currentCard.word, set.lang1),
                        }, '🔊'),
                        currentCard.word
                    ),
                    React.createElement('div', { className: 'mcq-options' },
                        options.map((option, idx) => {
                            let className = 'mcq-option';
                            if (selected !== null) {
                                if (option === currentCard.translation) className += ' correct';
                                else if (option === selected) className += ' wrong';
                            }
                            return React.createElement('button', {
                                key: idx,
                                className: className,
                                onClick: () => handleSelect(option),
                                disabled: selected !== null,
                            }, option);
                        })
                    )
                )
            );
        }

        // ==================== Page: Spelling Game ====================

            }, [set.id]);

            const currentCard = cards[currentIndex];

            useEffect(() => {
                if (currentCard) {
                    speak(currentCard.translation, set.lang2, { rate: 0.9 });
                }
                setUserInput('');
                setFeedback(null);
                setShowAnswer(false);
            }, [currentIndex, currentCard]);

            const handleSubmit = () => {
                if (!userInput.trim() || feedback) return;

                const correct = userInput.trim().toLowerCase() === currentCard.word.toLowerCase();
                setFeedback(correct ? 'correct' : 'wrong');
                if (!correct) setShowAnswer(true);

                const newResults = [...results, { id: currentCard.id, correct }];
                setResults(newResults);

                const updatedWords = set.words.map((w) => {
                    if (w.id !== currentCard.id) return w;
                    return {
                        ...w,
                        errors: w.errors + (correct ? 0 : 1),
                        correct: w.correct + (correct ? 1 : 0),
                    };
                });
                onUpdateSet({ ...set, words: updatedWords });

                setTimeout(() => {
                    if (currentIndex + 1 >= cards.length) {
                        onFinish(newResults, cards);
                    } else {
                        setCurrentIndex(currentIndex + 1);
                    }
                }, 1800);
            };

            if (!currentCard) {
                return React.createElement('div', { className: 'page' },
                    React.createElement('p', null, 'لا توجد كلمات للعب'),
                    React.createElement('button', { className: 'btn btn-primary', onClick: onExit }, t('goHome'))
                );
            }

            return React.createElement('div', { className: 'page game-page' },
                React.createElement('header', { className: 'game-header' },
                    React.createElement('button', { className: 'icon-btn', onClick: onExit }, '✕'),
                    React.createElement('div', { className: 'game-info' },
                        React.createElement('div', { className: 'game-title' }, set.name, ' - ', t('gameSpelling')),
                        React.createElement('div', { className: 'game-counter' }, 'السؤال ', currentIndex + 1, ' من ',
                            cards.length)
                    )
                ),

                React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', { className: 'progress-fill', style: { width: `${(currentIndex / cards.length) * 100}%` } })
                ),

                React.createElement('div', { className: 'spelling-game' },
                    React.createElement('div', { className: 'mcq-word' },
                        React.createElement('button', {
                            className: 'speak-btn',
                            style: { position: 'absolute', top: '12px', right: '12px' },
                            onClick: () => speak(currentCard.translation, set.lang2, { rate: 0.9 }),
                        }, '🔊'),
                        'استمع واكتب الكلمة'
                    ),

                    React.createElement('input', {
                        type: 'text',
                        className: `spelling-input ${feedback || ''}`,
                        value: userInput,
                        onChange: (e) => setUserInput(e.target.value),
                        onKeyDown: (e) => { if (e.key === 'Enter') handleSubmit(); },
                        placeholder: t('typeWord'),
                        disabled: !!feedback,
                        autoFocus: true,
                    }),

                    React.createElement('div', { className: `spelling-feedback ${feedback || ''}` },
                        feedback === 'wrong' && showAnswer && `❌ الإجابة الصحيحة: ${currentCard.word}`,
                        feedback === 'correct' && '✅ صحيح!'
                    ),

                    React.createElement('button', {
                        className: 'btn btn-primary btn-block',
                        onClick: handleSubmit,
                        disabled: !userInput.trim() || !!feedback,
                    }, feedback ? '⏳ جاري...' : t('check'))
                )
            );
        }

        // ==================== Page: Matching Game ====================
        function MatchingGame({ set, onUpdateSet, onFinish, onExit }) {
            const [words, setWords] = useState([]);
            const [translations, setTranslations] = useState([]);
            const [selectedWord, setSelectedWord] = useState(null);
            const [selectedTranslation, setSelectedTranslation] = useState(null);
            const [matched, setMatched] = useState(new Set());
            const [results, setResults] = useState([]);
            const { t } = useI18n();

            useEffect(() => {
                const active = set.words.filter((w) => !w.archived).slice(0, 6);
                const shuffledWords = [...active].sort(() => Math.random() - 0.5);
                const shuffledTranslations = [...active].sort(() => Math.random() - 0.5);
                setWords(shuffledWords);
                setTranslations(shuffledTranslations);
                setMatched(new Set());
                setResults([]);
                setSelectedWord(null);
                setSelectedTranslation(null);
            }, [set.id]);

            const checkMatch = () => {
                if (selectedWord && selectedTranslation) {
                    const correct = selectedWord.id === selectedTranslation.id;

                    if (correct) {
                        setMatched((prev) => new Set([...prev, selectedWord.id]));
                        const newResults = [...results, { id: selectedWord.id, correct: true }];
                        setResults(newResults);

                        const updatedWords = set.words.map((w) => {
                            if (w.id !== selectedWord.id) return w;
                            return { ...w, correct: w.correct + 1 };
                        });
                        onUpdateSet({ ...set, words: updatedWords });

                        if (matched.size + 1 === words.length) {
                            setTimeout(() => {
                                onFinish(newResults, words);
                            }, 600);
                        }
                    } else {
                        const newResults = [...results, { id: selectedWord.id, correct: false }];
                        setResults(newResults);

                        const updatedWords = set.words.map((w) => {
                            if (w.id !== selectedWord.id) return w;
                            return { ...w, errors: w.errors + 1 };
                        });
                        onUpdateSet({ ...set, words: updatedWords });
                    }

                    setTimeout(() => {
                        setSelectedWord(null);
                        setSelectedTranslation(null);
                    }, 400);
                }
            };

            useEffect(() => {
                if (selectedWord && selectedTranslation) {
                    checkMatch();
                }
            }, [selectedWord, selectedTranslation]);

            if (words.length === 0) {
                return React.createElement('div', { className: 'page' },
                    React.createElement('p', null, 'لا توجد كلمات كافية للعب (تحتاج 6 كلمات على الأقل)'),
                    React.createElement('button', { className: 'btn btn-primary', onClick: onExit }, t('goHome'))
                );
            }

            return React.createElement('div', { className: 'page game-page' },
                React.createElement('header', { className: 'game-header' },
                    React.createElement('button', { className: 'icon-btn', onClick: onExit }, '✕'),
                    React.createElement('div', { className: 'game-info' },
                        React.createElement('div', { className: 'game-title' }, set.name, ' - ', t('gameMatching')),
                        React.createElement('div', { className: 'game-counter' }, 'طابق ', matched.size, ' من ', words
                            .length)
                    )
                ),

                React.createElement('div', { className: 'matching-game' },
                    React.createElement('div', { className: 'matching-columns' },
                        React.createElement('div', { className: 'matching-column' },
                            words.map((w) =>
                                React.createElement('button', {
                                    key: w.id,
                                    className: `matching-item ${selectedWord?.id === w.id ? 'selected' : ''} ${matched.has(w.id) ? 'matched' : ''}`,
                                    onClick: () => !matched.has(w.id) && setSelectedWord(w),
                                    disabled: matched.has(w.id),
                                }, w.word)
                            )
                        ),
                        React.createElement('div', { className: 'matching-column' },
                            translations.map((w) =>
                                React.createElement('button', {
                                    key: w.id,
                                    className: `matching-item ${selectedTranslation?.id === w.id ? 'selected' : ''} ${matched.has(w.id) ? 'matched' : ''}`,
                                    onClick: () => !matched.has(w.id) && setSelectedTranslation(w),
                                    disabled: matched.has(w.id),
                                }, w.translation)
                            )
                        )
                    )
                )
            );
        }

        // ==================== Page: Results ====================
        function Results({ results, cards, onRetry, onRetryWrong, onHome }) {
            const { t } = useI18n();
            const total = results.length;
            const correctCount = results.filter((r) => r.correct).length;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;

            let rating, stars, message, emoji;
            if (percentage >= 90) {
                rating = t('excellent');
                stars = '🌟🌟🌟';
                message = t('messageExcellent');
                emoji = '🎉';
            } else if (percentage >= 70) {
                rating = t('good');
                stars = '⭐⭐';
                message = t('messageGood');
                emoji = '👏';
            } else if (percentage >= 50) {
                rating = t('fair');
                stars = '⭐';
                message = t('messageFair');
                emoji = '👍';
            } else {
                rating = t('tryAgain');
                stars = '💪';
                message = t('messageTryAgain');
                emoji = '🔥';
            }

            const wrongWordsMap = {};
            results.forEach((r) => {
                if (!r.correct) {
                    if (!wrongWordsMap[r.id]) wrongWordsMap[r.id] = 0;
                    wrongWordsMap[r.id]++;
                }
            });
            const wrongWords = Object.entries(wrongWordsMap).map(([id, count]) => {
                const card = cards?.find((c) => c.id === id);
                return { ...card, wrongCount: count };
            }).filter(w => w.word);

            return React.createElement('div', { className: 'page results-page' },
                React.createElement('div', { className: 'results-header' },
                    React.createElement('div', { className: 'results-emoji' }, emoji),
                    React.createElement('h1', null, t('results'))
                ),

                React.createElement('div', { className: 'results-score-card' },
                    React.createElement('div', { className: 'score-circle' },
                        React.createElement('div', { className: 'score-value' }, percentage, '%'),
                        React.createElement('div', { className: 'score-label' }, t('score'))
                    ),
                    React.createElement('div', { className: 'score-details' },
                        React.createElement('div', { className: 'score-row' },
                            React.createElement('span', null, t('correctAnswers')),
                            React.createElement('strong', null, correctCount, ' من ', total)
                        ),
                        React.createElement('div', { className: 'score-row' },
                            React.createElement('span', null, t('rating')),
                            React.createElement('strong', null, stars, ' ', rating)
                        )
                    )
                ),

                React.createElement('div', { className: 'results-message' }, `"${message}" ${emoji}`),

                wrongWords.length > 0 && React.createElement('div', { className: 'wrong-words-section' },
                    React.createElement('h2', null, '❌ ', t('wrongWords')),
                    React.createElement('div', { className: 'wrong-words-list' },
                        wrongWords.map((w) =>
                            React.createElement('div', { key: w.id, className: 'wrong-word-item' },
                                React.createElement('span', { className: 'wrong-word-text' }, w.word, ' (', w
                                    .translation, ')'),
                                React.createElement('span', { className: 'wrong-word-count' }, '❌ ', w.wrongCount)
                            )
                        )
                    )
                ),

                React.createElement('div', { className: 'results-actions' },
                    React.createElement('button', { className: 'btn btn-primary btn-block', onClick: onRetry },
                        '🔄 ', t('retry')
                    ),
                    wrongWords.length > 0 && React.createElement('button', {
                        className: 'btn btn-secondary btn-block',
                        onClick: onRetryWrong,
                    }, '⭐ ', t('retryWrong'), ' (', wrongWords.length, ')'),
                    React.createElement('button', { className: 'btn btn-ghost btn-block', onClick: onHome },
                        '🏠 ', t('goHome')
                    )
                )
            );
        }

        // ==================== Page: Archive ====================
        function Archive({ sets, onUpdateSet, onBack, onPlayArchived }) {
            const { t } = useI18n();
            const allArchived = sets.flatMap((s) =>
                s.words.filter((w) => w.archived).map((w) => ({ ...w, setId: s.id, setName: s.name, set: s }))
            );

            const restore = (setId, wordId) => {
                const set = sets.find((s) => s.id === setId);
                const updatedWords = set.words.map((w) =>
                    w.id === wordId ? { ...w, archived: false } : w
                );
                onUpdateSet({ ...set, words: updatedWords });
            };

            const deleteWord = (setId, wordId) => {
                if (!confirm('حذف هذه الكلمة نهائياً؟')) return;
                const set = sets.find((s) => s.id === setId);
                const updatedWords = set.words.filter((w) => w.id !== wordId);
                onUpdateSet({ ...set, words: updatedWords });
            };

            return React.createElement('div', { className: 'page archive-page' },
                React.createElement('header', { className: 'page-header' },
                    React.createElement('button', { className: 'icon-btn', onClick: onBack }, '← ', t('home')),
                    React.createElement('h1', null, '📦 ', t('archive'))
                ),

                allArchived.length > 0 && React.createElement('button', {
                    className: 'btn btn-primary btn-block',
                    onClick: () => onPlayArchived(allArchived),
                }, '🎮 ', t('playSaved'), ' (', allArchived.length, ')'),

                allArchived.length === 0 ? React.createElement('div', { className: 'empty-state' },
                    React.createElement('div', { className: 'empty-icon' }, '📦'),
                    React.createElement('p', null, t('noSavedWords')),
                    React.createElement('p', { className: 'empty-hint' }, 'استخدم الضغط المطول على البطاقة لنقل الكلمات هنا')
                ) : React.createElement('div', { className: 'words-list' },
                    allArchived.map((w) => {
                        const l1 = getLanguageByCode(w.set.lang1);
                        const l2 = getLanguageByCode(w.set.lang2);
                        return React.createElement('div', { key: `${w.setId}-${w.id}`, className: 'word-item' },
                            React.createElement('div', { className: 'word-content' },
                                React.createElement('div', { className: 'word-set-name' }, w.setName),
                                React.createElement('div', { className: 'word-main' },
                                    React.createElement('span', { className: 'word-original' }, l1.flag, ' ', w
                                        .word),
                                    React.createElement('span', { className: 'word-arrow' }, '→'),
                                    React.createElement('span', { className: 'word-translation' }, l2.flag, ' ',
                                        w.translation)
                                )
                            ),
                            React.createElement('div', { className: 'word-actions' },
                                React.createElement('button', { className: 'icon-btn', onClick: () => restore(w
                                        .setId, w.id), title: 'استعادة' }, '↩️'),
                                React.createElement('button', { className: 'icon-btn danger', onClick: () =>
                                        deleteWord(w.setId, w.id), title: 'حذف' }, '🗑️')
                            )
                        );
                    })
                )
            );
        }

        // ==================== Page: Login ====================
        function LoginPage({ onLogin, onGuest }) {
            const { t } = useI18n();
            const [loading, setLoading] = useState(false);

            const handleGoogleLogin = () => {
                setLoading(true);
                // Simulate Google OAuth flow
                setTimeout(() => {
                    const mockUser = {
                        uid: 'google-' + Date.now(),
                        displayName: 'أحمد محمد',
                        email: 'ahmed@example.com',
                        photoURL: null,
                        provider: 'google',
                    };
                    onLogin(mockUser);
                    setLoading(false);
                }, 1200);
            };

            return React.createElement('div', { className: 'login-page' },
                React.createElement('div', { className: 'logo' }, '📚'),
                React.createElement('h1', null, 'VOCAflow'),
                React.createElement('p', { className: 'tagline' }, t('tagline')),

                React.createElement('div', { className: 'login-card' },
                    React.createElement('button', {
                        className: 'btn btn-google btn-block',
                        onClick: handleGoogleLogin,
                        disabled: loading,
                    },
                        React.createElement('span', null, '🔐 '),
                        loading ? '⏳ ' + t('loading') : t('loginGoogle')
                    ),

                    React.createElement('div', { className: 'divider' }, 'أو'),

                    React.createElement('button', {
                        className: 'btn btn-secondary btn-block',
                        onClick: onGuest,
                        disabled: loading,
                    }, '👤 ', t('guest')),

                    React.createElement('div', { className: 'guest-note' }, 'ℹ️ ', t('guestNote'))
                )
            );
        }

        // ==================== Main App ====================
        function App() {
            const [sets, setSets] = useLocalStorage('vocaflow-sets', []);
            const [user, setUser] = useLocalStorage('vocaflow-user', null);
            const [savedWords, setSavedWords] = useLocalStorage('vocaflow-saved', {});
            const [view, setView] = useState('login');
            const [currentSetId, setCurrentSetId] = useState(null);
            const [gameResults, setGameResults] = useState(null);
            const [gameCards, setGameCards] = useState(null);
            const [retryMode, setRetryMode] = useState(null);
            const [gameKey, setGameKey] = useState(0);
            const [gameType, setGameType] = useState('flashcards');
            const [archivedGameWords, setArchivedGameWords] = useState(null);

            const usageStats = useUsageTracking();

            const currentSet = sets.find((s) => s.id === currentSetId);

            const updateSet = (updatedSet) => {
                setSets(sets.map((s) => (s.id === updatedSet.id ? updatedSet : s)));
            };

            const createSet = (newSet) => setSets([...sets, newSet]);
            const deleteSet = (id) => setSets(sets.filter((s) => s.id !== id));

            const openSet = (id) => {
                setCurrentSetId(id);
                setView('editor');
            };

            const startGame = (type = 'flashcards', mode = 'all') => {
                setGameType(type);
                setRetryMode(mode);
                setGameKey(Date.now());
                setView('game');
            };

            const finishGame = (results, cards) => {
                setGameResults(results);
                setGameCards(cards);
                setView('results');
            };

            const goHome = () => {
                setView('home');
                setCurrentSetId(null);
                setGameResults(null);
                setGameCards(null);
                setRetryMode(null);
                setArchivedGameWords(null);
            };

            const playArchived = (archivedWords) => {
                if (!archivedWords || archivedWords.length === 0) return;
                const tempSet = {
                    id: 'archived-temp-' + Date.now(),
                    name: 'الكلمات المحفوظة',
                    lang1: archivedWords[0]?.set?.lang1 || 'fr',
                    lang2: archivedWords[0]?.set?.lang2 || 'ar',
                    words: archivedWords.map(w => ({ ...w, archived: false })),
                };
                setArchivedGameWords(tempSet);
                setGameType('flashcards');
                setGameKey(Date.now());
                setView('game');
            };

            const handleLogin = (userData) => {
                setUser(userData);
                setView('home');
                usageStats.startSession();
            };

            const handleLogout = () => {
                usageStats.endSession();
                setUser(null);
                setView('login');
            };

            const handleGuest = () => {
                setUser(null);
                setView('home');
                usageStats.startSession();
            };

            const toggleSaveWord = (wordId, setId) => {
                const key = `${setId}-${wordId}`;
                const isSaved = !!savedWords[key];
                if (isSaved) {
                    const newSaved = { ...savedWords };
                    delete newSaved[key];
                    setSavedWords(newSaved);
                } else {
                    setSavedWords({ ...savedWords, [key]: true });
                }
                return !isSaved;
            };

            const isWordSaved = (wordId, setId) => {
                return !!savedWords[`${setId}-${wordId}`];
            };

            const getSavedIds = (setId) => {
                const ids = new Set();
                Object.keys(savedWords).forEach(key => {
                    if (key.startsWith(`${setId}-`)) {
                        ids.add(key.split('-')[1]);
                    }
                });
                return ids;
            };

            const gameSet = (() => {
                if (archivedGameWords) return archivedGameWords;
                if (!currentSet) return null;
                if (retryMode === 'wrong' && gameCards) {
                    const wrongIds = new Set(gameResults.filter((r) => !r.correct).map((r) => r.id));
                    return {
                        ...currentSet,
                        words: currentSet.words.filter((w) => wrongIds.has(w.id)),
                    };
                }
                return currentSet;
            })();

            // If no user and not on login page, show login
            if (view !== 'login' && !user && view !== 'home' && view !== 'login') {
                setView('login');
                return null;
            }

            // If user is null and view is login or home with guest, allow
            if (view === 'login') {
                return React.createElement(LoginPage, { onLogin: handleLogin, onGuest: handleGuest });
            }

            return React.createElement('div', { className: 'app' },
                view === 'home' && React.createElement(Home, {
                    sets: sets,
                    onCreateSet: createSet,
                    onDeleteSet: deleteSet,
                    onOpenSet: openSet,
                    onOpenArchive: () => setView('archive'),
                    onPlayArchived: playArchived,
                    user: user,
                    onLogout: handleLogout,
                    usageStats: usageStats,
                }),
                view === 'editor' && currentSet && React.createElement(SetEditor, {
                    set: currentSet,
                    onUpdateSet: updateSet,
                    onBack: goHome,
                    onStartGame: startGame,
                }),
                view === 'game' && gameSet && gameType === 'flashcards' && React.createElement(FlashcardsGame, {
                    key: gameKey,
                    set: gameSet,
                    onUpdateSet: archivedGameWords ? () => {} : updateSet,
                    onFinish: finishGame,
                    onExit: () => {
                        setArchivedGameWords(null);
                        setView(archivedGameWords ? 'archive' : 'editor');
                    },
                    savedIds: getSavedIds(gameSet.id),
                    onSaveToggle: (wordId) => {
                        toggleSaveWord(wordId, gameSet.id);
                    },
                }),
                view === 'game' && gameSet && gameType === 'mcq' && React.createElement(MCQGame, {
                    key: gameKey,
                    set: gameSet,
                    onUpdateSet: updateSet,
                    onFinish: finishGame,
                    onExit: () => setView('editor'),
                }),
                view === 'game' && gameSet && gameType === 'spelling' && React.createElement(SpellingGame, {
                    key: gameKey,
                    set: gameSet,
                    onUpdateSet: updateSet,
                    onFinish: finishGame,
                    onExit: () => setView('editor'),
                }),
                view === 'game' && gameSet && gameType === 'matching' && React.createElement(MatchingGame, {
                    key: gameKey,
                    set: gameSet,
                    onUpdateSet: updateSet,
                    onFinish: finishGame,
                    onExit: () => setView('editor'),
                }),
                view === 'results' && gameResults && React.createElement(Results, {
                    results: gameResults,
                    cards: gameCards,
                    onRetry: () => startGame(gameType, 'all'),
                    onRetryWrong: () => startGame(gameType, 'wrong'),
                    onHome: goHome,
                }),
                view === 'archive' && React.createElement(Archive, {
                    sets: sets,
                    onUpdateSet: updateSet,
                    onBack: goHome,
                    onPlayArchived: playArchived,
                })
            );
        }

        // ==================== Root ====================
        function Root() {
            return React.createElement(
                I18nProvider, null,
                React.createElement(
                    ToastProvider, null,
                    React.createElement(App, null)
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(Root));
    </script>
</body>
</html>
