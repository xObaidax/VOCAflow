    const I18nContext = createContext();

    function I18nProvider({ children }) {
      const [locale, setLocale] = useState(() => {
        const saved = localStorage.getItem("vocaflow_locale");
        if (saved && LOCALES[saved]) return saved;
        const browser = (navigator.language || "en").split("-")[0];
        return LOCALES[browser] ? browser : "en";
      });

      useEffect(() => {
        const lang = getLang(locale);
        document.documentElement.lang = locale;
        document.documentElement.dir = lang.dir;
        localStorage.setItem("vocaflow_locale", locale);
      }, [locale]);

      const t = useCallback((key) => {
        return LOCALES[locale]?.[key] || LOCALES.en[key] || key;
      }, [locale]);

      return (
        <I18nContext.Provider value={{ t, locale, setLocale, langs: LANGS }}>
          {children}
        </I18nContext.Provider>
      );
    }
    const useI18n = () => useContext(I18nContext);

    // ================================================================
    //  TOAST
    // ================================================================
    const ToastContext = createContext();

    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);
      const showToast = useCallback((message, type = "info") => {
        const id = uid();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      }, []);
      return (
        <ToastContext.Provider value={showToast}>
          {children}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className={"toast " + t.type}>
                <span>{t.type === "success" ? "✅" : t.type === "error" ? "❌" : t.type === "warning" ? "⚠️" :
                "ℹ️"}</span>
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    // ================================================================
    //  LOCAL STORAGE
    // ================================================================
    function useLocalStorage(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch { return initialValue; }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }, [key, value]);
      return [value, setValue];
    }

    // ================================================================
    //  SPEECH (Natural TTS)
    // ================================================================
    function useSpeech() {
      const [speaking, setSpeaking] = useState(false);
      const [voices, setVoices] = useState([]);
      const [voicesLoaded, setVoicesLoaded] = useState(false);

      useEffect(() => {
        if (!window.speechSynthesis) return;
        const loadVoices = () => {
          const available = window.speechSynthesis.getVoices();
          setVoices(available);
          if (available.length > 0) setVoicesLoaded(true);
        };
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
        return () => { window.speechSynthesis.onvoiceschanged = null; };
      }, []);

      const getPreferredVoice = useCallback((lang) => {
        if (!voicesLoaded || voices.length === 0) return null;
        const langMap = {
          ar: ["ar-SA", "ar-EG", "ar"],
          en: ["en-US", "en-GB", "en"],
          fr: ["fr-FR", "fr-CA", "fr"],
          es: ["es-ES", "es-MX", "es"],
          de: ["de-DE", "de-AT", "de"]
        };
        const candidates = langMap[lang] || [lang];
        for (const code of candidates) {
          const exact = voices.find(v => v.lang === code && v.localService);
          if (exact) return exact;
        }
        for (const code of candidates) {
          const prefix = code.split("-")[0];
          const match = voices.find(v => v.lang.startsWith(prefix));
          if (match) return match;
        }
        return null;
      }, [voices, voicesLoaded]);

      const preprocessText = useCallback((text) => {
        if (!text) return "";
        return text.trim().replace(/\s+/g, " ");
      }, []);

      const speak = useCallback((text, lang, options = {}) => {
        if (!window.speechSynthesis || !text) return;
        window.speechSynthesis.cancel();

        const processed = preprocessText(text);
        if (!processed) return;

        const utterance = new SpeechSynthesisUtterance(processed);
        utterance.rate = options.rate || 0.92;
        utterance.pitch = options.pitch || 1.0;
        utterance.volume = options.volume || 1.0;

        const langMap = { ar: "ar-SA", en: "en-US", fr: "fr-FR", es: "es-ES", de: "de-DE" };
        utterance.lang = langMap[lang] || lang || "en-US";

        const preferred = getPreferredVoice(lang);
        if (preferred) utterance.voice = preferred;

        utterance.onstart = () => setSpeaking(true);
        utterance.onend = () => setSpeaking(false);
        utterance.onerror = () => setSpeaking(false);

        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        window.speechSynthesis.speak(utterance);
      }, [getPreferredVoice, preprocessText]);

      const cancel = useCallback(() => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        setSpeaking(false);
      }, []);

      return { speak, cancel, speaking, voices, voicesLoaded };
    }

    // ================================================================
    //  TRANSLATION (MyMemory API)
    // ================================================================
    function useTranslation(fromLang, toLang) {
      const [result, setResult] = useState({ text: "", suggestions: [], loading: false });
      const abortRef = useRef(null);
      const cacheRef = useRef({});

      const translate = useCallback(async (text) => {
        if (!text || text.trim().length < 1) {
          setResult({ text: "", suggestions: [], loading: false });
          return;
        }
        if (fromLang === toLang) {
          setResult({ text: text, suggestions: [], loading: false });
          return;
        }
        const key = `${fromLang}|${toLang}|${text.trim().toLowerCase()}`;
        if (cacheRef.current[key]) {
          setResult(cacheRef.current[key]);
          return;
        }
        setResult(prev => ({ ...prev, loading: true }));
        if (abortRef.current) clearTimeout(abortRef.current);
        abortRef.current = setTimeout(async () => {
          try {
            const url =
              `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
            const res = await fetch(url);
            const data = await res.json();
            const mainText = data?.responseData?.translatedText || "";
            const matches = data?.matches || [];
            const suggestions = matches
              .filter(m => m.translation && m.translation.toLowerCase() !== mainText.toLowerCase())
              .slice(0, 3)
              .map(m => m.translation);
            const newResult = { text: mainText, suggestions, loading: false };
            cacheRef.current[key] = newResult;
            setResult(newResult);
          } catch {
            setResult({ text: "", suggestions: [], loading: false });
          }
        }, 400);
      }, [fromLang, toLang]);

      return { ...result, translate };
    }

    // ================================================================
    //  USAGE / LEVEL
    // ================================================================
    function useUsage() {
      const [stored, setStored] = useLocalStorage("vocaflow_usage", { total: 0, daily: {} });
      const sessionRef = useRef(0);
      const [, forceUpdate] = useState(0);

      useEffect(() => {
        const tick = setInterval(() => {
          sessionRef.current += 1;
          forceUpdate(n => n + 1);
        }, 1000);
        const save = () => {
          const secs = sessionRef.current;
          if (secs > 0) {
            const day = new Date().toISOString().slice(0, 10);
            setStored(prev => ({
              total: (prev.total || 0) + secs,
              daily: { ...(prev.daily || {}), [day]: ((prev.daily?.[day]) || 0) + secs }
            }));
            sessionRef.current = 0;
          }
        };
        const periodic = setInterval(save, 30000);
        const onUnload = () => save();
        window.addEventListener("beforeunload", onUnload);
        return () => {
          clearInterval(tick);
          clearInterval(periodic);
          save();
          window.removeEventListener("beforeunload", onUnload);
        };
      }, []);

      const day = new Date().toISOString().slice(0, 10);
      const total = (stored.total || 0) + sessionRef.current;
      const today = ((stored.daily?.[day]) || 0) + sessionRef.current;
      const level = Math.min(Math.floor(total / 60 / 15) + 1, 70);
      const fmt = (s) => {
        if (s < 60) return s + "s";
        if (s < 3600) return Math.floor(s / 60) + "m";
        return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
      };
      return { total, today, level, fmt };
    }

        flameClass = "flame-purple";
      } else if (level >= 20) {
        flameClass = "flame-blue";

      } else {
        flameClass = "flame-red";

      // Colors for non-rainbow
      const colors = {
        main: isRainbow ? "#FF6B35" : (level >= 30 ? "#A855F7" : (level >= 20 ? "#5B7FFF" : (level >= 10 ?
          "#FFFFFF" : "#FF6B35"))),
        inner: isRainbow ? "#FFB088" : (level >= 30 ? "#C4B5FD" : (level >= 20 ? "#93C5FD" : (level >= 10 ?
          "#FCD34D" : "#FF8C42"))),
        highlight: isRainbow ? "#FFE5D4" : (level >= 30 ? "#E9D5FF" : (level >= 20 ? "#DBEAFE" : (level >= 10 ?

            {isRainbow && (

    // ================================================================

    function useSparkle() {
      const [sparkles, setSparkles] = useState([]);
      const trigger = useCallback((x, y) => {
        const id = uid();
        const newSparkles = [];
        for (let i = 0; i < 10; i++) {
          const angle = (i / 10) * Math.PI * 2;
          const dist = 40 + Math.random() * 40;
          newSparkles.push({
            id: id + "-" + i,
            x: x + Math.cos(angle) * dist,
            y: y + Math.sin(angle) * dist,
            emoji: ["✨", "⭐", "🌟", "💫", "🎉"][Math.floor(Math.random() * 5)]
          });
        }
        setSparkles(prev => [...prev, ...newSparkles]);
        setTimeout(() => {
          setSparkles(prev => prev.filter(s => !newSparkles.find(ns => ns.id === s.id)));
        }, 1200);
      }, []);
      return { sparkles, trigger };
    }

      const { t } = useI18n();
      const { speak, speaking } = useSpeech();
      const { sparkles, trigger } = useSparkle();
      const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);

      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [results, setResults] = useState([]);

      if (!card) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      const answer = (ok, e) => {
        if (ok && e) {
          const rect = e.currentTarget.getBoundingClientRect();
          trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        const nr = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
        setResults(nr);
        if (idx + 1 >= cards.length) onFinish(nr, cards);
        else setIdx(idx + 1);
      };

      const isSaved = savedIds.includes(card.id);
      const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
      const l1 = getLang(set.lang1);
      const l2 = getLang(set.lang2);

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>

              <div className="game-title">{set.name}</div>
              <div className="game-subtitle">{t("card")} {idx + 1} {t("of")} {cards.length}</div>

                </div>
                <div className="lang-label">{l1.flag} {l1.name}</div>
                <div className="big">{card.word}</div>
                <div className="hint">✨ {t("tapToFlip")}</div>
              </div>
              <div className="face back">
                <div className="card-top-actions">
                  <button className={`card-round-btn ${isSaved ? "saved" : ""}`} onClick={(e) => { e.stopPropagation();
                      onToggleSaved(card.id); }}>{isSaved ? "⭐" : "☆"}</button>
                  <span className="card-chip">{idx + 1}/{cards.length}</span>
                  <button className={`card-round-btn ${speaking ? "speaking" : ""}`} onClick={(e) => { e.stopPropagation();
                      speak(card.translation, set.lang2); }}>🔊</button>

                <div className="lang-label">{l2.flag} {l2.name}</div>

            <button className="btn btn-danger btn-lg" onClick={() => answer(false)}>✗ {t("wrong")}</button>
            <button className="btn btn-success btn-lg" onClick={(e) => answer(true, e)}>✓ {t("correct")}</button>
          </div>

    // ================================================================
    //  GAME: MCQ
    // ================================================================
    function MCQGame({ set, onFinish, onExit, speed }) {
      const { t } = useI18n();
      const { speak } = useSpeech();
      const { sparkles, trigger } = useSparkle();
      const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);

      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [options, setOptions] = useState([]);
      const [results, setResults] = useState([]);
      const [time, setTime] = useState(speed ? 10 : 0);
      const card = cards[idx];

      useEffect(() => {
        if (!card) return;
        const others = set.words.filter(w => w.id !== card.id).map(w => w.translation).sort(() => Math.random() -
          0.5).slice(0, 3);
        setOptions(shuffle([card.translation, ...others]));
        setSelected(null);
        if (speed) setTime(10);
      }, [idx, card?.id]);

      useEffect(() => {
        if (!speed || selected !== null || !card) return;
        if (time <= 0) { choose(null); return; }
        const timer = setTimeout(() => setTime(tt => tt - 1), 1000);
        return () => clearTimeout(timer);
      }, [time, speed, selected, card?.id]);

      if (!card) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      const choose = (opt, e) => {
        if (selected !== null) return;
        const ok = opt === card.translation;
        if (ok && e) {
          const rect = e.currentTarget.getBoundingClientRect();
          trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        setSelected(opt === null ? "__timeout__" : opt);
        const nr = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
        setResults(nr);
        setTimeout(() => {
          if (idx + 1 >= cards.length) onFinish(nr, cards);
          else setIdx(idx + 1);
        }, 1000);
      };

      const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">{speed ? "⚡ " : "🎯 "}{set.name}</div>
              <div className="game-subtitle">{t("question")} {idx + 1} {t("of")} {cards.length}</div>
            </div>
            {speed ? <span className="card-chip" style={{ background: "rgba(102,126,234,0.15)", color: "var(--text-primary)" }}>⏱️ {time}s</span> :
              <div></div>}
          </div>

          <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }}></div></div>

          <div className="mcq-word-box glass">
            <button className="icon-btn" style={{ position: "absolute", top: 14, right: 14 }} onClick={() => speak(card
                .word, set.lang1)}>🔊</button>
            <div>{card.word}</div>
          </div>

          <div className="mcq-options">
            {options.map((opt, i) => {
              let cls = "mcq-option";
              if (selected !== null) {
                if (opt === card.translation) cls += " correct";
                else if (opt === selected) cls += " wrong";
              }
              return (
                <button key={i} className={cls} disabled={selected !== null} onClick={(e) => choose(opt, e)}>{opt}</button>
              );
            })}
          </div>
        </div>
      );
    }

    // ================================================================
    //  GAME: SPELLING
    // ================================================================
    function SpellingGame({ set, onFinish, onExit }) {
      const { t } = useI18n();
      const { speak } = useSpeech();
      const { sparkles, trigger } = useSparkle();
      const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);

      const [idx, setIdx] = useState(0);
      const [val, setVal] = useState("");
      const [msg, setMsg] = useState(null);
      const [results, setResults] = useState([]);
      const card = cards[idx];

      useEffect(() => {
        setVal("");
        setMsg(null);
        if (card) setTimeout(() => speak(card.translation, set.lang2), 300);
      }, [idx, card?.id]);

      if (!card) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      const submit = (e) => {
        if (!card || msg) return;
        const ok = val.trim().toLowerCase() === card.word.toLowerCase();
        if (ok && e) {
          const rect = e.currentTarget.getBoundingClientRect();
          trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        setMsg(ok ? "correct" : "wrong");
        const nr = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
        setResults(nr);
        setTimeout(() => {
          if (idx + 1 >= cards.length) onFinish(nr, cards);
          else setIdx(idx + 1);
        }, 1400);
      };

      const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
      const l2 = getLang(set.lang2);

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">✍️ {set.name}</div>
              <div className="game-subtitle">{t("question")} {idx + 1} {t("of")} {cards.length}</div>
            </div>
            <button className="icon-btn" onClick={() => speak(card.translation, set.lang2)} style={{ color: "var(--text-primary)" }}>🔊</button>
          </div>

          <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }}></div></div>

          <div className="spelling-box glass">
            <div style={{ fontSize: 13, color: "var(--text-secondary)", fontWeight: 600 }}>{l2.flag} {t("listenWrite")}</div>
            <div className="spelling-translation">{card.translation}</div>
          </div>

          <input className={`spelling-input ${msg || ""}`} value={val} onChange={e => setVal(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") submit(e); }} placeholder={t("typeWord")} disabled={!!msg} autoFocus />

          {msg === "wrong" && <div style={{ textAlign: "center", color: "var(--danger)", fontWeight: 700,
              marginBottom: 14 }}>❌ {t("letsLearn")} <strong>{card.word}</strong></div>}
          {msg === "correct" && <div style={{ textAlign: "center", color: "var(--success)", fontWeight: 700,
              marginBottom: 14 }}>✅ {t("greatJob")}</div>}

          <button className="btn btn-primary btn-block btn-lg" onClick={(e) => submit(e)} disabled={!val.trim() || !!msg}>
            {t("check")}
          </button>
        </div>
      );
    }

    // ================================================================
    //  GAME: MATCHING
    // ================================================================
    function MatchingGame({ set, onFinish, onExit }) {
      const { t } = useI18n();
      const { sparkles, trigger } = useSparkle();
      const pairs = useMemo(() => set.words.slice(0, 6), [set.id, set.words.length]);

      const [left] = useState(() => shuffle(pairs));
      const [right] = useState(() => shuffle(pairs));
      const [selL, setSelL] = useState(null);
      const [selR, setSelR] = useState(null);
      const [matched, setMatched] = useState([]);
      const [results, setResults] = useState([]);

      useEffect(() => {
        if (!selL || !selR) return;
        const ok = selL.id === selR.id;
        if (ok) {
          const btnL = document.querySelector(`[data-match="${selL.id}-l"]`);
          if (btnL) {
            const rect = btnL.getBoundingClientRect();
            trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
          }
        }
        const nr = [...results, { id: selL.id, correct: ok, word: selL.word, translation: selL.translation }];
        setResults(nr);
        if (ok) setMatched(m => [...m, selL.id]);
        setTimeout(() => {
          setSelL(null);
          setSelR(null);
          if (ok && matched.length + 1 === pairs.length) onFinish(nr, pairs);
        }, 500);
      }, [selL, selR]);

      if (pairs.length < 2) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">🔗 {set.name}</div>
              <div className="game-subtitle">{matched.length}/{pairs.length} {t("matchPairs")}</div>
            </div>
          </div>

          <div className="match-grid">
            <div>
              {left.map(item => (
                <button key={item.id} data-match={`${item.id}-l`}
                className={`match-btn ${selL?.id === item.id ? "selected" : ""} ${matched.includes(item.id) ? "matched" : ""}`}
                disabled={matched.includes(item.id)} onClick={() => { if (!selL || !selR) setSelL(item); }}>{item
                  .word}</button>
              ))}
            </div>
            <div>
              {right.map(item => (
                <button key={item.id} className={`match-btn ${selR?.id === item.id ? "selected" : ""} ${matched
                    .includes(item.id) ? "matched" : ""}`}
                disabled={matched.includes(item.id)} onClick={() => { if (!selL || !selR) setSelR(item); }}>{item
                  .translation}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ================================================================
    //  RESULTS
    // ================================================================
    function Results({ results, onRetry, onRetryWrong, onHome }) {
      const { t } = useI18n();
      const total = results.length;
      const correct = results.filter(r => r.correct).length;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      const wrong = results.filter(r => !r.correct);

      let label = t("tryAgain"),
        msg = t("msgTryAgain"),
        emoji = "💪";
      if (pct >= 90) { label = t("excellent");
        msg = t("msgExcellent");
        emoji = "🌟"; } else if (pct >= 70) { label = t("good");
        msg = t("msgGood");
        emoji = "👏"; } else if (pct >= 50) { label = t("fair");
        msg = t("msgFair");
        emoji = "👍"; }

      return (
        <div className="results-box glass">
          <div className="results-emoji">{emoji}</div>
          <h2 style={{ fontSize: 30, fontWeight: 900, marginBottom: 10 }}>{t("results")}</h2>
          <div className="score-circle">{pct}%</div>
          <div className="muted">{t("correctAnswers")}: <strong style={{ color: "var(--primary)", fontSize: 16 }}>{correct}
              /{total}</strong></div>
          <div style={{ margin: "16px 0", fontWeight: 800, fontSize: 19 }}>{label}</div>
          <div className="results-message">{msg}</div>

          {wrong.length > 0 && (
            <div className="wrong-words-section">
              <div className="wrong-words-title">❌ {t("wrongWords")}</div>
              {wrong.map((w, i) => (
                <div key={i} className="word-row">
                  <div><div className="word-row-text">{w.word}</div><div className="word-row-translation">→ {w
                      .translation}</div></div>
                </div>
              ))}
            </div>
          )}

          <button className="btn btn-primary btn-block btn-lg" onClick={onRetry}>🔄 {t("retry")}</button>
          {wrong.length > 0 && <button className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={
              onRetryWrong}>⭐ {t("retryWrong")}</button>}
          <button className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onHome}>🏠 {t("home")}</button>
        </div>
      );
    }

    // ================================================================
    //  LOGIN SCREEN
    // ================================================================
    function LoginScreen({ onGoogleSignIn, onGuestContinue, loading }) {
      const { t, locale, setLocale, langs } = useI18n();

      return (
        <div className="login-screen">
          <div className="login-card">
            <div className="logo">📚</div>
            <h1>{t("appName")}</h1>
            <div className="subtitle">{t("learnFun")}</div>

            <button
              className="btn btn-google btn-block btn-lg"
              onClick={onGoogleSignIn}
              disabled={loading}
            >
              <span style={{ fontSize: 22 }}>🔐</span>

            <button
              className="btn btn-secondary btn-block"
              onClick={onGuestContinue}

    // ================================================================
    //  MAIN APP
    // ================================================================
    function AppContent() {
      const { t, locale, setLocale, langs } = useI18n();
      const toast = useToast();
      const usage = useUsage();

      // Theme
      const [theme, setTheme] = useLocalStorage("vocaflow_theme", "light");
      useEffect(() => {
        document.documentElement.classList.toggle("dark-mode", theme === "dark");
      }, [theme]);
      const toggleTheme = () => setTheme(t => t === "light" ? "dark" : "light");

      // Auth state
      const [authUser, setAuthUser] = useLocalStorage("vocaflow_user", null);
      const [authLoading, setAuthLoading] = useState(false);
      const [isGuest, setIsGuest] = useLocalStorage("vocaflow_is_guest", false);

      // Data
      const [sets, setSets] = useLocalStorage("vocaflow_sets", DEFAULT_SETS);
      const [savedIds, setSavedIds] = useLocalStorage("vocaflow_saved", []);

      const [view, setView] = useState("home");
      const [currentSetId, setCurrentSetId] = useState(sets[0]?.id || null);
      const [gameType, setGameType] = useState("flashcards");
      const [gameKey, setGameKey] = useState(0);
      const [retryWrong, setRetryWrong] = useState(false);
      const [gameResults, setGameResults] = useState(null);
      const [modal, setModal] = useState(null);
      const [newSet, setNewSet] = useState({ name: "", lang1: "fr", lang2: "ar" });
      const [loginData, setLoginData] = useState({ name: "", email: "" });

      // Firebase auth handlers
      const handleGoogleSignIn = useCallback(async () => {
        if (!IS_FIREBASE_CONFIGURED || !firebaseAuth) {
          // Fallback: simulated sign-in
          const name = prompt("Enter your name (Google sign-in simulation):") || "Guest";
          setAuthUser({ name, email: "guest@demo.com", photoURL: null });
          setIsGuest(false);
          toast(t("savedMsg"), "success");
          return;
        }
        setAuthLoading(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          const result = await firebaseAuth.signInWithPopup(provider);
          const user = result.user;
          const userData = {
            name: user.displayName || "User",
            email: user.email,
            photoURL: user.photoURL,
            uid: user.uid,
            isGuest: false
          };
          setAuthUser(userData);
          setIsGuest(false);
          toast(t("savedMsg"), "success");

          // Load user data from Firestore
          if (firestore) {
            const doc = await firestore.collection("users").doc(user.uid).get();
            if (doc.exists) {
              const data = doc.data();
              if (data.sets) setSets(data.sets);
              if (data.savedIds) setSavedIds(data.savedIds);
              if (data.theme) setTheme(data.theme);
              if (data.locale) setLocale(data.locale);
            } else {
              // First time user — save initial data
              await firestore.collection("users").doc(user.uid).set({
                email: user.email,
                displayName: user.displayName,
                photoURL: user.photoURL,
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString(),
                theme: theme,
                locale: locale,
                sets: sets,
                savedIds: savedIds
              });
            }
          }
        } catch (err) {
          console.error("Google sign-in error:", err);
          toast(t("error") || "Sign-in failed", "error");
        }
        setAuthLoading(false);
      }, [sets, savedIds, theme, locale]);

      // Guest sign-in
      const handleGuestContinue = useCallback(() => {
        setAuthUser({ name: "Guest", email: "guest@demo.com", photoURL: null, isGuest: true });
        setIsGuest(true);
        toast(t("savedMsg"), "success");
      }, []);

      // Logout
      const handleLogout = useCallback(() => {
        if (firebaseAuth && !isGuest) {
          firebaseAuth.signOut().catch(() => {});
        }
        setAuthUser(null);
        setIsGuest(false);
        toast(t("logout"), "info");
      }, [isGuest]);

      // Check for existing Firebase session
      useEffect(() => {
        if (IS_FIREBASE_CONFIGURED && firebaseAuth && !authUser && !isGuest) {
          const unsubscribe = firebaseAuth.onAuthStateChanged(async (user) => {
            if (user) {
              const userData = {
                name: user.displayName || "User",
                email: user.email,
                photoURL: user.photoURL,
                uid: user.uid,
                isGuest: false
              };
              setAuthUser(userData);
              if (firestore) {
                try {
                  const doc = await firestore.collection("users").doc(user.uid).get();
                  if (doc.exists) {
                    const data = doc.data();
                    if (data.sets) setSets(data.sets);
                    if (data.savedIds) setSavedIds(data.savedIds);
                    if (data.theme) setTheme(data.theme);
                    if (data.locale) setLocale(data.locale);
                  }
                } catch (e) { /* ignore */ }
              }
            }
          });
          return () => unsubscribe();
        }
      }, []);

      // Auto-save to Firestore
      useEffect(() => {
        if (IS_FIREBASE_CONFIGURED && firestore && authUser && !authUser.isGuest && authUser.uid) {
          const saveTimeout = setTimeout(() => {
            firestore.collection("users").doc(authUser.uid).set({
              email: authUser.email,
              displayName: authUser.name,
              photoURL: authUser.photoURL,
              lastLogin: new Date().toISOString(),
              theme: theme,
              locale: locale,
              sets: sets,
              savedIds: savedIds
            }, { merge: true }).catch(() => {});
          }, 1000);
          return () => clearTimeout(saveTimeout);
        }
      }, [sets, savedIds, theme, locale, authUser]);

      // If not authenticated and not guest, show login
      if (!authUser) {
        return (
          <LoginScreen
            onGoogleSignIn={handleGoogleSignIn}
            onGuestContinue={handleGuestContinue}
            loading={authLoading}
          />
        );
      }

      // Main app
      useEffect(() => {
        if (!currentSetId && sets.length) setCurrentSetId(sets[0].id);
        if (currentSetId && !sets.find(s => s.id === currentSetId)) {
          setCurrentSetId(sets[0]?.id || null);
        }
      }, [sets, currentSetId]);

      const currentSet = sets.find(s => s.id === currentSetId) || null;
      const savedWords = sets.flatMap(s =>
        s.words.filter(w => savedIds.includes(w.id)).map(w => ({ ...w, lang1: s.lang1, lang2: s.lang2 }))
      );
      const savedSet = savedWords.length ? {
        id: "saved",
        name: t("sanctuary"),
        lang1: savedWords[0].lang1,
        lang2: savedWords[0].lang2,
        words: savedWords
      } : null;

      const baseSet = gameType === "saved" ? savedSet : currentSet;
      const wrongIds = gameResults ? [...new Set(gameResults.filter(r => !r.correct).map(r => r.id))] : [];
      const gameSet = retryWrong && gameResults && baseSet ?
        { ...baseSet, words: baseSet.words.filter(w => wrongIds.includes(w.id)) } :
        baseSet;

      const updateSet = (updated) => { setSets(prev => prev.map(s => s.id === updated.id ? updated : s)); };
      const deleteSet = (id) => { setSets(prev => prev.filter(s => s.id !== id));
        toast(t("deleted"), "info"); };
      const deleteWord = (setId, wordId) => {
        setSets(prev => prev.map(s => s.id !== setId ? s : { ...s, words: s.words.filter(w => w.id !== wordId) }));
      };
      const toggleSaved = (wordId) => {
        setSavedIds(prev => prev.includes(wordId) ? prev.filter(id => id !== wordId) : [...prev, wordId]);
      };

      const createSet = () => {
        if (!newSet.name.trim()) { toast(t("setName"), "error"); return; }
        const set = { id: "set" + uid(), name: newSet.name.trim(), lang1: newSet.lang1, lang2: newSet.lang2, words: [] };
        setSets(prev => [...prev, set]);
        setCurrentSetId(set.id);
        setModal(null);
        setNewSet({ name: "", lang1: "fr", lang2: "ar" });
        toast(t("created"), "success");
      };

      const startGame = (type) => {
        if (type === "saved") {
          if (!savedWords.length) { toast(t("noSaved"), "error"); return; }
          setGameType("saved");
          setRetryWrong(false);
          setGameKey(Date.now());
          setView("game");
          return;
        }
        if (!currentSet) { toast(t("needSelectSet"), "error"); return; }
        if (!currentSet.words.length) { toast(t("noWords"), "error"); return; }
        setGameType(type);
        setRetryWrong(false);
        setGameKey(Date.now());
        setView("game");
      };

      const finishGame = (results) => {
        setGameResults(results);
        setView("results");
      };

      const games = [
        { type: "flashcards", name: t("flashcards") },
        { type: "mcq", name: t("mcq") },
        { type: "spelling", name: t("spelling") },
        { type: "matching", name: t("matching") },
        { type: "speed", name: t("speed") }
      ];

      const renderHome = () => (
        <div>
          <div className="topbar">
            <div className="site-logo" onClick={() => setView("home")}>
              <h1>📚 {t("appName")}</h1>
              <div className="tagline">{t("tagline")}</div>
            </div>
            <div className="top-actions">
              <button className="theme-toggle" onClick={toggleTheme} title={theme === "light" ? t("darkMode") : t(
                  "lightMode")}>
                {theme === "light" ? "🌙" : "☀️"}
              </button>
            </div>
          </div>

          <ProfileCard
            user={authUser}
            usage={usage}
            savedCount={savedWords.length}
            onSettings={() => setModal("settings")}
            onLogin={() => setModal("login")}
            onLogout={handleLogout}
          />

          <div style={{ marginTop: 18 }}>
            <SelectSetDropdown
              sets={sets}
              currentSetId={currentSetId}
              onSelect={(id) => setCurrentSetId(id)}
              onEdit={(id) => { setCurrentSetId(id);
                setView("editor"); }}
              onDelete={deleteSet}
              onCreate={() => setModal("createSet")}
            />
          </div>

          <Sanctuary count={savedWords.length} onPlay={() => startGame("saved")} />

          <div className="section-title">🎮 {t("games")}</div>
          <div className="games-grid">
            {games.map(g => (
              <div key={g.type} className="game-card" onClick={() => startGame(g.type)}>
                <div className="game-icon-wrap" style={{ background: `rgba(102,126,234,0.08)` }}>
                  <GameIcon type={g.type} />
                </div>
                <div className="game-name">{g.name}</div>
              </div>
            ))}
          </div>
        </div>
      );

      const renderGame = () => {
        if (!gameSet) return null;
        if (gameType === "flashcards" || gameType === "saved") {
          return (
            <FlashcardsGame
              key={gameKey}
              set={gameSet}
              savedIds={savedIds}
              onToggleSaved={toggleSaved}
              onFinish={finishGame}
              onExit={() => setView("home")}
            />
          );
        }
        if (gameType === "mcq" || gameType === "speed") {
          return (
            <MCQGame
              key={gameKey}
              set={gameSet}
              onFinish={finishGame}
              onExit={() => setView("home")}
              speed={gameType === "speed"}
            />
          );
        }
        if (gameType === "spelling") {
          return (
            <SpellingGame
              key={gameKey}
              set={gameSet}
              onFinish={finishGame}
              onExit={() => setView("home")}
            />
          );
        }
        if (gameType === "matching") {
          return (
            <MatchingGame
              key={gameKey}
              set={gameSet}
              onFinish={finishGame}
              onExit={() => setView("home")}
            />
          );
        }
        return null;
      };

      const renderResults = () => {
        if (!gameResults) return null;
        return (
          <Results
            results={gameResults}
            onRetry={() => { setRetryWrong(false);
              setGameKey(Date.now());
              setView("game"); }}
            onRetryWrong={() => { setRetryWrong(true);
              setGameKey(Date.now());
              setView("game"); }}
            onHome={() => setView("home")}
          />
        );
      };

      const renderModal = () => {
        if (modal === "createSet") {
          return (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3>➕ {t("createSet")}</h3>
                <div className="field"><label>{t("setName")}</label><input value={newSet.name} onChange={e =>
                    setNewSet({ ...newSet, name: e.target.value })} autoFocus /></div>
                <div className="grid-2">
                  <div className="field"><label>{t("firstLang")}</label><select value={newSet.lang1} onChange={e =>
                      setNewSet({ ...newSet, lang1: e.target.value })}>{langs.map(l => <option key={l.code}
                        value={l.code}>{l.flag} {l.name}</option>)}</select></div>
                  <div className="field"><label>{t("secondLang")}</label><select value={newSet.lang2} onChange={e =>
                      setNewSet({ ...newSet, lang2: e.target.value })}>{langs.map(l => <option key={l.code}
                        value={l.code}>{l.flag} {l.name}</option>)}</select></div>
                </div>
                <div className="modal-actions">
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
                  <button className="btn btn-primary" onClick={createSet}>{t("save")}</button>
                </div>
              </div>
            </div>
          );
        }
        if (modal === "settings") {
          return (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3>⚙️ {t("settings")}</h3>
                <div className="field"><label>🌍 {t("language")}</label><select value={locale} onChange={e =>
                    setLocale(e.target.value)}>{langs.map(l => <option key={l.code} value={l.code}>{l.flag} {l
                        .name}</option>)}</select></div>
                <div className="field"><label>{t("theme")}</label><select value={theme} onChange={e => setTheme(e
                    .target.value)}><option value="light">☀️ {t("lightMode")}</option><option value="dark">🌙 {t(
                      "darkMode")}</option></select></div>
                <div className="modal-actions"><button className="btn btn-primary btn-block" onClick={() =>
                    setModal(null)}>{t("close")}</button></div>
              </div>
            </div>
          );
        }
        return null;
      };

      return (
        <div className="app">
          {view === "home" && renderHome()}
          {view === "editor" && currentSet && (
            <SetEditor
              set={currentSet}
              onBack={() => setView("home")}
              onUpdate={updateSet}
              onDeleteWord={deleteWord}
            />
          )}
          {view === "game" && renderGame()}
          {view === "results" && renderResults()}
          {renderModal()}
        </div>
      );
    }

    // ================================================================
    //  ROOT
    // ================================================================
    function Root() {
      return (
        <I18nProvider>
          <ToastProvider>
            <AppContent />
          </ToastProvider>
        </I18nProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
