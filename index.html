        // ============================================================
        //  SPEECH
        // ============================================================
        function useSpeech(defaultRate = 0.9, defaultPitch = 1.0) {
            const [speaking, setSpeaking] = useState(false);
            const [voices, setVoices] = useState([]);
            const [voicesLoaded, setVoicesLoaded] = useState(false);
            useEffect(() => {
                if (!window.speechSynthesis) return;
                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    if (availableVoices.length > 0) {
                        setVoices(availableVoices);
                        setVoicesLoaded(true);
                    }
                };
                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
                return () => {
                    if (window.speechSynthesis.onvoiceschanged !== undefined) {
                        window.speechSynthesis.onvoiceschanged = null;
                    }
                    window.speechSynthesis.cancel();
                };
            }, []);
            const getLocaleFromCode = (code) => {
                if (!code) return 'en-US';
                const localeMap = { 'ar': 'ar-SA', 'en': 'en-US', 'fr': 'fr-FR', 'es': 'es-ES',
                    'de': 'de-DE', 'it': 'it-IT', 'pt': 'pt-PT', 'nl': 'nl-NL',
                    'tr': 'tr-TR', 'ja': 'ja-JP', 'ko': 'ko-KR', 'zh': 'zh-CN',
                    'ru': 'ru-RU' };
                return localeMap[code] || code;
            };
            const getBestVoice = useCallback((langCode) => {
                if (!voicesLoaded || voices.length === 0) return null;
                const targetLocale = getLocaleFromCode(langCode);
                const baseLang = targetLocale.split('-')[0];
                let exactLocal = voices.find(v => v.lang === targetLocale && v.localService);
                if (exactLocal) return exactLocal;
                let exactAny = voices.find(v => v.lang === targetLocale);
                if (exactAny) return exactAny;
                let baseLocal = voices.find(v => v.lang.startsWith(baseLang + '-') && v.localService);
                if (baseLocal) return baseLocal;
                let baseAny = voices.find(v => v.lang.startsWith(baseLang + '-'));
                if (baseAny) return baseAny;
                let prefixMatch = voices.find(v => v.lang.startsWith(baseLang));
                if (prefixMatch) return prefixMatch;
                return voices.find(v => v.default) || voices[0] || null;
            }, [voices, voicesLoaded]);
            const speakText = useCallback((text, lang, options = {}) => {
                if (!window.speechSynthesis || !text) return;
                window.speechSynthesis.cancel();
                setTimeout(() => {
                    const processedText = text.trim();
                    if (!processedText) return;
                    const utterance = new SpeechSynthesisUtterance(processedText);
                    const targetLocale = getLocaleFromCode(lang);
                    utterance.rate = options.rate !== undefined ? options.rate : defaultRate;
                    utterance.pitch = options.pitch !== undefined ? options.pitch : defaultPitch;
                    utterance.volume = 1.0;
                    const bestVoice = getBestVoice(lang);
                    if (bestVoice) {
                        utterance.voice = bestVoice;
                        utterance.lang = bestVoice.lang;
                    } else {
                        utterance.lang = targetLocale;
                    }
                    utterance.onstart = () => setSpeaking(true);
                    utterance.onend = () => setSpeaking(false);
                    utterance.onerror = (e) => { console.warn('Speech error:', e.error);
                        setSpeaking(false); };
                    if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); }
                    window.speechSynthesis.speak(utterance);
                }, 50);
            }, [defaultRate, defaultPitch, getBestVoice]);
            const cancel = useCallback(() => {
                if (window.speechSynthesis) { window.speechSynthesis.cancel(); }
                setSpeaking(false);
            }, []);
            return { speakText, cancel, speaking, voices, voicesLoaded };
        }

        // ============================================================
        //  TRANSLATION API
        // ============================================================
        function useTranslation() {
            const [loading, setLoading] = useState(false);
            const cacheRef = useRef({});
            const translate = useCallback(async (text, from, to) => {
                try {
                    if (!text || text.trim().length < 1 || from === to) return { text, suggestions: [] };
                    const key = `${from}|${to}|${text.trim().toLowerCase()}`;
                    if (cacheRef.current[key]) return cacheRef.current[key];
                    setLoading(true);
                    const q = encodeURIComponent(text.trim());
                    const url = `https://api.mymemory.translated.net/get?q=${q}&langpair=${from}|${to}`;
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    try {
                        const res = await fetch(url, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        const data = await res.json();
                        const main = data?.responseData?.translatedText || "";
                        const matches = data?.matches || [];
                        const suggestions = matches.filter(m => m.translation && m.translation.toLowerCase() !== main
                            .toLowerCase()).slice(0, 3).map(m => m.translation);
                        const result = { text: main, suggestions };
                        cacheRef.current[key] = result;
                        return result;
                    } catch (fetchErr) {
                        clearTimeout(timeoutId);
                        return { text: "", suggestions: [] };
                    }
                } catch (e) { return { text: "", suggestions: [] }; } finally { setLoading(false); }
            }, []);
            return { translate, loading };
        }

        // ============================================================
        //  USAGE TRACKING
        // ============================================================
        function useUsage() {
            const [stored, setStored] = useLocalStorage("vocaflow_usage", { total: 0, daily: {}, sessions: 0,
                bestScore: 0 });
            const sessionRef = useRef(0);
            const [, forceUpdate] = useState(0);
            useEffect(() => {
                const tick = setInterval(() => { sessionRef.current += 1;
                    forceUpdate(n => n + 1); }, 1000);
                const save = () => {
                    try {
                        const secs = sessionRef.current;
                        if (secs > 0) {
                            const day = new Date().toISOString().slice(0, 10);
                            setStored(prev => ({ total: (prev.total || 0) + secs, sessions: (prev.sessions || 0) + 1,
                                bestScore: prev.bestScore || 0, daily: { ...(prev.daily || {}),
                                    [day]: ((prev.daily?.[day]) || 0) + secs } }));
                            sessionRef.current = 0;
                        }
                    } catch {}
                };
                const periodic = setInterval(save, 30000);
                const onUnload = () => save();
                window.addEventListener("beforeunload", onUnload);
                return () => { clearInterval(tick);
                    clearInterval(periodic);
                    save();
                    window.removeEventListener("beforeunload", onUnload); };
            }, []);
            const updateBestScore = (pct) => { try { setStored(prev => ({ ...prev, bestScore: Math.max(prev.bestScore ||
                        0, pct) })); } catch {} };
            const day = new Date().toISOString().slice(0, 10);
            const total = (stored.total || 0) + sessionRef.current;
            const today = ((stored.daily?.[day]) || 0) + sessionRef.current;
            const level = Math.min(Math.floor(total / 60 / 15) + 1, 99);
            const sessions = (stored.sessions || 0);
            const bestScore = stored.bestScore || 0;
            const weekDays = [];
            for (let i = 6; i >= 0; i--) { const d = new Date();
                d.setDate(d.getDate() - i); const key = d.toISOString().slice(0, 10);
                weekDays.push({ label: d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2), value: stored
                        .daily?.[key] || 0, date: key }); }
            const maxWeek = Math.max(1, ...weekDays.map(d => d.value));
            const fmt = (s) => { if (s < 60) return s + "s"; if (s < 3600) return Math.floor(s / 60) + "m"; return Math
                    .floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m"; };
            return { total, today, level, sessions, bestScore, weekDays, maxWeek, fmt, updateBestScore, daily: stored
                    .daily || {} };
        }

        // ============================================================

            // ============================================================

            function SelectSetDropdown({ sets, currentSetId, onSelect, onEdit, onDelete, onCreate }) {

                    // ============================================================

                                        setTranslation(r.text); });

                        }, [word, fromLang, toLang, manualEdit, translate]);
                        const handleSave = () => { if (!word.trim() || !translation.trim()) return;
                            onSave({ id: "w" + uid(), word: word.trim(), translation: translation.trim() });

                                /div> <
                                /div>

                        // ============================================================
                        //  SET EDITOR
                        // ============================================================
                        function SetEditor({ set, onBack, onUpdate, onDeleteWord }) {

                                    /> <
                                    /div> <
                                    div className = "grid-2" >

                                    div className = "editor-box glass" >

                                            /div>
                                        )
                                    } {
                                        set.words.map(w => ( <
                                            div key = { w.id }
                                            className = "word-row" >
                                            <
                                            div className = "word-row-main" >

                                            div className = "word-row-text" > { w.word } < /div> <
                                            div className = "word-row-translation" > →
                                            { w.translation } < /div> <
                                            /div> <
                                            div className = "flex-row" >
                                            <
                                            button className = "icon-btn"
                                            onClick = {
                                                () => speakText(w.word, lang1) }
                                            title = "🔊" > 🔊 < /button> <

                                            onClick = {

                                            title = "🔊" > 🔊 < /button> <

                            // ============================================================
                            //  SANCTUARY
                            // ============================================================
                            function Sanctuary({ count, onPlay }) {

                                return ( <

                                        /div> <
                                        /div>

                                // ============================================================
                                //  FLASHCARD GAME — 3D FLIP
                                // ============================================================
                                function FlashcardsGame({ set, savedIds, onToggleSaved, onFinish, onExit, voiceSettings }) {
                                    const { t } = useI18n();
                                    const { speakText, speaking } = useSpeech(voiceSettings.rate, voiceSettings.pitch);
                                    const { sparkles, trigger } = useSparkle();
                                    const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);
                                    const [idx, setIdx] = useState(0);
                                    const [flipped, setFlipped] = useState(false);
                                    const [results, setResults] = useState([]);
                                    const [exit, setExit] = useState(null);
                                    const [hintDone, setHintDone] = useState(false);
                                    const card = cards[idx];

                                    useEffect(() => { setFlipped(false);
                                        setExit(null); }, [idx]);
                                    useEffect(() => { if (!hintDone) { const timer = setTimeout(() => setHintDone(true),
                                            400); return () => clearTimeout(timer); } }, []);

                                    if (!card) return ( <
                                        div className = "glass results-box" >
                                        <
                                        p > { t("noWords") } < /p> <
                                        button className = "btn btn-primary"
                                        onClick = { onExit } > { t("home") } < /button> <
                                        /div>
                                    );

                                    const answer = (ok, e) => {
                                        if (ok && e) { const rect = e.currentTarget.getBoundingClientRect();
                                            trigger(rect.left + rect.width / 2, rect.top + rect.height / 2); }
                                        const newResults = [...results, { id: card.id, correct: ok, word: card.word,
                                            translation: card.translation }];
                                        setResults(newResults);
                                        if (idx + 1 >= cards.length) { onFinish(newResults, cards); } else { setIdx(idx +
                                                1); }
                                    };

                                    const handleFlip = () => { if (!exit) setFlipped(f => !f); };

                                    const isSaved = savedIds.includes(card.id);
                                    const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
                                    const l1 = getLang(set.lang1);
                                    const l2 = getLang(set.lang2);

                                    return ( <
                                            div >
                                            { sparkles.length > 0 && ( <
                                                div className = "sparkle-container" > {
                                                    sparkles.map(s => ( <
                                                        div key = { s.id }
                                                        className = "sparkle"
                                                        style = { { left: s.x, top: s.y } } >
                                                        { s.emoji } <
                                                        /div>
                                                    ))
                                                } <
                                                /div>
                                            ) } <
                                            div className = "game-header" >
                                            <
                                            button className = "icon-btn"
                                            onClick = { onExit } > ✕ < /button> <
                                            div style = { { textAlign: "center", flex: 1 } } >
                                            <
                                            div className = "game-title" > { set.name } < /div> <
                                            div className = "game-subtitle" > { t("card") } { idx + 1 } { t("of") } { cards
                                                .length } < /div> <
                                            /div> <
                                            button className = "icon-btn"
                                            onClick = {
                                                () => answer(false) } > ⏭️ < /button> <
                                            /div> <
                                            div className = "progress-bar" >
                                            <
                                            div className = "progress-fill"
                                            style = { { width: progress + "%" } }
                                            /> <
                                            /div> <
                                            div className = "flashcard-wrap" >
                                            <
                                            div className = { `flashcard-container ${flipped ? 'flipped' : ''} ${!hintDone ? 'hint-tilt' : ''}` }
                                            onClick = { handleFlip } >
                                            <
                                            div className = "flashcard-inner" >
                                            <
                                            div className = "flashcard-face front" >
                                            <
                                            div className = "flashcard-top-actions" >

                                            button className = { `flashcard-round-btn ${isSaved ? "saved" : ""}` }
                                            onClick = {
                                                (e) => { e.stopPropagation();
                                                    onToggleSaved(card.id); } } >
                                            { isSaved ? "⭐" : "☆" } <
                                            /button> <
                                            span className = "flashcard-chip" > { idx + 1 } / { cards.length } <
                                            /span> <
                                            button className = { `flashcard-round-btn ${speaking ? "speaking" : ""}` }
                                            onClick = {
                                                (e) => { e.stopPropagation();
                                                    speakText(card.word, set.lang1); } } >
                                            🔊 <
                                            /button> <
                                            /div> <
                                            div className = "lang-label" > { l1.flag } { l1.name } < /div> <
                                            div className = "big" > { card.word } < /div> <
                                            div className = "hint" > ✨ { t("dragHint") } < /div> <
                                            /div> <
                                            div className = "flashcard-face back" >
                                            <
                                            div className = "flashcard-top-actions" >
                                            <
                                            button className = { `flashcard-round-btn ${isSaved ? "saved" : ""}` }
                                            onClick = {
                                                (e) => { e.stopPropagation();
                                                    onToggleSaved(card.id); } } >
                                            { isSaved ? "⭐" : "☆" } <
                                            /button> <
                                            span className = "flashcard-chip" > { idx + 1 } / { cards.length } <
                                            /span> <
                                            button className = { `flashcard-round-btn ${speaking ? "speaking" : ""}` }
                                            onClick = {
                                                (e) => { e.stopPropagation();
                                                    speakText(card.translation, set.lang2); } } >
                                            🔊 <
                                            /button> <
                                            /div> <
                                            div className = "lang-label" > { l2.flag } { l2.name } < /div> <
                                            div className = "big" > { card.translation } < /div> <
                                            div className = "hint" > ✨ { t("dragHint") } < /div> <
                                            /div> <

                                            button className = "btn btn-success btn-lg"

                                            ✓ { t("correct") } <
                                            /button> <
                                            /div> <
                                            /div>

                                    // ============================================================
                                    //  MCQ GAME
                                    // ============================================================
                                    function MCQGame({ set, onFinish, onExit, voiceSettings }) {
                                        const { t } = useI18n();
                                        const { speakText } = useSpeech(voiceSettings.rate, voiceSettings.pitch);
                                        const { sparkles, trigger } = useSparkle();
                                        const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);
                                        const [idx, setIdx] = useState(0);
                                        const [selected, setSelected] = useState(null);
                                        const [options, setOptions] = useState([]);
                                        const [results, setResults] = useState([]);
                                        const card = cards[idx];
                                        useEffect(() => { if (!card) return; const others = set.words.filter(w => w.id !==
                                                card.id).map(w => w.translation).sort(() => Math.random() - 0.5).slice(0,
                                                3);
                                            setOptions(shuffle([card.translation, ...others]));
                                            setSelected(null); }, [idx, card?.id]);
                                        if (!card) return ( <
                                            div className = "glass results-box" >
                                            <
                                            p > { t("noWords") } < /p> <
                                            button className = "btn btn-primary"
                                            onClick = { onExit } > { t("home") } < /button> <
                                            /div>
                                        );
                                        const choose = (opt, e) => { if (selected !== null) return; const ok = opt ===
                                                card.translation; if (ok && e) { const rect = e.currentTarget
                                                .getBoundingClientRect();
                                                trigger(rect.left + rect.width / 2, rect.top + rect.height / 2); }
                                            setSelected(opt);
                                            const res = [...results, { id: card.id, correct: ok, word: card.word,
                                                translation: card.translation }];
                                            setResults(res);
                                            setTimeout(() => { if (idx + 1 >= cards.length) { onFinish(res, cards); } else
                                                    { setIdx(idx + 1); } }, 1100); };
                                        const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
                                        return ( <
                                                div >
                                                { sparkles.length > 0 && ( <
                                                    div className = "sparkle-container" > {
                                                        sparkles.map(s => ( <
                                                            div key = { s.id }
                                                            className = "sparkle"
                                                            style = { { left: s.x, top: s.y } } >
                                                            { s.emoji } <
                                                            /div>
                                                        ))
                                                    } <
                                                    /div>
                                                ) } <
                                                div className = "game-header" >

                                        // ============================================================

                                            // ============================================================

                                                // ============================================================

                                                function Results({ results, onRetry, onRetryWrong, onHome }) {

                                                    // ============================================================
                                                    //  SPARKLE
                                                    // ============================================================
                                                    function useSparkle() {

                                                        const trigger = useCallback((x, y) => {
                                                            try {
                                                                const id = uid();
                                                                const newSparkles = [];

                                                                    const distance = 45 + Math.random() * 35;

                                                                            .cos(angle) * distance, y: y + Math.sin(

                                                                            "🌟", "💫", "🎉"

                                                                    !newSparkles.find(ns => ns.id === s.id))); },

                                                        }, []);
                                                        return { sparkles, trigger };

                                                    // ============================================================
                                                    //  STATS VIEW — 7-DAY STRIP + ANNUAL BOTTOM SHEET
                                                    // ============================================================
                                                    function StatsView({ usage, savedCount, totalWords, sets }) {
                                                        const { t } = useI18n();

                                                        // Aggregate by month

                                                        Object.keys(dailyData).forEach(dateKey => {
                                                            const d = new Date(dateKey + 'T00:00:00');
                                                            if (isNaN(d.getTime())) return;

                                                            const month = d.getMonth();
                                                            const key = `${year}-${String(month+1).padStart(2,'0')}`;
                                                            if (!monthData[key]) monthData[key] = { year, month,
                                                                days: {}, total: 0 };
                                                            monthData[key].days[dateKey] = (monthData[key].days[
                                                                dateKey] || 0) + dailyData[dateKey];
                                                            monthData[key].total += dailyData[dateKey];
                                                        });

                                                        // Sort months
                                                        const sortedMonths = Object.keys(monthData).sort();

                                                        // Compute yearly totals

                                                        let yearlyTime = 0;
                                                        sortedMonths.forEach(key => {
                                                            yearlyTotal += Object.keys(monthData[key].days).length;
                                                            yearlyTime += monthData[key].total;
                                                        });

                                                        // Streak: count consecutive days with activity
                                                        const getStreak = () => {
                                                            let streak = 0;
                                                            const d = new Date();
                                                            for (let i = 0; i < 365; i++) {
                                                                const key = d.toISOString().slice(0, 10);
                                                                if (dailyData[key] && dailyData[key] > 0) { streak +=
                                                                        1;
                                                                    d.setDate(d.getDate() - 1); } else break;
                                                            }
                                                            return streak;
                                                        };
                                                        const streak = getStreak();

                                                        const monthNames = [

                                                                    /div>

                                                                            div className =
                                                                            "annual-summary-bar" >

                                                                            "annual-summary-item" >

                                                                                                .toISOString()

                                                                                                    0,
                                                                                                    10

                                                                                            sparkData

                                                                                                    dailyData[
                                                                                                        dk

                                                                                                1, ...sparkData

                                                                                            div key = { mi }
                                                                                            className = { `month-card ${isCurrent ? 'current' : ''} ${!data ? 'inactive' : ''}` }

                                                                                                () => { if (
                                                                                                    data
                                                                                                    ) handleMonthClick(
                                                                                                        key

                                                                                            <
                                                                                            div className =
                                                                                            "month-name" >
                                                                                            { getMonthName(
                                                                                                mi

                                                                                            /div> <
                                                                                            div className =
                                                                                            "month-count" >
                                                                                            { data ?
