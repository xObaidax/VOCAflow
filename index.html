                                                                                                                "tabs" >
                                                                                                                <
                                                                                                                div className = { `tab ${settingsTab === "general" ? "active" : ""}` }
                                                                                                                onClick = {
                                                                                                                    () =>
                                                                                                                    setSettingsTab(
                                                                                                                        "general"
                                                                                                                        ) } >
                                                                                                                🌍 { t(
                                                                                                                    "language"
                                                                                                                    ) } <
                                                                                                                /div> <
                                                                                                                div className = { `tab ${settingsTab === "voice" ? "active" : ""}` }
                                                                                                                onClick = {
                                                                                                                    () =>
                                                                                                                    setSettingsTab(
                                                                                                                        "voice"
                                                                                                                        ) } >
                                                                                                                🔊 { t(
                                                                                                                    "voiceSettings"
                                                                                                                    ) } <
                                                                                                                /div> <
                                                                                                                div className = { `tab ${settingsTab === "data" ? "active" : ""}` }
                                                                                                                onClick = {
                                                                                                                    () =>
                                                                                                                    setSettingsTab(
                                                                                                                        "data"
                                                                                                                        ) } >
                                                                                                                💾 Backup <
                                                                                                                /div> <
                                                                                                                /div> {
                                                                                                                    settingsTab ===
                                                                                                                    "general" && ( <
                                                                                                                        div >
                                                                                                                        <
                                                                                                                        div className =
                                                                                                                        "field" >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        🌍 { t(
                                                                                                                            "language"
                                                                                                                            ) } <
                                                                                                                        /label> <
                                                                                                                        select value = { locale }
                                                                                                                        onChange = { e =>
                                                                                                                            setLocale(
                                                                                                                                e
                                                                                                                                .target
                                                                                                                                .value
                                                                                                                                ) } >
                                                                                                                        {
                                                                                                                            langs
                                                                                                                            .map(
                                                                                                                                l => ( <
                                                                                                                                    option key = { l
                                                                                                                                            .code }
                                                                                                                                    value = { l
                                                                                                                                            .code } >
                                                                                                                                    { l
                                                                                                                                        .flag } { l
                                                                                                                                        .name } <
                                                                                                                                    /option>
                                                                                                                                )
                                                                                                                            )
                                                                                                                        } <
                                                                                                                        /select> <
                                                                                                                        /div> <
                                                                                                                        div className =
                                                                                                                        "field" >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        { t(
                                                                                                                            "theme"
                                                                                                                            ) } <
                                                                                                                        /label> <
                                                                                                                        button className =
                                                                                                                        "btn btn-secondary"
                                                                                                                        onClick = { toggleTheme }
                                                                                                                        style = { { width: "100%" } } >
                                                                                                                        { theme ===
                                                                                                                            "light" ?
                                                                                                                            "🌙 " +
                                                                                                                            t(
                                                                                                                                "darkMode"
                                                                                                                                ) :
                                                                                                                            "☀️ " +
                                                                                                                            t(
                                                                                                                                "lightMode"
                                                                                                                                ) } <
                                                                                                                        /button> <
                                                                                                                        /div> <
                                                                                                                        /div>
                                                                                                                    )
                                                                                                                } {
                                                                                                                    settingsTab ===
                                                                                                                    "voice" && ( <
                                                                                                                        div >
                                                                                                                        <
                                                                                                                        div className =
                                                                                                                        "field" >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        ⚡ { t(
                                                                                                                            "speechRate"
                                                                                                                            ) } : { voiceSettings
                                                                                                                            .rate
                                                                                                                            .toFixed(
                                                                                                                                2
                                                                                                                                ) } <
                                                                                                                        /label> <
                                                                                                                        div className =
                                                                                                                        "slider-wrap" >
                                                                                                                        <
                                                                                                                        span > 🐢 <
                                                                                                                        /span> <
                                                                                                                        input type =
                                                                                                                        "range"
                                                                                                                        min = "0.5"
                                                                                                                        max = "1.5"
                                                                                                                        step = "0.05"
                                                                                                                        value = { voiceSettings
                                                                                                                            .rate }
                                                                                                                        onChange = { e =>
                                                                                                                            setVoiceSettings({ ...
                                                                                                                                    voiceSettings,
                                                                                                                                    rate: parseFloat(
                                                                                                                                        e
                                                                                                                                        .target
                                                                                                                                        .value
                                                                                                                                        )
                                                                                                                                }) }
                                                                                                                        /> <
                                                                                                                        span > 🐇 <
                                                                                                                        /span> <
                                                                                                                        span className =
                                                                                                                        "slider-value" >
                                                                                                                        { voiceSettings
                                                                                                                            .rate
                                                                                                                            .toFixed(
                                                                                                                                2
                                                                                                                                ) } <
                                                                                                                        /span> <
                                                                                                                        /div> <
                                                                                                                        /div> <
                                                                                                                        div className =
                                                                                                                        "field" >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        🎵 { t(
                                                                                                                            "pitch"
                                                                                                                            ) } : { voiceSettings
                                                                                                                            .pitch
                                                                                                                            .toFixed(
                                                                                                                                2
                                                                                                                                ) } <
                                                                                                                        /label> <
                                                                                                                        div className =
                                                                                                                        "slider-wrap" >
                                                                                                                        <
                                                                                                                        span > ⬇ <
                                                                                                                        /span> <
                                                                                                                        input type =
                                                                                                                        "range"
                                                                                                                        min = "0.5"
                                                                                                                        max = "1.5"
                                                                                                                        step = "0.05"
                                                                                                                        value = { voiceSettings
                                                                                                                            .pitch }
                                                                                                                        onChange = { e =>
                                                                                                                            setVoiceSettings({ ...
                                                                                                                                    voiceSettings,
                                                                                                                                    pitch: parseFloat(
                                                                                                                                        e
                                                                                                                                        .target
                                                                                                                                        .value
                                                                                                                                        )
                                                                                                                                }) }
                                                                                                                        /> <
                                                                                                                        span > ⬆ <
                                                                                                                        /span> <
                                                                                                                        span className =
                                                                                                                        "slider-value" >
                                                                                                                        { voiceSettings
                                                                                                                            .pitch
                                                                                                                            .toFixed(
                                                                                                                                2
                                                                                                                                ) } <
                                                                                                                        /span> <
                                                                                                                        /div> <
                                                                                                                        /div> <
                                                                                                                        /div>
                                                                                                                    )
                                                                                                                } {
                                                                                                                    settingsTab ===
                                                                                                                    "data" && ( <
                                                                                                                        div >
                                                                                                                        <
                                                                                                                        div className =
                                                                                                                        "field" >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        📤 { t(
                                                                                                                            "exportData"
                                                                                                                            ) } <
                                                                                                                        /label> <
                                                                                                                        button className =
                                                                                                                        "btn btn-primary btn-block"
                                                                                                                        onClick = { handleExport } >
                                                                                                                        📥 Download
                                                                                                                        Backup <
                                                                                                                        /button> <
                                                                                                                        /div> <
                                                                                                                        div className =
                                                                                                                        "field" >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        📥 { t(
                                                                                                                            "importData"
                                                                                                                            ) } <
                                                                                                                        /label> <
                                                                                                                        div className =
                                                                                                                        "file-upload-wrap" >
                                                                                                                        📂 Choose
                                                                                                                        backup
                                                                                                                        file <
                                                                                                                        input type =
                                                                                                                        "file"
                                                                                                                        accept =
                                                                                                                        ".json"
                                                                                                                        onChange = { e =>
                                                                                                                            handleImport(
                                                                                                                                e
                                                                                                                                .target
                                                                                                                                .files[
                                                                                                                                    0
                                                                                                                                    ]
                                                                                                                                ) }
                                                                                                                        /> <
                                                                                                                        /div> <
                                                                                                                        /div> <
                                                                                                                        div className =
                                                                                                                        "field"
                                                                                                                        style = { { marginTop: 16 } } >
                                                                                                                        <
                                                                                                                        label >
                                                                                                                        ⚠️ { t(
                                                                                                                            "resetAll"
                                                                                                                            ) } <
                                                                                                                        /label> <
                                                                                                                        button className =
                                                                                                                        "btn btn-danger btn-block"
                                                                                                                        onClick = { handleReset } >
                                                                                                                        🗑️ { t(
                                                                                                                            "resetAll"
                                                                                                                            ) } <
                                                                                                                        /button> <
                                                                                                                        /div> <
                                                                                                                        /div>
                                                                                                                    )
                                                                                                                } <
                                                                                                                div className =
                                                                                                                "modal-actions" >
                                                                                                                <
                                                                                                                button className =
                                                                                                                "btn btn-primary btn-block"
                                                                                                                onClick = {
                                                                                                                    () =>
                                                                                                                    setModal(
                                                                                                                        null
                                                                                                                        ) } >
                                                                                                                { t("close") } <
                                                                                                                /button> <
                                                                                                                /div> <
                                                                                                                /div> <
                                                                                                                /div>
                                                                                                            )
                                                                                                        } {
                                                                                                            modal === "login" && ( <
                                                                                                                    div className =
                                                                                                                    "modal-overlay"
                                                                                                                    onClick = {
                                                                                                                        () =>
                                                                                                                        setModal(
                                                                                                                            null
                                                                                                                            ) } >
                                                                                                                    <
                                                                                                                    div className =
                                                                                                                    "modal"
                                                                                                                    onClick = { e =>
                                                                                                                        e.stopPropagation() } >
                                                                                                                    <
                                                                                                                    h3 > 🔐 { t(
                                                                                                                        "login"
                                                                                                                        ) } <
                                                                                                                    /h3> <
                                                                                                                    div className =
                                                                                                                    "field" >
                                                                                                                    <
                                                                                                                    label > { t(
                                                                                                                        "name"
                                                                                                                        ) } <
                                                                                                                    /label> <
                                                                                                                    input value = { loginData
                                                                                                                        .name }
                                                                                                                    onChange = { e =>
                                                                                                                        setLoginData({ ...
                                                                                                                                loginData,
                                                                                                                                name: e
                                                                                                                                .target
                                                                                                                                .value
                                                                                                                            }) }
                                                                                                                    autoFocus / >
                                                                                                                    <
                                                                                                                    /div> <
                                                                                                                    div className =
                                                                                                                    "field" >
                                                                                                                    <
                                                                                                                    label > { t(
                                                                                                                        "email"
                                                                                                                        ) } <
                                                                                                                    /label> <
                                                                                                                    input value = { loginData
                                                                                                                        .email }
                                                                                                                    onChange = { e =>
                                                                                                                        setLoginData({ ...
                                                                                                                                loginData,
                                                                                                                                email: e
                                                                                                                                .target
                                                                                                                                .value
                                                                                                                            }) }
                                                                                                                    type = "email" /
                                                                                                                    >
                                                                                                                    <
                                                                                                                    /div> <
                                                                                                                    div className =
                                                                                                                    "modal-actions" >
                                                                                                                    <
                                                                                                                    button className =
                                                                                                                    "btn btn-secondary"
                                                                                                                    onClick = {
                                                                                                                        () =>
                                                                                                                        setModal(
                                                                                                                            null
                                                                                                                            ) } >
                                                                                                                    { t("cancel") } <
                                                                                                                    /button> <
                                                                                                                    button className =
                                                                                                                    "btn btn-primary"
                                                                                                                    onClick = {
                                                                                                                        () => { if (!
                                                                                                                                loginData
                                                                                                                                .name
                                                                                                                                .trim()
                                                                                                                                ) return;
                                                                                                                            setUser({ name: loginData
                                                                                                                                    .name
                                                                                                                                    .trim(),
                                                                                                                                email: loginData
                                                                                                                                    .email
                                                                                                                                    .trim() });
                                                                                                                            setModal(
                                                                                                                                null
                                                                                                                                );
                                                                                                                            toast(t(
                                                                                                                                    "savedMsg"
                                                                                                                                    ),
                                                                                                                                "success"
                                                                                                                                ); } } >
                                                                                                                    { t("login") } <
                                                                                                                    /button> <
                                                                                                                    /div> <
                                                                                                                    /div> <
                                                                                                                    /div>
                                                                                                                )
                                                                                                            } {
                                                                                                                !hideNav && < BottomNav
                                                                                                                activeTab = { effectiveTab }
                                                                                                                onTabChange = { setMainTab }
                                                                                                                t = { t }
                                                                                                                />} <
                                                                                                                /div>
                                                                                                            );
                                                                                                        }

                                                                                                        function Root() {
                                                                                                            return ( <
                                                                                                                    ErrorBoundary >
                                                                                                                    <
                                                                                                                    I18nProvider >
                                                                                                                    <
                                                                                                                    ThemeProvider >
                                                                                                                    <
                                                                                                                    ToastProvider >
                                                                                                                    <
                                                                                                                    ErrorBoundary >
                                                                                                                    <
                                                                                                                    AppContent /
                                                                                                                    >
                                                                                                                    <
                                                                                                                    /ErrorBoundary> <
                                                                                                                    /ToastProvider> <
                                                                                                                    /ThemeProvider> <
                                                                                                                    /I18nProvider> <
                                                                                                                    /ErrorBoundary>
                                                                                                                );
                                                                                                            }

                                                                                                            ReactDOM.createRoot(document
                                                                                                                .getElementById("root"))
                                                                                                                .render( <
                                                                                                                    Root / >
                                                                                                                );
    </script>
</body>
</html>
