<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4F46E5" />
  <title>VOCAflow - تعلم الكلمات</title>

  <!-- React + Babel من CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ============ المتغيرات ============ */
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --primary-light: #EEF2FF;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --text: #1F2937;
      --text-light: #6B7280;
      --bg-gradient: linear-gradient(135deg, #E0E7FF 0%, #DDD6FE 50%, #F3E8FF 100%);
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --radius: 16px;
      --radius-sm: 12px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: auto;
      -moz-user-select: auto;
      -ms-user-select: auto;
      user-select: auto;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tajawal', 'Cairo', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    #root { min-height: 100vh; }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .page {
      padding: 20px;
      padding-bottom: 40px;
      min-height: 100vh;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ============ Glassmorphism Base ============ */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius);
    }

    /* ============ الأزرار ============ */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      min-height: 44px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-light);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.5);
      color: var(--primary);
    }

    .btn-block {
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-large {
      padding: 16px 24px;
      font-size: 18px;
      margin-top: 20px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 12px;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      font-family: inherit;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
      padding: 0;
      font-family: inherit;
    }

    /* ============ حقول الإدخال ============ */
    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-family: inherit;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      min-height: 44px;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .loading-dot {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ============ الصفحة الرئيسية ============ */
    .home-page .page-header {
      flex-direction: column;
      align-items: flex-start;
      text-align: start;
    }

    .home-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      transition: all 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-light);
      margin-top: 4px;
    }

    .sets-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .set-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s;
    }

    .set-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .set-card:active {
      transform: scale(0.98);
    }

    .set-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .set-card-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .set-card-meta {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .set-card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-light);
      padding-top: 8px;
      border-top: 1px solid var(--glass-border);
    }

    /* ============ Modal ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 24px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .lang-select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ============ محرر المجموعة ============ */
    .editor-page h2 {
      font-size: 18px;
      margin: 24px 0 12px;
    }

    .word-input-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
    }

    .input-actions {
      display: flex;
      gap: 10px;
    }

    .input-actions .btn {
      flex: 1;
    }

    .words-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .word-item {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 12px;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .word-item:hover {
      transform: translateX(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .word-item.archived {
      opacity: 0.6;
    }

    .word-content {
      flex: 1;
      min-width: 0;
    }

    .word-set-name {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .word-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .word-original {
      font-weight: 600;
      font-size: 16px;
    }

    .word-arrow {
      color: var(--text-light);
    }

    .word-translation {
      color: var(--text-light);
      font-size: 15px;
    }

    .word-errors {
      font-size: 12px;
      color: var(--danger);
      margin-top: 4px;
    }

    .word-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    /* ============ لعبة البطاقات ============ */
    .game-page {
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .game-info {
      text-align: center;
      flex: 1;
    }

    .game-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-light);
    }

    .game-counter {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 2px;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.3s ease;
    }

    .game-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      min-height: 400px;
      position: relative;
    }

    /* ============ البطاقة ============ */
    .flashcard-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3 / 4;
      perspective: 1000px;
      cursor: grab;
      position: relative;
    }

    .flashcard-wrapper:active {
      cursor: grabbing;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
      text-align: center;
    }

    .flashcard-back {
      background: linear-gradient(135deg, rgba(240, 147, 251, 0.9) 0%, rgba(245, 87, 108, 0.9) 100%);
      transform: rotateY(180deg);
    }

    .flashcard-lang {
      position: absolute;
      top: 16px;
      font-size: 14px;
      opacity: 0.8;
      font-weight: 500;
    }

    .flashcard-text {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.2;
      word-break: break-word;
    }

    .flashcard-hint {
      position: absolute;
      bottom: 16px;
      font-size: 12px;
      opacity: 0.7;
    }

    .speak-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speak-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .speak-btn:active {
      transform: scale(0.95);
    }

    .speak-btn.speaking {
      animation: pulse 0.5s infinite;
    }

    .swipe-indicator {
      position: absolute;
      top: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 18px;
      animation: pop 0.2s;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .swipe-indicator.right {
      right: 20px;
      background: var(--success);
      color: white;
    }

    .swipe-indicator.left {
      left: 20px;
      background: var(--danger);
      color: white;
    }

    .game-hints {
      display: flex;
      justify-content: space-between;
      padding: 12px 8px;
      font-size: 13px;
      color: var(--text-light);
    }

    .hint-correct {
      color: var(--success);
      font-weight: 600;
    }

    .hint-wrong {
      color: var(--danger);
      font-weight: 600;
    }

    /* ============ Long Press Menu ============ */
    .long-press-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn 0.2s;
    }

    .long-press-menu {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius);
      min-width: 260px;
      overflow: hidden;
      animation: slideUp 0.3s;
    }

    .menu-item {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: none;
      border: none;
      text-align: start;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 1px solid var(--glass-border);
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .menu-item:active {
      transform: scale(0.98);
    }

    .menu-item.danger {
      color: var(--danger);
    }

    .menu-item.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .menu-item.close {
      color: var(--text-light);
      border-bottom: none;
      justify-content: center;
    }

    /* ============ صفحة النتائج ============ */
    .results-page {
      text-align: center;
      padding-top: 40px;
    }

    .results-header {
      margin-bottom: 24px;
    }

    .results-emoji {
      font-size: 64px;
      margin-bottom: 12px;
      animation: bounce 0.6s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .results-header h1 {
      font-size: 32px;
      color: var(--primary);
    }

    .results-score-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 24px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #764ba2);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
    }

    .score-value {
      font-size: 36px;
      font-weight: 700;
    }

    .score-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .score-details {
      flex: 1;
      text-align: start;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .score-row:last-child {
      border-bottom: none;
    }

    .score-row strong {
      color: var(--primary);
    }

    .results-message {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      color: var(--primary-dark);
      padding: 16px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .wrong-words-section {
      text-align: start;
      margin-bottom: 24px;
    }

    .wrong-words-section h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .wrong-words-list {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .wrong-word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    .wrong-word-item:last-child {
      border-bottom: none;
    }

    .wrong-word-text {
      font-size: 15px;
    }

    .wrong-word-count {
      color: var(--danger);
      font-weight: 700;
      font-size: 14px;
    }

    .results-actions {
      margin-top: 24px;
    }

    /* ============ Empty State ============ */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .empty-state.small {
      padding: 20px;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 12px;
    }

    .empty-hint {
      font-size: 13px;
      margin-top: 8px;
      opacity: 0.8;
    }

    /* ============ Toast Notifications ============ */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 16px 20px;
      border-radius: var(--radius);
      min-width: 300px;
      animation: slideDown 0.3s;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .toast.success {
      border-right: 4px solid var(--success);
    }

    .toast.error {
      border-right: 4px solid var(--danger);
    }

    .toast.info {
      border-right: 4px solid var(--primary);
    }

    /* ============ Games Selection ============ */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .game-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 20px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .game-card:active {
      transform: scale(0.95);
    }

    .game-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .game-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .game-desc {
      font-size: 12px;
      color: var(--text-light);
    }

    /* ============ Multiple Choice Game ============ */
    .mcq-game {
      max-width: 500px;
      margin: 0 auto;
    }

    .mcq-word {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 32px;
      border-radius: var(--radius);
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .mcq-options {
      display: grid;
      gap: 12px;
    }

    .mcq-option {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 2px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 20px;
      border-radius: var(--radius);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 60px;
    }

    .mcq-option:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
    }

    .mcq-option:active {
      transform: scale(0.98);
    }

    .mcq-option.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
    }

    .mcq-option.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
    }

    /* ============ Spelling Game ============ */
    .spelling-game {
      max-width: 500px;
      margin: 0 auto;
    }

    .spelling-input {
      width: 100%;
      padding: 20px;
      font-size: 24px;
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 2px solid var(--glass-border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      min-height: 80px;
    }

    .spelling-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .spelling-input.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    .spelling-input.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* ============ Matching Game ============ */
    .matching-game {
      max-width: 600px;
      margin: 0 auto;
    }

    .matching-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .matching-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .matching-item {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 2px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 16px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .matching-item:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
    }

    .matching-item.selected {
      border-color: var(--primary);
      background: rgba(79, 70, 229, 0.1);
    }

    .matching-item.matched {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      cursor: default;
    }

    /* ============ Responsive ============ */
    @media (max-width: 640px) {
      .page {
        padding: 16px;
        padding-bottom: 32px;
      }

      .btn {
        min-height: 48px;
        padding: 14px 20px;
      }

      .flashcard-text {
        font-size: 32px;
      }

      .score-circle {
        width: 100px;
        height: 100px;
      }

      .score-value {
        font-size: 28px;
      }

      .results-score-card {
        flex-direction: column;
        text-align: center;
      }

      .score-details {
        text-align: center;
        width: 100%;
      }

      .games-grid {
        grid-template-columns: 1fr;
      }

      .matching-columns {
        gap: 12px;
      }

      .mcq-word {
        font-size: 28px;
        padding: 24px;
      }

      .spelling-input {
        font-size: 20px;
      }
    }

    /* ============ Loading Spinner ============ */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ============ Keyboard Shortcuts Hint ============ */
    .shortcuts-hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-light);
      box-shadow: var(--glass-shadow);
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .shortcuts-hint:hover {
      opacity: 1;
    }

    @media (max-width: 640px) {
      .shortcuts-hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // ==================== إعداد React ====================
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==================== قائمة اللغات ====================
    const LANGUAGES = [
      { code: 'ar', name: 'العربية', flag: '🇸🇦' },
      { code: 'fr', name: 'الفرنسية', flag: '🇫🇷' },
      { code: 'en', name: 'الإنجليزية', flag: '🇬🇧' },
      { code: 'es', name: 'الإسبانية', flag: '🇪🇸' },
      { code: 'de', name: 'الألمانية', flag: '🇩🇪' },
      { code: 'it', name: 'الإيطالية', flag: '🇮🇹' },
      { code: 'tr', name: 'التركية', flag: '🇹🇷' },
      { code: 'pt', name: 'البرتغالية', flag: '🇵🇹' },
      { code: 'ru', name: 'الروسية', flag: '🇷🇺' },
      { code: 'zh', name: 'الصينية', flag: '🇨🇳' },
      { code: 'ja', name: 'اليابانية', flag: '🇯🇵' },
      { code: 'ko', name: 'الكورية', flag: '🇰🇷' },
    ];

    const getLanguageByCode = (code) =>
      LANGUAGES.find((l) => l.code === code) || LANGUAGES[0];

    // ==================== Toast System ====================
    const ToastContext = React.createContext();

    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);

      const showToast = useCallback((message, type = 'info') => {
        const id = Date.now();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3000);
      }, []);

      return (
        <ToastContext.Provider value={showToast}>
          {children}
          <div className="toast-container">
            {toasts.map((toast) => (
              <div key={toast.id} className={`toast ${toast.type}`}>
                {toast.type === 'success' && '✅'}
                {toast.type === 'error' && '❌'}
                {toast.type === 'info' && 'ℹ️'}
                {toast.message}
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    }

    const useToast = () => React.useContext(ToastContext);

    // ==================== Hook: localStorage ====================
    function useLocalStorage(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch {
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          console.error('Error saving to localStorage', e);
        }
      }, [key, value]);

      return [value, setValue];
    }

    // ==================== Hook: الترجمة الفورية ====================
    function useTranslation(text, fromLang, toLang) {
      const [translation, setTranslation] = useState('');
      const [loading, setLoading] = useState(false);
      const abortRef = useRef(null);

      useEffect(() => {
        if (!text || text.trim().length < 2) {
          setTranslation('');
          return;
        }
        if (fromLang === toLang) {
          setTranslation(text);
          return;
        }

        if (abortRef.current) clearTimeout(abortRef.current);

        setLoading(true);
        abortRef.current = setTimeout(async () => {
          try {
            const langpair = `${fromLang}|${toLang}`;
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
            const res = await fetch(url);
            const data = await res.json();
            const translated = data?.responseData?.translatedText || '';
            setTranslation(translated);
          } catch (err) {
            console.error('Translation error:', err);
            setTranslation('');
          } finally {
            setLoading(false);
          }
        }, 400);

        return () => {
          if (abortRef.current) clearTimeout(abortRef.current);
        };
      }, [text, fromLang, toLang]);

      return { translation, loading };
    }

    // ==================== Web Speech API ====================
    function useSpeech() {
      const [speaking, setSpeaking] = useState(false);

      const speak = useCallback((text, language) => {
        if (!('speechSynthesis' in window)) {
          console.warn('Speech synthesis not supported');
          return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = language;
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        utterance.onstart = () => setSpeaking(true);
        utterance.onend = () => setSpeaking(false);
        utterance.onerror = () => setSpeaking(false);

        window.speechSynthesis.speak(utterance);
      }, []);

      return { speak, speaking };
    }

    // ==================== Keyboard Shortcuts ====================
    function useKeyboardShortcuts(shortcuts) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          const shortcut = shortcuts[e.key];
          if (shortcut && typeof shortcut === 'function') {
            e.preventDefault();
            shortcut();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [shortcuts]);
    }

    // ==================== مكون: WordInput ====================
    function WordInput({ fromLang, toLang, fromLabel, toLabel, onSave, initialWord = '', initialTranslation = '', onCancel }) {
      const [word, setWord] = useState(initialWord);
      const [manualTranslation, setManualTranslation] = useState(initialTranslation);
      const [isManual, setIsManual] = useState(!!initialTranslation);

      const { translation: autoTranslation, loading } = useTranslation(word, fromLang, toLang);
      const displayTranslation = isManual ? manualTranslation : autoTranslation;

      const handleSave = () => {
        if (!word.trim() || !displayTranslation.trim()) return;
        onSave({
          id: Date.now().toString() + Math.random(),
          word: word.trim(),
          translation: displayTranslation.trim(),
          errors: 0,
          correct: 0,
          archived: false,
        });
        setWord('');
        setManualTranslation('');
        setIsManual(false);
      };

      return (
        <div className="word-input-card">
          <div className="input-group">
            <label>{fromLabel}</label>
            <input
              type="text"
              value={word}
              onChange={(e) => {
                setWord(e.target.value);
                if (!isManual) setManualTranslation('');
              }}
              placeholder={`اكتب كلمة ب${fromLabel}...`}
            />
          </div>

          <div className="input-group">
            <label>
              {toLabel}
              {loading && <span className="loading-dot"> ⏳</span>}
            </label>
            <input
              type="text"
              value={displayTranslation}
              onChange={(e) => {
                setManualTranslation(e.target.value);
                setIsManual(true);
              }}
              placeholder="الترجمة ستظهر هنا..."
            />
            {isManual && (
              <button
                className="btn-link"
                onClick={() => {
                  setIsManual(false);
                  setManualTranslation('');
                }}
              >
                ↻ استعادة الترجمة التلقائية
              </button>
            )}
          </div>

          <div className="input-actions">
            <button
              className="btn btn-primary"
              onClick={handleSave}
              disabled={!word.trim() || !displayTranslation.trim()}
            >
              💾 حفظ الكلمة
            </button>
            {onCancel && (
              <button className="btn btn-secondary" onClick={onCancel}>
                إلغاء
              </button>
            )}
          </div>
        </div>
      );
    }

    // ==================== مكون: LongPressMenu ====================
    function LongPressMenu({ isOpen, onClose, onEdit, onArchive, onDelete }) {
      const menuRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        const handleClickOutside = (e) => {
          if (menuRef.current && !menuRef.current.contains(e.target)) {
            onClose();
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('touchstart', handleClickOutside);
        return () => {
          document.removeEventListener('mousedown', handleClickOutside);
          document.removeEventListener('touchstart', handleClickOutside);
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      return (
        <div className="long-press-overlay" onClick={onClose}>
          <div className="long-press-menu" ref={menuRef} onClick={(e) => e.stopPropagation()}>
            <button className="menu-item" onClick={onEdit}>
              <span>✏️</span>
              <span>تعديل الكلمة</span>
            </button>
            <button className="menu-item" onClick={onArchive}>
              <span>📦</span>
              <span>نقل للمحفوظات</span>
            </button>
            <button className="menu-item danger" onClick={onDelete}>
              <span>🗑️</span>
              <span>حذف نهائياً</span>
            </button>
            <button className="menu-item close" onClick={onClose}>
              ✕ إغلاق
            </button>
          </div>
        </div>
      );
    }

    // ==================== مكون: Flashcard ====================
    function Flashcard({ card, lang1Label, lang2Label, lang1Code, lang2Code, onCorrect, onWrong, onEdit, onArchive, onDelete }) {
      const [flipped, setFlipped] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [swipeOffset, setSwipeOffset] = useState(0);
      const [swipeDirection, setSwipeDirection] = useState(null);
      const { speak, speaking } = useSpeech();

      const startX = useRef(0);
      const startY = useRef(0);
      const startTime = useRef(0);
      const isDragging = useRef(false);
      const longPressTimer = useRef(null);

      useEffect(() => {
        setFlipped(false);
        setSwipeOffset(0);
        setSwipeDirection(null);
      }, [card.id]);

      const handleStart = (clientX, clientY) => {
        startX.current = clientX;
        startY.current = clientY;
        startTime.current = Date.now();
        isDragging.current = false;

        longPressTimer.current = setTimeout(() => {
          if (!isDragging.current) {
            setMenuOpen(true);
            if (navigator.vibrate) navigator.vibrate(50);
          }
        }, 600);
      };

      const handleMove = (clientX, clientY) => {
        const dx = clientX - startX.current;
        const dy = clientY - startY.current;

        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          isDragging.current = true;
          clearTimeout(longPressTimer.current);
        }

        if (isDragging.current && Math.abs(dx) > Math.abs(dy)) {
          setSwipeOffset(dx);
        }
      };

      const handleEnd = () => {
        clearTimeout(longPressTimer.current);
        const elapsed = Date.now() - startTime.current;
        const dx = swipeOffset;

        if (!isDragging.current && elapsed < 300) {
          setFlipped((f) => !f);
        } else if (Math.abs(dx) > 100) {
          const direction = dx > 0 ? 'right' : 'left';
          setSwipeDirection(direction);
          setSwipeOffset(direction === 'right' ? 500 : -500);

          setTimeout(() => {
            if (direction === 'right') onCorrect();
            else onWrong();
          }, 250);
        } else {
          setSwipeOffset(0);
        }

        isDragging.current = false;
      };

      const onMouseDown = (e) => handleStart(e.clientX, e.clientY);
      const onMouseMove = (e) => { if (e.buttons === 1) handleMove(e.clientX, e.clientY); };
      const onMouseUp = () => handleEnd();
      const onMouseLeave = () => { if (isDragging.current) handleEnd(); };

      const onTouchStart = (e) => handleStart(e.touches[0].clientX, e.touches[0].clientY);
      const onTouchMove = (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY);
      const onTouchEnd = () => handleEnd();

      const rotation = swipeOffset / 20;
      const opacity = 1 - Math.min(Math.abs(swipeOffset) / 300, 1) * 0.3;

      const currentLang = flipped ? lang2Code : lang1Code;
      const currentText = flipped ? card.translation : card.word;

      return (
        <>
          <div
            className={`flashcard-wrapper ${swipeDirection ? `swipe-${swipeDirection}` : ''}`}
            style={{
              transform: `translateX(${swipeOffset}px) rotate(${rotation}deg)`,
              opacity,
              transition: isDragging.current ? 'none' : 'transform 0.3s, opacity 0.3s',
            }}
            onMouseDown={onMouseDown}
            onMouseMove={onMouseMove}
            onMouseUp={onMouseUp}
            onMouseLeave={onMouseLeave}
            onTouchStart={onTouchStart}
            onTouchMove={onTouchMove}
            onTouchEnd={onTouchEnd}
          >
            <div className={`flashcard ${flipped ? 'flipped' : ''}`}>
              <div className="flashcard-face flashcard-front">
                <div className="flashcard-lang">{lang1Label}</div>
                <button
                  className={`speak-btn ${speaking ? 'speaking' : ''}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    speak(card.word, lang1Code);
                  }}
                >
                  🔊
                </button>
                <div className="flashcard-text">{card.word}</div>
                <div className="flashcard-hint">اضغط للتقليب</div>
              </div>
              <div className="flashcard-face flashcard-back">
                <div className="flashcard-lang">{lang2Label}</div>
                <button
                  className={`speak-btn ${speaking ? 'speaking' : ''}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    speak(card.translation, lang2Code);
                  }}
                >
                  🔊
                </button>
                <div className="flashcard-text">{card.translation}</div>
                <div className="flashcard-hint">اضغط للعودة</div>
              </div>
            </div>

            {Math.abs(swipeOffset) > 30 && (
              <div className={`swipe-indicator ${swipeOffset > 0 ? 'right' : 'left'}`}>
                {swipeOffset > 0 ? '✓ صحيح' : '✗ خطأ'}
              </div>
            )}
          </div>

          <LongPressMenu
            isOpen={menuOpen}
            onClose={() => setMenuOpen(false)}
            onEdit={() => { setMenuOpen(false); onEdit?.(card); }}
            onArchive={() => { setMenuOpen(false); onArchive?.(card.id); }}
            onDelete={() => { setMenuOpen(false); onDelete?.(card.id); }}
          />
        </>
      );
    }

    // ==================== صفحة: Home ====================
    function Home({ sets, onCreateSet, onDeleteSet, onOpenSet, onOpenArchive }) {
      const [showCreate, setShowCreate] = useState(false);
      const [newSetName, setNewSetName] = useState('');
      const [newLang1, setNewLang1] = useState('fr');
      const [newLang2, setNewLang2] = useState('ar');
      const showToast = useToast();

      const handleCreate = () => {
        if (!newSetName.trim()) {
          showToast('الرجاء إدخال اسم المجموعة', 'error');
          return;
        }
        onCreateSet({
          id: Date.now().toString(),
          name: newSetName.trim(),
          lang1: newLang1,
          lang2: newLang2,
          words: [],
          createdAt: new Date().toISOString(),
          lastReviewed: null,
        });
        setNewSetName('');
        setShowCreate(false);
        showToast('تم إنشاء المجموعة بنجاح!', 'success');
      };

      return (
        <div className="page home-page">
          <header className="page-header">
            <h1>📚 VOCAflow</h1>
            <p className="subtitle">تعلم الكلمات بطريقة ممتعة</p>
          </header>

          <div className="home-stats">
            <div className="stat-card">
              <div className="stat-value">{sets.length}</div>
              <div className="stat-label">مجموعة</div>
            </div>
            <div className="stat-card">
              <div className="stat-value">
                {sets.reduce((sum, s) => sum + s.words.filter((w) => !w.archived).length, 0)}
              </div>
              <div className="stat-label">كلمة</div>
            </div>
          </div>

          <button className="btn btn-primary btn-block" onClick={() => setShowCreate(true)}>
            ➕ إنشاء مجموعة جديدة
          </button>

          <button className="btn btn-secondary btn-block" onClick={onOpenArchive}>
            📦 المحفوظات
          </button>

          {showCreate && (
            <div className="modal-overlay" onClick={() => setShowCreate(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <h2>مجموعة جديدة</h2>
                <div className="input-group">
                  <label>اسم المجموعة</label>
                  <input
                    type="text"
                    value={newSetName}
                    onChange={(e) => setNewSetName(e.target.value)}
                    placeholder="مثال: مفردات المطبخ"
                    autoFocus
                  />
                </div>
                <div className="lang-select-row">
                  <div className="input-group">
                    <label>اللغة الأولى</label>
                    <select value={newLang1} onChange={(e) => setNewLang1(e.target.value)}>
                      {LANGUAGES.map((l) => (
                        <option key={l.code} value={l.code}>{l.flag} {l.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="input-group">
                    <label>اللغة الثانية</label>
                    <select value={newLang2} onChange={(e) => setNewLang2(e.target.value)}>
                      {LANGUAGES.map((l) => (
                        <option key={l.code} value={l.code}>{l.flag} {l.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
                <div className="modal-actions">
                  <button className="btn btn-primary" onClick={handleCreate}>إنشاء</button>
                  <button className="btn btn-secondary" onClick={() => setShowCreate(false)}>إلغاء</button>
                </div>
              </div>
            </div>
          )}

          <div className="sets-list">
            {sets.length === 0 && (
              <div className="empty-state">
                <div className="empty-icon">📖</div>
                <p>لا توجد مجموعات بعد</p>
                <p className="empty-hint">أنشئ مجموعة جديدة للبدء!</p>
              </div>
            )}
            {sets.map((set) => {
              const l1 = getLanguageByCode(set.lang1);
              const l2 = getLanguageByCode(set.lang2);
              const activeWords = set.words.filter((w) => !w.archived).length;
              return (
                <div key={set.id} className="set-card" onClick={() => onOpenSet(set.id)}>
                  <div className="set-card-header">
                    <h3>{set.name}</h3>
                    <button
                      className="icon-btn danger"
                      onClick={(e) => {
                        e.stopPropagation();
                        if (confirm('حذف هذه المجموعة نهائياً؟')) {
                          onDeleteSet(set.id);
                          showToast('تم حذف المجموعة', 'info');
                        }
                      }}
                    >
                      🗑️
                    </button>
                  </div>
                  <div className="set-card-meta">
                    <span>{l1.flag} {l1.name} ↔ {l2.flag} {l2.name}</span>
                  </div>
                  <div className="set-card-footer">
                    <span>📝 {activeWords} كلمة</span>
                    {set.lastReviewed && (
                      <span>🕐 {new Date(set.lastReviewed).toLocaleDateString('ar-EG')}</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==================== صفحة: SetEditor ====================
    function SetEditor({ set, onUpdateSet, onBack, onStartGame }) {
      const [editingId, setEditingId] = useState(null);
      const [showGames, setShowGames] = useState(false);
      const showToast = useToast();

      const l1 = getLanguageByCode(set.lang1);
      const l2 = getLanguageByCode(set.lang2);

      const addWord = (word) => {
        onUpdateSet({ ...set, words: [...set.words, word] });
        showToast('تم إضافة الكلمة!', 'success');
      };

      const updateWord = (updated) => {
        onUpdateSet({
          ...set,
          words: set.words.map((w) => (w.id === updated.id ? updated : w)),
        });
        setEditingId(null);
        showToast('تم تحديث الكلمة', 'success');
      };

      const deleteWord = (id) => {
        if (!confirm('حذف هذه الكلمة؟')) return;
        onUpdateSet({ ...set, words: set.words.filter((w) => w.id !== id) });
        showToast('تم حذف الكلمة', 'info');
      };

      const archiveWord = (id) => {
        onUpdateSet({
          ...set,
          words: set.words.map((w) => (w.id === id ? { ...w, archived: !w.archived } : w)),
        });
        showToast('تم نقل الكلمة للمحفوظات', 'info');
      };

      const activeWords = set.words.filter((w) => !w.archived);
      const archivedWords = set.words.filter((w) => w.archived);

      return (
        <div className="page editor-page">
          <header className="page-header">
            <button className="icon-btn" onClick={onBack}>← رجوع</button>
            <div>
              <h1>{set.name}</h1>
              <p className="subtitle">{l1.flag} {l1.name} ↔ {l2.flag} {l2.name}</p>
            </div>
          </header>

          <h2>➕ إضافة كلمة جديدة</h2>
          <WordInput
            fromLang={set.lang1}
            toLang={set.lang2}
            fromLabel={`${l1.flag} ${l1.name}`}
            toLabel={`${l2.flag} ${l2.name}`}
            onSave={addWord}
          />

          <h2>📝 الكلمات ({activeWords.length})</h2>

          {activeWords.length === 0 && (
            <div className="empty-state small">
              <p>لا توجد كلمات بعد. أضف كلمة جديدة!</p>
            </div>
          )}

          <div className="words-list">
            {activeWords.map((w) => (
              <div key={w.id} className="word-item">
                {editingId === w.id ? (
                  <WordInput
                    fromLang={set.lang1}
                    toLang={set.lang2}
                    fromLabel={`${l1.flag} ${l1.name}`}
                    toLabel={`${l2.flag} ${l2.name}`}
                    initialWord={w.word}
                    initialTranslation={w.translation}
                    onSave={updateWord}
                    onCancel={() => setEditingId(null)}
                  />
                ) : (
                  <>
                    <div className="word-content">
                      <div className="word-main">
                        <span className="word-original">{w.word}</span>
                        <span className="word-arrow">→</span>
                        <span className="word-translation">{w.translation}</span>
                      </div>
                      {w.errors > 0 && <span className="word-errors">❌ {w.errors}</span>}
                    </div>
                    <div className="word-actions">
                      <button className="icon-btn" onClick={() => setEditingId(w.id)} title="تعديل">✏️</button>
                      <button className="icon-btn" onClick={() => archiveWord(w.id)} title="نقل للمحفوظات">📦</button>
                      <button className="icon-btn danger" onClick={() => deleteWord(w.id)} title="حذف">🗑️</button>
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>

          {archivedWords.length > 0 && (
            <>
              <h2>📦 المحفوظة ({archivedWords.length})</h2>
              <div className="words-list">
                {archivedWords.map((w) => (
                  <div key={w.id} className="word-item archived">
                    <div className="word-content">
                      <div className="word-main">
                        <span className="word-original">{w.word}</span>
                        <span className="word-arrow">→</span>
                        <span className="word-translation">{w.translation}</span>
                      </div>
                    </div>
                    <button className="icon-btn" onClick={() => archiveWord(w.id)} title="استعادة">↩️</button>
                  </div>
                ))}
              </div>
            </>
          )}

          {activeWords.length > 0 && (
            <>
              <button className="btn btn-primary btn-block btn-large" onClick={() => onStartGame('flashcards')}>
                🎮 لعبة البطاقات ({activeWords.length} كلمة)
              </button>
              <button className="btn btn-secondary btn-block" onClick={() => setShowGames(true)}>
                🎯 ألعاب أخرى
              </button>
            </>
          )}

          {showGames && (
            <div className="modal-overlay" onClick={() => setShowGames(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <h2>اختر لعبة</h2>
                <div className="games-grid">
                  <div className="game-card" onClick={() => { onStartGame('mcq'); setShowGames(false); }}>
                    <div className="game-icon">🎯</div>
                    <div className="game-name">اختيار من متعدد</div>
                    <div className="game-desc">4 خيارات</div>
                  </div>
                  <div className="game-card" onClick={() => { onStartGame('spelling'); setShowGames(false); }}>
                    <div className="game-icon">✍️</div>
                    <div className="game-name">الإملاء</div>
                    <div className="game-desc">اكتب الكلمة</div>
                  </div>
                  <div className="game-card" onClick={() => { onStartGame('matching'); setShowGames(false); }}>
                    <div className="game-icon">🔗</div>
                    <div className="game-name">المطابقة</div>
                    <div className="game-desc">طابق الكلمات</div>
                  </div>
                  <div className="game-card" onClick={() => { onStartGame('speed'); setShowGames(false); }}>
                    <div className="game-icon">⚡</div>
                    <div className="game-name">الكتابة السريعة</div>
                    <div className="game-desc">سرعة + دقة</div>
                  </div>
                </div>
                <button className="btn btn-secondary btn-block" style={{ marginTop: '16px' }} onClick={() => setShowGames(false)}>
                  إغلاق
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== صفحة: FlashcardsGame ====================
    function FlashcardsGame({ set, onUpdateSet, onFinish, onExit }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [results, setResults] = useState([]);
      const [editingCard, setEditingCard] = useState(null);
      const [editWord, setEditWord] = useState('');
      const [editTrans, setEditTrans] = useState('');
      const showToast = useToast();

      const l1 = getLanguageByCode(set.lang1);
      const l2 = getLanguageByCode(set.lang2);

      const cards = useMemo(() => {
        const active = set.words.filter((w) => !w.archived);
        return [...active].sort(() => Math.random() - 0.5);
      }, [set.id]);

      const currentCard = cards[currentIndex];
      const total = cards.length;
      const progress = total > 0 ? (currentIndex / total) * 100 : 0;

      const finishGame = (finalResults) => {
        const updatedSet = { ...set, lastReviewed: new Date().toISOString() };
        onUpdateSet(updatedSet);
        onFinish(finalResults, cards);
      };

      const handleAnswer = (correct) => {
        const newResults = [...results, { id: currentCard.id, correct }];

        const updatedWords = set.words.map((w) => {
          if (w.id !== currentCard.id) return w;
          return {
            ...w,
            errors: w.errors + (correct ? 0 : 1),
            correct: w.correct + (correct ? 1 : 0),
          };
        });
        onUpdateSet({ ...set, words: updatedWords });

        if (currentIndex + 1 >= total) {
          finishGame(newResults);
        } else {
          setCurrentIndex(currentIndex + 1);
          setResults(newResults);
        }
      };

      const handleSkip = () => handleAnswer(false);

      const handleEdit = (card) => {
        setEditingCard(card);
        setEditWord(card.word);
        setEditTrans(card.translation);
      };

      const saveEdit = () => {
        if (!editWord.trim() || !editTrans.trim()) return;
        const updatedWords = set.words.map((w) =>
          w.id === editingCard.id ? { ...w, word: editWord.trim(), translation: editTrans.trim() } : w
        );
        onUpdateSet({ ...set, words: updatedWords });
        setEditingCard(null);
        showToast('تم تحديث الكلمة', 'success');
      };

      const handleArchive = (id) => {
        const updatedWords = set.words.map((w) =>
          w.id === id ? { ...w, archived: true } : w
        );
        onUpdateSet({ ...set, words: updatedWords });
        if (currentIndex + 1 >= total) finishGame(results);
        else setCurrentIndex(currentIndex + 1);
      };

      const handleDelete = (id) => {
        if (!confirm('حذف هذه الكلمة نهائياً؟')) return;
        const updatedWords = set.words.filter((w) => w.id !== id);
        onUpdateSet({ ...set, words: updatedWords });
      };

      useKeyboardShortcuts({
        ' ': () => handleAnswer(true),
        'Enter': () => handleAnswer(true),
        'Escape': onExit,
      });

      if (!currentCard) {
        return (
          <div className="page">
            <p>لا توجد كلمات للعب</p>
            <button className="btn btn-primary" onClick={onExit}>رجوع</button>
          </div>
        );
      }

      return (
        <div className="page game-page">
          <header className="game-header">
            <button className="icon-btn" onClick={onExit}>✕</button>
            <div className="game-info">
              <div className="game-title">{set.name}</div>
              <div className="game-counter">البطاقة {currentIndex + 1} من {total}</div>
            </div>
            <button className="icon-btn" onClick={handleSkip}>تخطي ⏭️</button>
          </header>

          <div className="progress-bar">
            <div className="progress-fill" style={{ width: `${progress}%` }} />
          </div>

          <div className="game-area">
            <Flashcard
              card={currentCard}
              lang1Label={`${l1.flag} ${l1.name}`}
              lang2Label={`${l2.flag} ${l2.name}`}
              lang1Code={set.lang1}
              lang2Code={set.lang2}
              onCorrect={() => handleAnswer(true)}
              onWrong={() => handleAnswer(false)}
              onEdit={handleEdit}
              onArchive={handleArchive}
              onDelete={handleDelete}
            />
          </div>

          <div className="game-hints">
            <div className="hint hint-wrong">← تمرير يسار: خطأ</div>
            <div className="hint hint-correct">تمرير يمين: صحيح →</div>
          </div>

          {editingCard && (
            <div className="modal-overlay" onClick={() => setEditingCard(null)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <h2>تعديل الكلمة</h2>
                <div className="input-group">
                  <label>{l1.name}</label>
                  <input type="text" value={editWord} onChange={(e) => setEditWord(e.target.value)} />
                </div>
                <div className="input-group">
                  <label>{l2.name}</label>
                  <input type="text" value={editTrans} onChange={(e) => setEditTrans(e.target.value)} />
                </div>
                <div className="modal-actions">
                  <button className="btn btn-primary" onClick={saveEdit}>حفظ</button>
                  <button className="btn btn-secondary" onClick={() => setEditingCard(null)}>إلغاء</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== لعبة: Multiple Choice ====================
    function MCQGame({ set, onUpdateSet, onFinish, onExit }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [results, setResults] = useState([]);
      const [selected, setSelected] = useState(null);
      const [options, setOptions] = useState([]);
      const { speak } = useSpeech();

      const l1 = getLanguageByCode(set.lang1);
      const l2 = getLanguageByCode(set.lang2);

      const cards = useMemo(() => {
        const active = set.words.filter((w) => !w.archived);
        return [...active].sort(() => Math.random() - 0.5);
      }, [set.id]);

      const currentCard = cards[currentIndex];

      useEffect(() => {
        if (!currentCard) return;

        // Generate 4 options (1 correct + 3 wrong)
        const allTranslations = set.words.filter((w) => !w.archived).map((w) => w.translation);
        const wrongOptions = allTranslations
          .filter((t) => t !== currentCard.translation)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);

        const allOptions = [...wrongOptions, currentCard.translation].sort(() => Math.random() - 0.5);
        setOptions(allOptions);
        setSelected(null);
      }, [currentIndex, currentCard]);

      const handleSelect = (option) => {
        if (selected !== null) return;

        const correct = option === currentCard.translation;
        setSelected(option);

        const newResults = [...results, { id: currentCard.id, correct }];
        setResults(newResults);

        const updatedWords = set.words.map((w) => {
          if (w.id !== currentCard.id) return w;
          return {
            ...w,
            errors: w.errors + (correct ? 0 : 1),
            correct: w.correct + (correct ? 1 : 0),
          };
        });
        onUpdateSet({ ...set, words: updatedWords });

        setTimeout(() => {
          if (currentIndex + 1 >= cards.length) {
            onFinish(newResults, cards);
          } else {
            setCurrentIndex(currentIndex + 1);
          }
        }, 1000);
      };

      if (!currentCard) {
        return (
          <div className="page">
            <p>لا توجد كلمات للعب</p>
            <button className="btn btn-primary" onClick={onExit}>رجوع</button>
          </div>
        );
      }

      return (
        <div className="page game-page">
          <header className="game-header">
            <button className="icon-btn" onClick={onExit}>✕</button>
            <div className="game-info">
              <div className="game-title">{set.name} - اختيار من متعدد</div>
              <div className="game-counter">السؤال {currentIndex + 1} من {cards.length}</div>
            </div>
          </header>

          <div className="progress-bar">
            <div className="progress-fill" style={{ width: `${(currentIndex / cards.length) * 100}%` }} />
          </div>

          <div className="mcq-game">
            <div className="mcq-word">
              <button
                className="speak-btn"
                style={{ position: 'absolute', top: '16px', right: '16px' }}
                onClick={() => speak(currentCard.word, set.lang1)}
              >
                🔊
              </button>
              {currentCard.word}
            </div>

            <div className="mcq-options">
              {options.map((option, idx) => {
                let className = 'mcq-option';
                if (selected !== null) {
                  if (option === currentCard.translation) className += ' correct';
                  else if (option === selected) className += ' wrong';
                }

                return (
                  <button
                    key={idx}
                    className={className}
                    onClick={() => handleSelect(option)}
                    disabled={selected !== null}
                  >
                    {option}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==================== لعبة: Spelling ====================
    function SpellingGame({ set, onUpdateSet, onFinish, onExit }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [results, setResults] = useState([]);
      const [userInput, setUserInput] = useState('');
      const [feedback, setFeedback] = useState(null);
      const { speak } = useSpeech();

      const l1 = getLanguageByCode(set.lang1);
      const l2 = getLanguageByCode(set.lang2);

      const cards = useMemo(() => {
        const active = set.words.filter((w) => !w.archived);
        return [...active].sort(() => Math.random() - 0.5);
      }, [set.id]);

      const currentCard = cards[currentIndex];

      useEffect(() => {
        if (currentCard) {
          speak(currentCard.translation, set.lang2);
        }
      }, [currentIndex, currentCard]);

      const handleSubmit = () => {
        if (!userInput.trim() || feedback) return;

        const correct = userInput.trim().toLowerCase() === currentCard.word.toLowerCase();
        setFeedback(correct ? 'correct' : 'wrong');

        const newResults = [...results, { id: currentCard.id, correct }];
        setResults(newResults);

        const updatedWords = set.words.map((w) => {
          if (w.id !== currentCard.id) return w;
          return {
            ...w,
            errors: w.errors + (correct ? 0 : 1),
            correct: w.correct + (correct ? 1 : 0),
          };
        });
        onUpdateSet({ ...set, words: updatedWords });

        setTimeout(() => {
          if (currentIndex + 1 >= cards.length) {
            onFinish(newResults, cards);
          } else {
            setCurrentIndex(currentIndex + 1);
            setUserInput('');
            setFeedback(null);
          }
        }, 1500);
      };

      if (!currentCard) {
        return (
          <div className="page">
            <p>لا توجد كلمات للعب</p>
            <button className="btn btn-primary" onClick={onExit}>رجوع</button>
          </div>
        );
      }

      return (
        <div className="page game-page">
          <header className="game-header">
            <button className="icon-btn" onClick={onExit}>✕</button>
            <div className="game-info">
              <div className="game-title">{set.name} - الإملاء</div>
              <div className="game-counter">السؤال {currentIndex + 1} من {cards.length}</div>
            </div>
          </header>

          <div className="progress-bar">
            <div className="progress-fill" style={{ width: `${(currentIndex / cards.length) * 100}%` }} />
          </div>

          <div className="spelling-game">
            <div className="mcq-word">
              <button
                className="speak-btn"
                style={{ position: 'absolute', top: '16px', right: '16px' }}
                onClick={() => speak(currentCard.translation, set.lang2)}
              >
                🔊
              </button>
              استمع واكتب الكلمة
            </div>

            <input
              type="text"
              className={`spelling-input ${feedback || ''}`}
              value={userInput}
              onChange={(e) => setUserInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') handleSubmit();
              }}
              placeholder="اكتب الكلمة هنا..."
              disabled={!!feedback}
              autoFocus
            />

            {feedback === 'wrong' && (
              <div style={{ textAlign: 'center', color: 'var(--danger)', fontSize: '18px', fontWeight: '600', margin: '16px 0' }}>
                ❌ الإجابة الصحيحة: {currentCard.word}
              </div>
            )}

            {feedback === 'correct' && (
              <div style={{ textAlign: 'center', color: 'var(--success)', fontSize: '18px', fontWeight: '600', margin: '16px 0' }}>
                ✅ صحيح!
              </div>
            )}

            <button className="btn btn-primary btn-block" onClick={handleSubmit} disabled={!userInput.trim() || !!feedback}>
              تحقق
            </button>
          </div>
        </div>
      );
    }

    // ==================== لعبة: Matching ====================
    function MatchingGame({ set, onUpdateSet, onFinish, onExit }) {
      const [words, setWords] = useState([]);
      const [translations, setTranslations] = useState([]);
      const [selectedWord, setSelectedWord] = useState(null);
      const [selectedTranslation, setSelectedTranslation] = useState(null);
      const [matched, setMatched] = useState(new Set());
      const [results, setResults] = useState([]);

      useEffect(() => {
        const active = set.words.filter((w) => !w.archived).slice(0, 6);
        const shuffledWords = [...active].sort(() => Math.random() - 0.5);
        const shuffledTranslations = [...active].sort(() => Math.random() - 0.5);
        setWords(shuffledWords);
        setTranslations(shuffledTranslations);
      }, [set.id]);

      const checkMatch = () => {
        if (selectedWord && selectedTranslation) {
          const correct = selectedWord.id === selectedTranslation.id;

          if (correct) {
            setMatched((prev) => new Set([...prev, selectedWord.id]));
            setResults([...results, { id: selectedWord.id, correct: true }]);

            const updatedWords = set.words.map((w) => {
              if (w.id !== selectedWord.id) return w;
              return { ...w, correct: w.correct + 1 };
            });
            onUpdateSet({ ...set, words: updatedWords });

            if (matched.size + 1 === words.length) {
              setTimeout(() => {
                onFinish(results.concat([{ id: selectedWord.id, correct: true }]), words);
              }, 500);
            }
          } else {
            setResults([...results, { id: selectedWord.id, correct: false }]);

            const updatedWords = set.words.map((w) => {
              if (w.id !== selectedWord.id) return w;
              return { ...w, errors: w.errors + 1 };
            });
            onUpdateSet({ ...set, words: updatedWords });
          }

          setTimeout(() => {
            setSelectedWord(null);
            setSelectedTranslation(null);
          }, 500);
        }
      };

      useEffect(() => {
        if (selectedWord && selectedTranslation) {
          checkMatch();
        }
      }, [selectedWord, selectedTranslation]);

      return (
        <div className="page game-page">
          <header className="game-header">
            <button className="icon-btn" onClick={onExit}>✕</button>
            <div className="game-info">
              <div className="game-title">{set.name} - المطابقة</div>
              <div className="game-counter">طابق {matched.size} من {words.length}</div>
            </div>
          </header>

          <div className="matching-game">
            <div className="matching-columns">
              <div className="matching-column">
                {words.map((w) => (
                  <button
                    key={w.id}
                    className={`matching-item ${selectedWord?.id === w.id ? 'selected' : ''} ${matched.has(w.id) ? 'matched' : ''}`}
                    onClick={() => !matched.has(w.id) && setSelectedWord(w)}
                    disabled={matched.has(w.id)}
                  >
                    {w.word}
                  </button>
                ))}
              </div>

              <div className="matching-column">
                {translations.map((w) => (
                  <button
                    key={w.id}
                    className={`matching-item ${selectedTranslation?.id === w.id ? 'selected' : ''} ${matched.has(w.id) ? 'matched' : ''}`}
                    onClick={() => !matched.has(w.id) && setSelectedTranslation(w)}
                    disabled={matched.has(w.id)}
                  >
                    {w.translation}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== صفحة: Results ====================
    function Results({ results, cards, onRetry, onRetryWrong, onHome }) {
      const total = results.length;
      const correctCount = results.filter((r) => r.correct).length;
      const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;

      let rating, stars, message, emoji;
      if (percentage >= 90) {
        rating = 'ممتاز'; stars = '🌟🌟🌟'; message = 'أنت نجم! استمر بهذا الأداء الرائع'; emoji = '🎉';
      } else if (percentage >= 70) {
        rating = 'جيد جداً'; stars = '⭐⭐'; message = 'عمل رائع! استمر هكذا'; emoji = '👏';
      } else if (percentage >= 50) {
        rating = 'جيد'; stars = '⭐'; message = 'بذلت جهداً جيداً! مارس أكثر قليلاً'; emoji = '👍';
      } else {
        rating = 'حاول مرة أخرى'; stars = '💪'; message = 'لا تستسلم! كل محاولة تجعلك أقوى'; emoji = '🔥';
      }

      const wrongWordsMap = {};
      results.forEach((r) => {
        if (!r.correct) {
          if (!wrongWordsMap[r.id]) wrongWordsMap[r.id] = 0;
          wrongWordsMap[r.id]++;
        }
      });
      const wrongWords = Object.entries(wrongWordsMap).map(([id, count]) => {
        const card = cards.find((c) => c.id === id);
        return { ...card, wrongCount: count };
      });

      return (
        <div className="page results-page">
          <div className="results-header">
            <div className="results-emoji">{emoji}</div>
            <h1>تم الانتهاء!</h1>
          </div>

          <div className="results-score-card">
            <div className="score-circle">
              <div className="score-value">{percentage}%</div>
              <div className="score-label">النسبة</div>
            </div>
            <div className="score-details">
              <div className="score-row">
                <span>الإجابات الصحيحة:</span>
                <strong>{correctCount} من {total}</strong>
              </div>
              <div className="score-row">
                <span>التقييم:</span>
                <strong>{stars} {rating}</strong>
              </div>
            </div>
          </div>

          <div className="results-message">"{message}" {emoji}</div>

          {wrongWords.length > 0 && (
            <div className="wrong-words-section">
              <h2>❌ الكلمات التي أخطأت بها</h2>
              <div className="wrong-words-list">
                {wrongWords.map((w) => (
                  <div key={w.id} className="wrong-word-item">
                    <span className="wrong-word-text">{w.word} ({w.translation})</span>
                    <span className="wrong-word-count">❌ {w.wrongCount}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="results-actions">
            <button className="btn btn-primary btn-block" onClick={onRetry}>
              🔄 إعادة المحاولة بكل الكلمات
            </button>
            {wrongWords.length > 0 && (
              <button className="btn btn-secondary btn-block" onClick={onRetryWrong}>
                ⭐ الكلمات الخاطئة فقط ({wrongWords.length})
              </button>
            )}
            <button className="btn btn-ghost btn-block" onClick={onHome}>
              🏠 الصفحة الرئيسية
            </button>
          </div>
        </div>
      );
    }

    // ==================== صفحة: Archive ====================
    function Archive({ sets, onUpdateSet, onBack, onPlayArchived }) {
      const allArchived = sets.flatMap((s) =>
        s.words.filter((w) => w.archived).map((w) => ({ ...w, setId: s.id, setName: s.name, set: s }))
      );

      const restore = (setId, wordId) => {
        const set = sets.find((s) => s.id === setId);
        const updatedWords = set.words.map((w) =>
          w.id === wordId ? { ...w, archived: false } : w
        );
        onUpdateSet({ ...set, words: updatedWords });
      };

      const deleteWord = (setId, wordId) => {
        if (!confirm('حذف هذه الكلمة نهائياً؟')) return;
        const set = sets.find((s) => s.id === setId);
        const updatedWords = set.words.filter((w) => w.id !== wordId);
        onUpdateSet({ ...set, words: updatedWords });
      };

      return (
        <div className="page archive-page">
          <header className="page-header">
            <button className="icon-btn" onClick={onBack}>← رجوع</button>
            <h1>📦 المحفوظات</h1>
          </header>

          {allArchived.length > 0 && (
            <button className="btn btn-primary btn-block" onClick={() => onPlayArchived(allArchived)}>
              🎮 لعب لعبة البطاقات بالكلمات المحفوظة ({allArchived.length})
            </button>
          )}
