          {allArchived.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">📦</div>
              <p>لا توجد كلمات محفوظة</p>
              <p className="empty-hint">استخدم الضغط المطول على البطاقة لنقل الكلمات هنا</p>
            </div>
          ) : (
            <div className="words-list">
              {allArchived.map((w) => {
                const l1 = getLanguageByCode(w.set.lang1);
                const l2 = getLanguageByCode(w.set.lang2);
                return (
                  <div key={`${w.setId}-${w.id}`} className="word-item">
                    <div className="word-content">
                      <div className="word-set-name">{w.setName}</div>
                      <div className="word-main">
                        <span className="word-original">{l1.flag} {w.word}</span>
                        <span className="word-arrow">→</span>
                        <span className="word-translation">{l2.flag} {w.translation}</span>
                      </div>
                    </div>
                    <div className="word-actions">
                      <button className="icon-btn" onClick={() => restore(w.setId, w.id)} title="استعادة">↩️</button>
                      <button className="icon-btn danger" onClick={() => deleteWord(w.setId, w.id)} title="حذف">🗑️</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ==================== التطبيق الرئيسي ====================
    function App() {
      const [sets, setSets] = useLocalStorage('vocaflow-sets', []);
      const [view, setView] = useState('home');
      const [currentSetId, setCurrentSetId] = useState(null);
      const [gameResults, setGameResults] = useState(null);
      const [gameCards, setGameCards] = useState(null);
      const [retryMode, setRetryMode] = useState(null);
      const [gameKey, setGameKey] = useState(0);
      const [gameType, setGameType] = useState('flashcards');
      const [archivedGameWords, setArchivedGameWords] = useState(null);

      const currentSet = sets.find((s) => s.id === currentSetId);

      const updateSet = (updatedSet) => {
        setSets(sets.map((s) => (s.id === updatedSet.id ? updatedSet : s)));
      };

      const createSet = (newSet) => setSets([...sets, newSet]);
      const deleteSet = (id) => setSets(sets.filter((s) => s.id !== id));

      const openSet = (id) => {
        setCurrentSetId(id);
        setView('editor');
      };

      const startGame = (type = 'flashcards', mode = 'all') => {
        setGameType(type);
        setRetryMode(mode);
        setGameKey(Date.now());
        setView('game');
      };

      const finishGame = (results, cards) => {
        setGameResults(results);
        setGameCards(cards);
        setView('results');
      };

      const goHome = () => {
        setView('home');
        setCurrentSetId(null);
        setGameResults(null);
        setGameCards(null);
        setRetryMode(null);
        setArchivedGameWords(null);
      };

      const playArchived = (archivedWords) => {
        // Create a temporary set with archived words
        const tempSet = {
          id: 'archived-temp',
          name: 'الكلمات المحفوظة',
          lang1: archivedWords[0]?.set?.lang1 || 'fr',
          lang2: archivedWords[0]?.set?.lang2 || 'ar',
          words: archivedWords.map(w => ({ ...w, archived: false })),
        };
        setArchivedGameWords(tempSet);
        setGameType('flashcards');
        setGameKey(Date.now());
        setView('game');
      };

      const gameSet = (() => {
        if (archivedGameWords) return archivedGameWords;
        if (!currentSet) return null;
        if (retryMode === 'wrong' && gameCards) {
          const wrongIds = new Set(gameResults.filter((r) => !r.correct).map((r) => r.id));
          return {
            ...currentSet,
            words: currentSet.words.filter((w) => wrongIds.has(w.id)),
          };
        }
        return currentSet;
      })();

      return (
        <div className="app">
          {view === 'home' && (
            <Home
              sets={sets}
              onCreateSet={createSet}
              onDeleteSet={deleteSet}
              onOpenSet={openSet}
              onOpenArchive={() => setView('archive')}
            />
          )}
          {view === 'editor' && currentSet && (
            <SetEditor
              set={currentSet}
              onUpdateSet={updateSet}
              onBack={goHome}
              onStartGame={startGame}
            />
          )}
          {view === 'game' && gameSet && gameType === 'flashcards' && (
            <FlashcardsGame
              key={gameKey}
              set={gameSet}
              onUpdateSet={archivedGameWords ? () => {} : updateSet}
              onFinish={finishGame}
              onExit={() => {
                setArchivedGameWords(null);
                setView(archivedGameWords ? 'archive' : 'editor');
              }}
            />
          )}
          {view === 'game' && gameSet && gameType === 'mcq' && (
            <MCQGame
              key={gameKey}
              set={gameSet}
              onUpdateSet={updateSet}
              onFinish={finishGame}
              onExit={() => setView('editor')}
            />
          )}
          {view === 'game' && gameSet && gameType === 'spelling' && (
            <SpellingGame
              key={gameKey}
              set={gameSet}
              onUpdateSet={updateSet}
              onFinish={finishGame}
              onExit={() => setView('editor')}
            />
          )}
          {view === 'game' && gameSet && gameType === 'matching' && (
            <MatchingGame
              key={gameKey}
              set={gameSet}
              onUpdateSet={updateSet}
              onFinish={finishGame}
              onExit={() => setView('editor')}
            />
          )}
          {view === 'results' && gameResults && (
            <Results
              results={gameResults}
              cards={gameCards}
              onRetry={() => startGame(gameType, 'all')}
              onRetryWrong={() => startGame(gameType, 'wrong')}
              onHome={goHome}
            />
          )}
          {view === 'archive' && (
            <Archive
              sets={sets}
              onUpdateSet={updateSet}
              onBack={goHome}
              onPlayArchived={playArchived}
            />
          )}
        </div>
      );
    }

    // ==================== التشغيل ====================
    function Root() {
      return (
        <ToastProvider>
          <App />
        </ToastProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
