<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4F46E5" />
    <title>VOCAflow - تعلم الكلمات</title>

    <!-- React + Babel من CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <style>
        /* ============ المتغيرات ============ */
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #EEF2FF;
            --success: #10B981;
            --success-light: rgba(16, 185, 129, 0.15);
            --danger: #EF4444;
            --danger-light: rgba(239, 68, 68, 0.15);
            --warning: #F59E0B;
            --text: #1F2937;
            --text-light: #6B7280;
            --text-white: #FFFFFF;
            --bg-gradient: linear-gradient(135deg, #E0E7FF 0%, #DDD6FE 40%, #F3E8FF 70%, #FCE7F3 100%);
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.35);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        input,
        textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        html,
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tajawal', 'Cairo', 'Noto Sans Arabic', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            padding-bottom: var(--safe-bottom);
        }

        #root {
            min-height: 100vh;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        .page {
            padding: 20px;
            padding-bottom: 40px;
            min-height: 100vh;
            animation: fadePage 0.35s ease;
        }

        @keyframes fadePage {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #764BA2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .page-header h1:hover {
            transform: scale(1.02);
        }

        .page-header h1:active {
            transform: scale(0.97);
        }

        .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 2px;
        }

        /* ============ Glassmorphism Base ============ */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius);
        }

        /* ============ الأزرار ============ */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            min-height: 48px;
            min-width: 48px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #764BA2);
            color: white;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.30);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.40);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.30);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.40);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.30);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.40);
        }

        .btn-secondary {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.92);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-light);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.4);
            color: var(--primary);
        }

        .btn-block {
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-large {
            padding: 16px 24px;
            font-size: 18px;
            margin-top: 20px;
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 14px;
            min-height: 36px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            font-family: inherit;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.93);
        }

        .icon-btn.danger:hover {
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
        }

        .icon-btn.success:hover {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 13px;
            margin-top: 6px;
            padding: 0;
            font-family: inherit;
            text-decoration: underline;
        }

        /* ============ حقول الإدخال ============ */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            min-height: 48px;
            color: var(--text);
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.10);
        }

        .loading-dot {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ============ الصفحة الرئيسية ============ */
        .home-page .page-header {
            flex-direction: column;
            align-items: flex-start;
            text-align: start;
        }

        .home-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 16px 12px;
            border-radius: var(--radius);
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* ============ Dropdown ============ */
        .dropdown-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }

        .dropdown-trigger {
            width: 100%;
            padding: 14px 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 56px;
            font-family: inherit;
            color: var(--text);
        }

        .dropdown-trigger:hover {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--glass-shadow);
        }

        .dropdown-trigger .arrow {
            transition: transform 0.3s;
        }

        .dropdown-trigger .arrow.open {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            z-index: 50;
            max-height: 320px;
            overflow-y: auto;
            animation: slideDown 0.25s ease;
            padding: 8px 0;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: none;
            border: none;
            width: 100%;
            text-align: start;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            color: var(--text);
            min-height: 48px;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .dropdown-item:active {
            background: rgba(255, 255, 255, 0.7);
        }

        .dropdown-item .badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .dropdown-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 4px 12px;
        }

        .dropdown-item.primary {
            color: var(--primary);
            font-weight: 600;
        }

        /* ============ Games Grid ============ */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .game-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 16px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
        }

        .game-card:active {
            transform: scale(0.95);
        }

        .game-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .game-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .game-desc {
            font-size: 11px;
            color: var(--text-light);
        }

        /* ============ Saved Words Section ============ */
        .saved-section {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin: 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .saved-section .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .saved-section .info .icon {
            font-size: 28px;
        }

        .saved-section .info .text .count {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }

        .saved-section .info .text .label {
            font-size: 13px;
            color: var(--text-light);
        }

        /* ============ Footer actions ============ */
        .home-footer {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--glass-border);
        }

        .home-footer .btn {
            flex: 1;
        }

        /* ============ Set Cards ============ */
        .sets-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .set-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 16px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
        }

        .set-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .set-card:active {
            transform: scale(0.98);
        }

        .set-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .set-card-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .set-card-meta {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 6px;
        }

        .set-card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-light);
            padding-top: 8px;
            border-top: 1px solid var(--glass-border);
        }

        /* ============ Modal ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
            padding: 24px;
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(24px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            margin-bottom: 16px;
            font-size: 22px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        .lang-select-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ============ Set Editor ============ */
        .editor-page h2 {
            font-size: 18px;
            margin: 24px 0 12px;
        }

        .word-input-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .input-actions {
            display: flex;
            gap: 10px;
        }

        .input-actions .btn {
            flex: 1;
        }

        .words-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .word-item {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 12px;
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .word-item:hover {
            transform: translateX(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
        }

        .word-item.archived {
            opacity: 0.6;
        }

        .word-content {
            flex: 1;
            min-width: 0;
        }

        .word-set-name {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .word-main {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .word-original {
            font-weight: 600;
            font-size: 16px;
        }

        .word-arrow {
            color: var(--text-light);
        }

        .word-translation {
            color: var(--text-light);
            font-size: 15px;
        }

        .word-errors {
            font-size: 12px;
            color: var(--danger);
            margin-top: 4px;
        }

        .word-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        /* ============ Game Page ============ */
        .game-page {
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .game-info {
            text-align: center;
            flex: 1;
        }

        .game-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-light);
        }

        .game-counter {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #764BA2);
            transition: width 0.4s ease;
        }

        .game-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 0;
            min-height: 380px;
            position: relative;
        }

        /* ============ Flashcard ============ */
        .flashcard-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            perspective: 1000px;
            cursor: grab;
            position: relative;
            touch-action: none;
        }

        .flashcard-wrapper:active {
            cursor: grabbing;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: linear-gradient(145deg, rgba(79, 70, 229, 0.92) 0%, rgba(118, 75, 162, 0.92) 100%);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: white;
            text-align: center;
        }

        .flashcard-back {
            background: linear-gradient(145deg, rgba(240, 147, 251, 0.92) 0%, rgba(245, 87, 108, 0.92) 100%);
            transform: rotateY(180deg);
        }

        .flashcard-lang {
            position: absolute;
            top: 14px;
            font-size: 13px;
            opacity: 0.85;
            font-weight: 500;
            left: 16px;
        }

        .flashcard-text {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
            padding: 0 8px;
        }

        .flashcard-hint {
            position: absolute;
            bottom: 14px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* ============ Speak Button on Card ============ */
        .speak-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.18);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            pointer-events: auto;
        }

        .speak-btn:hover {
            background: rgba(255, 255, 255, 0.30);
            transform: scale(1.08);
        }

        .speak-btn:active {
            transform: scale(0.92);
        }

        .speak-btn.speaking {
            animation: pulse 0.5s infinite;
        }

        .speak-btn .spinner-ring {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ============ Save Button on Card ============ */
        .save-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.18);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            pointer-events: auto;
            color: white;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.30);
            transform: scale(1.08);
        }

        .save-btn:active {
            transform: scale(0.92);
        }

        .save-btn.saved {
            color: #FCD34D;
            background: rgba(252, 211, 77, 0.25);
        }

        .save-btn.saved:hover {
            background: rgba(252, 211, 77, 0.35);
        }

        /* ============ Swipe Indicator ============ */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 20px;
            animation: popIn 0.2s;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes popIn {
            from {
                transform: translateY(-50%) scale(0.7);
                opacity: 0;
            }
            to {
                transform: translateY(-50%) scale(1);
                opacity: 1;
            }
        }

        .swipe-indicator.right {
            right: 16px;
            background: rgba(16, 185, 129, 0.90);
            color: white;
        }

        .swipe-indicator.left {
            left: 16px;
            background: rgba(239, 68, 68, 0.90);
            color: white;
        }

        /* ============ Answer Buttons (bottom of game) ============ */
        .game-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 12px 4px 8px;
            margin-top: 8px;
        }

        .game-actions .btn {
            padding: 16px;
            font-size: 18px;
            border-radius: var(--radius);
            min-height: 60px;
        }

        .btn-wrong {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.30);
        }

        .btn-wrong:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.40);
        }

        .btn-correct {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.30);
        }

        .btn-correct:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.40);
        }

        .game-hints {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px 4px;
            font-size: 12px;
            color: var(--text-light);
        }

        .hint-correct {
            color: var(--success);
            font-weight: 600;
        }

        .hint-wrong {
            color: var(--danger);
            font-weight: 600;
        }

        /* ============ Long Press Menu ============ */
        .long-press-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.2s;
        }

        .long-press-menu {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
            border-radius: var(--radius);
            min-width: 260px;
            overflow: hidden;
            animation: slideUp 0.25s;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 16px 20px;
            background: none;
            border: none;
            text-align: start;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid var(--glass-border);
            min-height: 56px;
            color: var(--text);
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .menu-item.danger {
            color: var(--danger);
        }

        .menu-item.danger:hover {
            background: rgba(239, 68, 68, 0.08);
        }

        .menu-item.close {
            color: var(--text-light);
            border-bottom: none;
            justify-content: center;
            font-weight: 500;
        }

        /* ============ Results Page ============ */
        .results-page {
            text-align: center;
            padding-top: 30px;
        }

        .results-header {
            margin-bottom: 20px;
        }

        .results-emoji {
            font-size: 60px;
            margin-bottom: 8px;
            animation: bounce 0.6s;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-16px);
            }
        }

        .results-header h1 {
            font-size: 30px;
            background: linear-gradient(135deg, var(--primary), #764BA2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-score-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 20px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            text-align: start;
        }

        .score-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #764BA2);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.30);
        }

        .score-value {
            font-size: 34px;
            font-weight: 700;
            line-height: 1;
        }

        .score-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .score-details {
            flex: 1;
            text-align: start;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 15px;
        }

        .score-row:last-child {
            border-bottom: none;
        }

        .score-row strong {
            color: var(--primary);
        }

        .results-message {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-dark);
        }

        .wrong-words-section {
            text-align: start;
            margin-bottom: 20px;
        }

        .wrong-words-section h2 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .wrong-words-list {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .wrong-word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
        }

        .wrong-word-item:last-child {
            border-bottom: none;
        }

        .wrong-word-text {
            font-size: 15px;
        }

        .wrong-word-count {
            color: var(--danger);
            font-weight: 700;
            font-size: 14px;
        }

        .results-actions {
            margin-top: 20px;
        }

        /* ============ Empty State ============ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state.small {
            padding: 20px;
        }

        .empty-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .empty-hint {
            font-size: 13px;
            margin-top: 8px;
            opacity: 0.7;
        }

        /* ============ Toast Notifications ============ */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 92%;
            width: 440px;
            pointer-events: none;
        }

        .toast {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
            padding: 14px 20px;
            border-radius: var(--radius);
            animation: toastIn 0.35s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            pointer-events: auto;
            font-size: 15px;
        }

        @keyframes toastIn {
            from {
                transform: translateY(-80px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .toast.success {
            border-right: 4px solid var(--success);
        }
        .toast.error {
            border-right: 4px solid var(--danger);
        }
        .toast.info {
            border-right: 4px solid var(--primary);
        }

        /* ============ MCQ Game ============ */
        .mcq-word {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 28px 20px;
            border-radius: var(--radius);
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            position: relative;
        }

        .mcq-options {
            display: grid;
            gap: 12px;
        }

        .mcq-option {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 18px 16px;
            border-radius: var(--radius);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 56px;
            font-family: inherit;
            color: var(--text);
        }

        .mcq-option:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.92);
            transform: translateY(-2px);
        }

        .mcq-option:active:not(:disabled) {
            transform: scale(0.97);
        }

        .mcq-option.correct {
            background: var(--success-light);
            border-color: var(--success);
        }

        .mcq-option.wrong {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        /* ============ Spelling Game ============ */
        .spelling-input {
            width: 100%;
            padding: 18px 16px;
            font-size: 22px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius);
            margin-bottom: 16px;
            min-height: 72px;
            font-family: inherit;
            color: var(--text);
        }

        .spelling-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }

        .spelling-input.correct {
            border-color: var(--success);
            background: var(--success-light);
        }

        .spelling-input.wrong {
            border-color: var(--danger);
            background: var(--danger-light);
        }

        .spelling-feedback {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin: 12px 0 16px;
            min-height: 32px;
        }

        .spelling-feedback.correct {
            color: var(--success);
        }
        .spelling-feedback.wrong {
            color: var(--danger);
        }

        /* ============ Matching Game ============ */
        .matching-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .matching-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .matching-item {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 14px 12px;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: inherit;
            color: var(--text);
        }

        .matching-item:hover:not(.matched):not(:disabled) {
            background: rgba(255, 255, 255, 0.92);
            transform: translateY(-2px);
        }

        .matching-item:active:not(.matched):not(:disabled) {
            transform: scale(0.97);
        }

        .matching-item.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.10);
        }

        .matching-item.matched {
            background: var(--success-light);
            border-color: var(--success);
            cursor: default;
            opacity: 0.7;
        }

        /* ============ Login Page ============ */
        .login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            text-align: center;
        }

        .login-page .logo {
            font-size: 56px;
            margin-bottom: 8px;
        }

        .login-page h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #764BA2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .login-page .tagline {
            font-size: 17px;
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12);
            border-radius: var(--radius-xl);
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
        }

        .login-card .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 14px;
        }

        .login-card .divider::before,
        .login-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .btn-google {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            font-weight: 500;
        }

        .btn-google:hover {
            background: #f8f8f8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .btn-google img {
            width: 22px;
            height: 22px;
        }

        .login-card .guest-note {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-sm);
            border: 1px dashed var(--glass-border);
        }

        /* ============ Profile / Usage Stats ============ */
        .profile-section {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .profile-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #764BA2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-weight: 600;
            font-size: 17px;
        }

        .profile-email {
            font-size: 13px;
            color: var(--text-light);
        }

        .usage-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .usage-stat {
            text-align: center;
        }

        .usage-stat .value {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }

        .usage-stat .label {
            font-size: 11px;
            color: var(--text-light);
        }

        /* ============ Responsive ============ */
        @media (max-width: 640px) {
            .page {
                padding: 14px;
                padding-bottom: 28px;
            }

            .btn {
                min-height: 48px;
                padding: 12px 16px;
                font-size: 15px;
            }

            .flashcard-text {
                font-size: 30px;
            }

            .score-circle {
                width: 90px;
                height: 90px;
            }
            .score-value {
                font-size: 26px;
            }

            .results-score-card {
                flex-direction: column;
                text-align: center;
                align-items: center;
            }
            .score-details {
                text-align: center;
                width: 100%;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .home-stats {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .stat-value {
                font-size: 22px;
            }

            .matching-columns {
                gap: 10px;
            }
            .matching-item {
                font-size: 13px;
                min-height: 44px;
                padding: 10px 8px;
            }

            .mcq-word {
                font-size: 26px;
                padding: 20px 16px;
            }
            .mcq-option {
                font-size: 15px;
                padding: 14px 12px;
                min-height: 48px;
            }

            .spelling-input {
                font-size: 18px;
                min-height: 60px;
            }

            .login-card {
                padding: 24px 16px;
            }
            .login-page h1 {
                font-size: 28px;
            }

            .usage-stats {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 4px;
            }
            .usage-stat .value {
                font-size: 15px;
            }

            .game-actions .btn {
                font-size: 16px;
                padding: 14px;
                min-height: 52px;
            }

            .saved-section {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .saved-section .info {
                justify-content: center;
            }

            .dropdown-item {
                font-size: 14px;
                padding: 10px 14px;
            }
        }

        @media (max-width: 400px) {
            .home-stats {
                grid-template-columns: 1fr 1fr;
            }
            .games-grid {
                grid-template-columns: 1fr 1fr;
            }
            .flashcard-text {
                font-size: 24px;
            }
            .stat-value {
                font-size: 20px;
            }
        }

        @media (min-width: 641px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ============ Scrollbar ============ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(79, 70, 229, 0.30);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(79, 70, 229, 0.50);
        }

        /* ============ Keyboard shortcut hint ============ */
        .shortcuts-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--text-light);
            box-shadow: var(--glass-shadow);
            opacity: 0.6;
            transition: opacity 0.3s;
            z-index: 10;
            pointer-events: none;
        }

        .shortcuts-hint:hover {
            opacity: 1;
        }

        @media (max-width: 640px) {
            .shortcuts-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        // ==================== إعداد React ====================
        const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext, useReducer } = React;

        // ==================== قائمة اللغات ====================
        const LANGUAGES = [
            { code: 'ar', name: 'العربية', flag: '🇸🇦', direction: 'rtl' },
            { code: 'fr', name: 'الفرنسية', flag: '🇫🇷', direction: 'ltr' },
            { code: 'en', name: 'الإنجليزية', flag: '🇬🇧', direction: 'ltr' },
            { code: 'es', name: 'الإسبانية', flag: '🇪🇸', direction: 'ltr' },
            { code: 'de', name: 'الألمانية', flag: '🇩🇪', direction: 'ltr' },
            { code: 'it', name: 'الإيطالية', flag: '🇮🇹', direction: 'ltr' },
            { code: 'tr', name: 'التركية', flag: '🇹🇷', direction: 'ltr' },
            { code: 'pt', name: 'البرتغالية', flag: '🇵🇹', direction: 'ltr' },
            { code: 'ru', name: 'الروسية', flag: '🇷🇺', direction: 'ltr' },
            { code: 'zh', name: 'الصينية', flag: '🇨🇳', direction: 'ltr' },
            { code: 'ja', name: 'اليابانية', flag: '🇯🇵', direction: 'ltr' },
            { code: 'ko', name: 'الكورية', flag: '🇰🇷', direction: 'ltr' },

        // ==================== i18n Context ====================
        const I18nContext = createContext();

        function I18nProvider({ children }) {
            const [locale, setLocale] = useState(() => {
                const saved = localStorage.getItem('vocaflow-locale');
                if (saved && TRANSLATIONS[saved]) return saved;
                const browserLang = navigator.language?.split('-')[0] || 'en';
                return TRANSLATIONS[browserLang] ? browserLang : 'en';
            });

            const t = useCallback((key) => {
                return TRANSLATIONS[locale]?.[key] || TRANSLATIONS.en[key] || key;
            }, [locale]);

            const changeLocale = useCallback((newLocale) => {
                if (TRANSLATIONS[newLocale]) {
                    setLocale(newLocale);
                    localStorage.setItem('vocaflow-locale', newLocale);
                    // Update dir attribute
                    const lang = getLanguageByCode(newLocale);
                    document.documentElement.dir = lang.direction || 'ltr';
                    document.documentElement.lang = newLocale;
                }
            }, []);

            // Set initial direction
            useEffect(() => {
                const lang = getLanguageByCode(locale);
                document.documentElement.dir = lang.direction || 'ltr';
                document.documentElement.lang = locale;
            }, [locale]);

            const value = useMemo(() => ({ locale, t, changeLocale, languages: LANGUAGES }), [locale, t, changeLocale]);

            return React.createElement(I18nContext.Provider, { value }, children);
        }

        const useI18n = () => useContext(I18nContext);

        // ==================== Toast System ====================
        const ToastContext = createContext();

        function ToastProvider({ children }) {
            const [toasts, setToasts] = useState([]);

            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts((prev) => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts((prev) => prev.filter((t) => t.id !== id));
                }, 3000);
            }, []);

            return React.createElement(ToastContext.Provider, { value: showToast },
                children,
                React.createElement('div', { className: 'toast-container' },
                    toasts.map((toast) =>
                        React.createElement('div', { key: toast.id, className: `toast ${toast.type}` },
                            toast.type === 'success' && '✅',
                            toast.type === 'error' && '❌',
                            toast.type === 'info' && 'ℹ️',
                            ' ',
                            toast.message
                        )
                    )
                )
            );
        }

        const useToast = () => useContext(ToastContext);

        // ==================== Hook: localStorage ====================
        function useLocalStorage(key, initialValue) {
            const [value, setValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch {
                    return initialValue;
                }
            });

            useEffect(() => {
                try {
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    console.error('Error saving to localStorage', e);
                }
            }, [key, value]);

            return [value, setValue];
        }

        // ==================== Hook: Translation ====================
        function useTranslation(text, fromLang, toLang) {
            const [translation, setTranslation] = useState('');
            const [loading, setLoading] = useState(false);
            const abortRef = useRef(null);

            useEffect(() => {
                if (!text || text.trim().length < 2) {
                    setTranslation('');
                    return;
                }
                if (fromLang === toLang) {
                    setTranslation(text);
                    return;
                }

                if (abortRef.current) clearTimeout(abortRef.current);

                setLoading(true);
                abortRef.current = setTimeout(async () => {
                    try {
                        const langpair = `${fromLang}|${toLang}`;
                        const url =
                            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        const translated = data?.responseData?.translatedText || '';
                        setTranslation(translated);
                    } catch (err) {
                        console.error('Translation error:', err);
                        setTranslation('');
                    } finally {
                        setLoading(false);
                    }
                }, 400);

                return () => {
                    if (abortRef.current) clearTimeout(abortRef.current);
                };
            }, [text, fromLang, toLang]);

            return { translation, loading };
        }

        // ==================== Hook: Speech ====================
        function useSpeech() {
            const [speaking, setSpeaking] = useState(false);
            const [voices, setVoices] = useState([]);
            const [voiceLoaded, setVoiceLoaded] = useState(false);

            useEffect(() => {
                if (!('speechSynthesis' in window)) return;

                const loadVoices = () => {
                    const available = window.speechSynthesis.getVoices();
                    setVoices(available);
                    setVoiceLoaded(true);
                };

                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }

                return () => {
                    if (window.speechSynthesis) {
                        window.speechSynthesis.onvoiceschanged = null;
                        window.speechSynthesis.cancel();
                    }
                };
            }, []);

            const speak = useCallback((text, language, options = {}) => {
                if (!('speechSynthesis' in window)) {
                    console.warn('Speech synthesis not supported');
                    return;
                }

                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = language || 'en-US';
                utterance.rate = options.rate || 1.0;
                utterance.pitch = options.pitch || 1.0;
                utterance.volume = 1.0;

                // Try to find a matching voice
                if (voiceLoaded && voices.length > 0) {
                    const langPrefix = language?.split('-')[0] || '';
                    // Prefer native voice for the language
                    let preferred = voices.find(v => v.lang.startsWith(language) || v.lang.startsWith(langPrefix));
                    if (preferred) {
                        utterance.voice = preferred;
                    } else {
                        // Fallback to first voice
                        utterance.voice = voices[0];
                    }
                }

                utterance.onstart = () => setSpeaking(true);
                utterance.onend = () => setSpeaking(false);
                utterance.onerror = () => setSpeaking(false);

                window.speechSynthesis.speak(utterance);
            }, [voices, voiceLoaded]);

            const cancelSpeech = useCallback(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    setSpeaking(false);
                }
            }, []);

            return { speak, speaking, cancelSpeech, voices, voiceLoaded };
        }

        // ==================== Hook: Usage Tracking ====================
        function useUsageTracking() {
            const [stats, setStats] = useLocalStorage('vocaflow-usage', {
                sessions: [],
                totalSeconds: 0,
                daily: {},
                weekly: {},
                monthly: {},
                yearly: {},
            });

            const sessionStart = useRef(Date.now());
            const isTracking = useRef(false);

            const startSession = useCallback(() => {
                sessionStart.current = Date.now();
                isTracking.current = true;
            }, []);

            const endSession = useCallback(() => {
                if (!isTracking.current) return;
                const duration = Math.floor((Date.now() - sessionStart.current) / 1000);
                if (duration > 1) {
                    const now = new Date();
                    const dateKey = now.toISOString().split('T')[0];
                    const weekKey = `${now.getFullYear()}-W${String(Math.ceil((now.getDate() - now.getDay() + 10) / 7)).padStart(2, '0')}`;
                    const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                    const yearKey = String(now.getFullYear());

                    setStats(prev => {
                        const newStats = { ...prev };
                        newStats.totalSeconds = (newStats.totalSeconds || 0) + duration;
                        newStats.daily = { ...newStats.daily, [dateKey]: (newStats.daily?.[dateKey] || 0) + duration };
                        newStats.weekly = { ...newStats.weekly, [weekKey]: (newStats.weekly?.[weekKey] || 0) + duration };
                        newStats.monthly = { ...newStats.monthly, [monthKey]: (newStats.monthly?.[monthKey] || 0) +
                            duration };
                        newStats.yearly = { ...newStats.yearly, [yearKey]: (newStats.yearly?.[yearKey] || 0) + duration };
                        newStats.sessions = [...(newStats.sessions || []), { start: sessionStart.current, duration }];
                        return newStats;
                    });
                }
                isTracking.current = false;
            }, [setStats]);

            // Auto-start on mount
            useEffect(() => {
                startSession();
                const handleBeforeUnload = () => endSession();
                window.addEventListener('beforeunload', handleBeforeUnload);
                // Also end on visibility change (tab close)
                const handleVisibility = () => {
                    if (document.hidden) endSession();
                    else startSession();
                };
                document.addEventListener('visibilitychange', handleVisibility);

                return () => {
                    endSession();
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, []);

            const getTimeForPeriod = useCallback((period, key) => {
                const data = stats[period] || {};
                if (key) return data[key] || 0;
                // Sum all entries
                return Object.values(data).reduce((a, b) => a + b, 0);
            }, [stats]);

            const getTodaySeconds = useCallback(() => {
                const today = new Date().toISOString().split('T')[0];
                return getTimeForPeriod('daily', today);
            }, [getTimeForPeriod]);

            const getWeekSeconds = useCallback(() => {
                const now = new Date();
                const weekKey =
                    `${now.getFullYear()}-W${String(Math.ceil((now.getDate() - now.getDay() + 10) / 7)).padStart(2, '0')}`;
                return getTimeForPeriod('weekly', weekKey);
            }, [getTimeForPeriod]);

            const getMonthSeconds = useCallback(() => {
                const now = new Date();
                const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                return getTimeForPeriod('monthly', monthKey);
            }, [getTimeForPeriod]);

            const getYearSeconds = useCallback(() => {
                const now = new Date();
                const yearKey = String(now.getFullYear());
                return getTimeForPeriod('yearly', yearKey);
            }, [getTimeForPeriod]);

            const formatTime = useCallback((seconds) => {
                if (seconds < 60) return `${seconds}s`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
                if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
                return `${Math.floor(seconds / 86400)}d ${Math.floor((seconds % 86400) / 3600)}h`;
            }, []);

            return {
                stats,
                startSession,
                endSession,
                getTodaySeconds,
                getWeekSeconds,
                getMonthSeconds,
                getYearSeconds,
                formatTime,
                totalSeconds: stats.totalSeconds || 0,
            };
        }

        // ==================== Component: Flashcard ====================
        function Flashcard({ card, lang1Label, lang2Label, lang1Code, lang2Code, onCorrect, onWrong, onEdit, onArchive,
            onDelete, onSaveToggle, isSaved }) {
            const [flipped, setFlipped] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);
            const [swipeOffset, setSwipeOffset] = useState(0);
            const [swipeDirection, setSwipeDirection] = useState(null);
            const { speak, speaking, cancelSpeech } = useSpeech();

            const startX = useRef(0);
            const startY = useRef(0);
            const startTime = useRef(0);
            const isDragging = useRef(false);
            const longPressTimer = useRef(null);
            const wrapperRef = useRef(null);

            useEffect(() => {
                setFlipped(false);
                setSwipeOffset(0);
                setSwipeDirection(null);
                cancelSpeech();
            }, [card.id]);

            const handleStart = (clientX, clientY) => {
                startX.current = clientX;
                startY.current = clientY;
                startTime.current = Date.now();
                isDragging.current = false;

                longPressTimer.current = setTimeout(() => {
                    if (!isDragging.current) {
                        setMenuOpen(true);
                        if (navigator.vibrate) navigator.vibrate(50);
                    }
                }, 600);
            };

            const handleMove = (clientX, clientY) => {
                const dx = clientX - startX.current;
                const dy = clientY - startY.current;

                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    isDragging.current = true;
                    clearTimeout(longPressTimer.current);
                }

                if (isDragging.current && Math.abs(dx) > Math.abs(dy)) {
                    setSwipeOffset(dx);
                }
            };

            const handleEnd = () => {
                clearTimeout(longPressTimer.current);
                const elapsed = Date.now() - startTime.current;
                const dx = swipeOffset;

                if (!isDragging.current && elapsed < 300) {
                    setFlipped((f) => !f);
                } else if (Math.abs(dx) > 80) {
                    const direction = dx > 0 ? 'right' : 'left';
                    setSwipeDirection(direction);
                    setSwipeOffset(direction === 'right' ? 500 : -500);

                    setTimeout(() => {
                        if (direction === 'right') onCorrect();
                        else onWrong();
                    }, 200);
                } else {
                    setSwipeOffset(0);
                }

                isDragging.current = false;
            };

            const onMouseDown = (e) => {
                if (e.button !== 0) return;
                handleStart(e.clientX, e.clientY);
            };
            const onMouseMove = (e) => { if (e.buttons === 1) handleMove(e.clientX, e.clientY); };
            const onMouseUp = () => handleEnd();
            const onMouseLeave = () => { if (isDragging.current) handleEnd(); };

            const onTouchStart = (e) => {
                const touch = e.touches[0];
                if (touch) handleStart(touch.clientX, touch.clientY);
            };
            const onTouchMove = (e) => {
                const touch = e.touches[0];
                if (touch) handleMove(touch.clientX, touch.clientY);
            };
            const onTouchEnd = () => handleEnd();

            const handleSpeak = (e) => {
                e.stopPropagation();
                e.preventDefault();
                const text = flipped ? card.translation : card.word;
                const lang = flipped ? lang2Code : lang1Code;
                speak(text, lang);
            };

            const handleSave = (e) => {
                e.stopPropagation();
                e.preventDefault();
                onSaveToggle?.();
            };

            const rotation = swipeOffset / 20;
            const opacity = 1 - Math.min(Math.abs(swipeOffset) / 300, 1) * 0.3;

            const currentLang = flipped ? lang2Label : lang1Label;
            const currentText = flipped ? card.translation : card.word;

            return React.createElement(React.Fragment, null,
                React.createElement('div', {
                    className: `flashcard-wrapper ${swipeDirection ? `swipe-${swipeDirection}` : ''}`,
                    style: {
                        transform: `translateX(${swipeOffset}px) rotate(${rotation}deg)`,
                        opacity,
                        transition: isDragging.current ? 'none' : 'transform 0.3s, opacity 0.3s',
                    },
                    ref: wrapperRef,
                    onMouseDown: onMouseDown,
                    onMouseMove: onMouseMove,
                    onMouseUp: onMouseUp,
                    onMouseLeave: onMouseLeave,
                    onTouchStart: onTouchStart,
                    onTouchMove: onTouchMove,
                    onTouchEnd: onTouchEnd,
                },
                    React.createElement('div', { className: `flashcard ${flipped ? 'flipped' : ''}` },
                        React.createElement('div', { className: 'flashcard-face flashcard-front' },
                            React.createElement('div', { className: 'flashcard-lang' }, lang1Label),
                            React.createElement('button', {
                                className: `speak-btn ${speaking ? 'speaking' : ''}`,
                                onMouseDown: (e) => { e.stopPropagation();
                                    e.preventDefault(); },
                                onTouchStart: (e) => { e.stopPropagation();
                                    e.preventDefault(); },
                                onClick: handleSpeak,
                                title: 'نطق',
                            }, speaking ? React.createElement('div', { className: 'spinner-ring' }) : '🔊'),
                            React.createElement('button', {
                                className: `save-btn ${isSaved ? 'saved' : ''}`,
                                onMouseDown: (e) => { e.stopPropagation();
                                    e.preventDefault(); },
                                onTouchStart: (e) => { e.stopPropagation();
                                    e.preventDefault(); },
                                onClick: handleSave,
                                title: isSaved ? 'تم الحفظ' : 'حفظ الكلمة',
                            }, isSaved ? '⭐' : '☆'),
                            React.createElement('div', { className: 'flashcard-text' }, card.word),
                            React.createElement('div', { className: 'flashcard-hint' }, 'اضغط للتقليب')
                        ),
                        React.createElement('div', { className: 'flashcard-face flashcard-back' },
                            React.createElement('div', { className: 'flashcard-lang' }, lang2Label),
                            React.createElement('button', {
                                className: `speak-btn ${speaking ? 'speaking' : ''}`,
                                onMouseDown: (e) => { e.stopPropagation();
                                    e.preventDefault(); },
                                onTouchStart: (e) => { e.stopPropagation();
