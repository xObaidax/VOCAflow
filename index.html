    // ================================================================
    //  GAME: FLASHCARDS
    // ================================================================
    function FlashcardsGame({ set, savedIds, onToggleSaved, onFinish, onExit }) {
      const { t } = useI18n();
      const { speak, speaking } = useSpeech();
      const { sparkles, trigger } = useSparkle();
      const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);

      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [results, setResults] = useState([]);
      const card = cards[idx];

      useEffect(() => { setFlipped(false); }, [idx]);

      if (!card) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      const answer = (ok, e) => {
        if (ok && e) {
          const rect = e.currentTarget.getBoundingClientRect();
          trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        const nr = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
        setResults(nr);
        if (idx + 1 >= cards.length) onFinish(nr, cards);
        else setIdx(idx + 1);
      };

      const isSaved = savedIds.includes(card.id);
      const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
      const l1 = getLang(set.lang1);
      const l2 = getLang(set.lang2);

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">{set.name}</div>
              <div className="game-subtitle">{t("card")} {idx + 1} {t("of")} {cards.length}</div>
            </div>
            <button className="icon-btn" onClick={() => answer(false)} style={{ color: "var(--text-primary)" }}>⏭️</button>
          </div>

          <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }}></div></div>

          <div className="flashcard-wrap">
            <div className={`flashcard ${flipped ? "flipped" : ""}`} onClick={() => setFlipped(f => !f)}>
              <div className="face front">
                <div className="card-top-actions">
                  <button className={`card-round-btn ${isSaved ? "saved" : ""}`} onClick={(e) => { e.stopPropagation();
                      onToggleSaved(card.id); }}>{isSaved ? "⭐" : "☆"}</button>
                  <span className="card-chip">{idx + 1}/{cards.length}</span>
                  <button className={`card-round-btn ${speaking ? "speaking" : ""}`} onClick={(e) => { e.stopPropagation();
                      speak(card.word, set.lang1); }}>🔊</button>
                </div>
                <div className="lang-label">{l1.flag} {l1.name}</div>
                <div className="big">{card.word}</div>
                <div className="hint">✨ {t("tapToFlip")}</div>
              </div>
              <div className="face back">
                <div className="card-top-actions">
                  <button className={`card-round-btn ${isSaved ? "saved" : ""}`} onClick={(e) => { e.stopPropagation();
                      onToggleSaved(card.id); }}>{isSaved ? "⭐" : "☆"}</button>
                  <span className="card-chip">{idx + 1}/{cards.length}</span>
                  <button className={`card-round-btn ${speaking ? "speaking" : ""}`} onClick={(e) => { e.stopPropagation();
                      speak(card.translation, set.lang2); }}>🔊</button>
                </div>
                <div className="lang-label">{l2.flag} {l2.name}</div>
                <div className="big">{card.translation}</div>
                <div className="hint">✨ {t("tapToFlip")}</div>
              </div>
            </div>
          </div>

          <div className="game-actions">
            <button className="btn btn-danger btn-lg" onClick={() => answer(false)}>✗ {t("wrong")}</button>
            <button className="btn btn-success btn-lg" onClick={(e) => answer(true, e)}>✓ {t("correct")}</button>
          </div>
        </div>
      );
    }

    // ================================================================
    //  GAME: MCQ
    // ================================================================
    function MCQGame({ set, onFinish, onExit, speed }) {
      const { t } = useI18n();
      const { speak } = useSpeech();
      const { sparkles, trigger } = useSparkle();
      const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);

      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [options, setOptions] = useState([]);
      const [results, setResults] = useState([]);
      const [time, setTime] = useState(speed ? 10 : 0);
      const card = cards[idx];

      useEffect(() => {
        if (!card) return;
        const others = set.words.filter(w => w.id !== card.id).map(w => w.translation).sort(() => Math.random() -
          0.5).slice(0, 3);
        setOptions(shuffle([card.translation, ...others]));
        setSelected(null);
        if (speed) setTime(10);
      }, [idx, card?.id]);

      useEffect(() => {
        if (!speed || selected !== null || !card) return;
        if (time <= 0) { choose(null); return; }
        const timer = setTimeout(() => setTime(tt => tt - 1), 1000);
        return () => clearTimeout(timer);
      }, [time, speed, selected, card?.id]);

      if (!card) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      const choose = (opt, e) => {
        if (selected !== null) return;
        const ok = opt === card.translation;
        if (ok && e) {
          const rect = e.currentTarget.getBoundingClientRect();
          trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        setSelected(opt === null ? "__timeout__" : opt);
        const nr = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
        setResults(nr);
        setTimeout(() => {
          if (idx + 1 >= cards.length) onFinish(nr, cards);
          else setIdx(idx + 1);
        }, 1000);
      };

      const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">{speed ? "⚡ " : "🎯 "}{set.name}</div>
              <div className="game-subtitle">{t("question")} {idx + 1} {t("of")} {cards.length}</div>
            </div>
            {speed ? <span className="card-chip" style={{ background: "rgba(102,126,234,0.15)", color: "var(--text-primary)" }}>⏱️ {time}s</span> :
              <div></div>}
          </div>

          <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }}></div></div>

          <div className="mcq-word-box glass">
            <button className="icon-btn" style={{ position: "absolute", top: 14, right: 14 }} onClick={() => speak(card
                .word, set.lang1)}>🔊</button>
            <div>{card.word}</div>
          </div>

          <div className="mcq-options">
            {options.map((opt, i) => {
              let cls = "mcq-option";
              if (selected !== null) {
                if (opt === card.translation) cls += " correct";
                else if (opt === selected) cls += " wrong";
              }
              return (
                <button key={i} className={cls} disabled={selected !== null} onClick={(e) => choose(opt, e)}>{opt}</button>
              );
            })}
          </div>
        </div>
      );
    }

    // ================================================================
    //  GAME: SPELLING
    // ================================================================
    function SpellingGame({ set, onFinish, onExit }) {
      const { t } = useI18n();
      const { speak } = useSpeech();
      const { sparkles, trigger } = useSparkle();
      const cards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);

      const [idx, setIdx] = useState(0);
      const [val, setVal] = useState("");
      const [msg, setMsg] = useState(null);
      const [results, setResults] = useState([]);
      const card = cards[idx];

      useEffect(() => {
        setVal("");
        setMsg(null);
        if (card) setTimeout(() => speak(card.translation, set.lang2), 300);
      }, [idx, card?.id]);

      if (!card) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      const submit = (e) => {
        if (!card || msg) return;
        const ok = val.trim().toLowerCase() === card.word.toLowerCase();
        if (ok && e) {
          const rect = e.currentTarget.getBoundingClientRect();
          trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        setMsg(ok ? "correct" : "wrong");
        const nr = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
        setResults(nr);
        setTimeout(() => {
          if (idx + 1 >= cards.length) onFinish(nr, cards);
          else setIdx(idx + 1);
        }, 1400);
      };

      const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
      const l2 = getLang(set.lang2);

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">✍️ {set.name}</div>
              <div className="game-subtitle">{t("question")} {idx + 1} {t("of")} {cards.length}</div>
            </div>
            <button className="icon-btn" onClick={() => speak(card.translation, set.lang2)} style={{ color: "var(--text-primary)" }}>🔊</button>
          </div>

          <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }}></div></div>

          <div className="spelling-box glass">
            <div style={{ fontSize: 13, color: "var(--text-secondary)", fontWeight: 600 }}>{l2.flag} {t("listenWrite")}</div>
            <div className="spelling-translation">{card.translation}</div>
          </div>

          <input className={`spelling-input ${msg || ""}`} value={val} onChange={e => setVal(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") submit(e); }} placeholder={t("typeWord")} disabled={!!msg} autoFocus />

          {msg === "wrong" && <div style={{ textAlign: "center", color: "var(--danger)", fontWeight: 700,
              marginBottom: 14 }}>❌ {t("letsLearn")} <strong>{card.word}</strong></div>}
          {msg === "correct" && <div style={{ textAlign: "center", color: "var(--success)", fontWeight: 700,
              marginBottom: 14 }}>✅ {t("greatJob")}</div>}

          <button className="btn btn-primary btn-block btn-lg" onClick={(e) => submit(e)} disabled={!val.trim() || !!msg}>
            {t("check")}
          </button>
        </div>
      );
    }

    // ================================================================
    //  GAME: MATCHING
    // ================================================================
    function MatchingGame({ set, onFinish, onExit }) {
      const { t } = useI18n();
      const { sparkles, trigger } = useSparkle();
      const pairs = useMemo(() => set.words.slice(0, 6), [set.id, set.words.length]);

      const [left] = useState(() => shuffle(pairs));
      const [right] = useState(() => shuffle(pairs));
      const [selL, setSelL] = useState(null);
      const [selR, setSelR] = useState(null);
      const [matched, setMatched] = useState([]);
      const [results, setResults] = useState([]);

      useEffect(() => {
        if (!selL || !selR) return;
        const ok = selL.id === selR.id;
        if (ok) {
          const btnL = document.querySelector(`[data-match="${selL.id}-l"]`);
          if (btnL) {
            const rect = btnL.getBoundingClientRect();
            trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
          }
        }
        const nr = [...results, { id: selL.id, correct: ok, word: selL.word, translation: selL.translation }];
        setResults(nr);
        if (ok) setMatched(m => [...m, selL.id]);
        setTimeout(() => {
          setSelL(null);
          setSelR(null);
          if (ok && matched.length + 1 === pairs.length) onFinish(nr, pairs);
        }, 500);
      }, [selL, selR]);

      if (pairs.length < 2) {
        return (
          <div className="glass results-box"><p>{t("noWords")}</p><button className="btn btn-primary" onClick={onExit}>{t(
              "home")}</button></div>
        );
      }

      return (
        <div>
          {sparkles.length > 0 && (
            <div className="sparkle-container">{sparkles.map(s => <div key={s.id} className="sparkle" style={{ left: s
                    .x, top: s.y }}>{s.emoji}</div>)}</div>
          )}
          <div className="game-header">
            <button className="icon-btn" onClick={onExit} style={{ color: "var(--text-primary)" }}>✕</button>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div className="game-title">🔗 {set.name}</div>
              <div className="game-subtitle">{matched.length}/{pairs.length} {t("matchPairs")}</div>
            </div>
          </div>

          <div className="match-grid">
            <div>
              {left.map(item => (
                <button key={item.id} data-match={`${item.id}-l`}
                className={`match-btn ${selL?.id === item.id ? "selected" : ""} ${matched.includes(item.id) ? "matched" : ""}`}
                disabled={matched.includes(item.id)} onClick={() => { if (!selL || !selR) setSelL(item); }}>{item
                  .word}</button>
              ))}
            </div>
            <div>
              {right.map(item => (
                <button key={item.id} className={`match-btn ${selR?.id === item.id ? "selected" : ""} ${matched
                    .includes(item.id) ? "matched" : ""}`}
                disabled={matched.includes(item.id)} onClick={() => { if (!selL || !selR) setSelR(item); }}>{item
                  .translation}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ================================================================
    //  RESULTS
    // ================================================================
    function Results({ results, onRetry, onRetryWrong, onHome }) {
      const { t } = useI18n();
      const total = results.length;
      const correct = results.filter(r => r.correct).length;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      const wrong = results.filter(r => !r.correct);

      let label = t("tryAgain"),
        msg = t("msgTryAgain"),
        emoji = "💪";
      if (pct >= 90) { label = t("excellent");
        msg = t("msgExcellent");
        emoji = "🌟"; } else if (pct >= 70) { label = t("good");
        msg = t("msgGood");
        emoji = "👏"; } else if (pct >= 50) { label = t("fair");
        msg = t("msgFair");
        emoji = "👍"; }

      return (
        <div className="results-box glass">
          <div className="results-emoji">{emoji}</div>
          <h2 style={{ fontSize: 30, fontWeight: 900, marginBottom: 10 }}>{t("results")}</h2>
          <div className="score-circle">{pct}%</div>
          <div className="muted">{t("correctAnswers")}: <strong style={{ color: "var(--primary)", fontSize: 16 }}>{correct}
              /{total}</strong></div>
          <div style={{ margin: "16px 0", fontWeight: 800, fontSize: 19 }}>{label}</div>
          <div className="results-message">{msg}</div>

          {wrong.length > 0 && (
            <div className="wrong-words-section">
              <div className="wrong-words-title">❌ {t("wrongWords")}</div>
              {wrong.map((w, i) => (
                <div key={i} className="word-row">
                  <div><div className="word-row-text">{w.word}</div><div className="word-row-translation">→ {w
                      .translation}</div></div>
                </div>
              ))}
            </div>
          )}

          <button className="btn btn-primary btn-block btn-lg" onClick={onRetry}>🔄 {t("retry")}</button>
          {wrong.length > 0 && <button className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={
              onRetryWrong}>⭐ {t("retryWrong")}</button>}
          <button className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onHome}>🏠 {t("home")}</button>
        </div>
      );
    }

    // ================================================================
    //  LOGIN SCREEN
