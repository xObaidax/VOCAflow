              disabled={loading}
            >
              👤 {t("continueGuest")}
            </button>

            <div style={{ marginTop: 24, paddingTop: 16, borderTop: "1px solid var(--border-dark)" }}>
              <div className="field" style={{ marginBottom: 0 }}>
                <label style={{ fontSize: 12, fontWeight: 600 }}>🌍 {t("language")}</label>
                <select value={locale} onChange={e => setLocale(e.target.value)} style={{ fontSize: 13, padding: "8px 12px" }}>
                  {langs.map(l => <option key={l.code} value={l.code}>{l.flag} {l.name}</option>)}
                </select>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ================================================================
    //  MAIN APP
    // ================================================================
    function AppContent() {
      const { t, locale, setLocale, langs } = useI18n();
      const toast = useToast();
      const usage = useUsage();

      // Theme
      const [theme, setTheme] = useLocalStorage("vocaflow_theme", "light");
      useEffect(() => {
        document.documentElement.classList.toggle("dark-mode", theme === "dark");
      }, [theme]);
      const toggleTheme = () => setTheme(t => t === "light" ? "dark" : "light");

      // Auth state
      const [authUser, setAuthUser] = useLocalStorage("vocaflow_user", null);
      const [authLoading, setAuthLoading] = useState(false);
      const [isGuest, setIsGuest] = useLocalStorage("vocaflow_is_guest", false);

      // Data
      const [sets, setSets] = useLocalStorage("vocaflow_sets", DEFAULT_SETS);
      const [savedIds, setSavedIds] = useLocalStorage("vocaflow_saved", []);

      const [view, setView] = useState("home");
      const [currentSetId, setCurrentSetId] = useState(sets[0]?.id || null);
      const [gameType, setGameType] = useState("flashcards");
      const [gameKey, setGameKey] = useState(0);
      const [retryWrong, setRetryWrong] = useState(false);
      const [gameResults, setGameResults] = useState(null);
      const [modal, setModal] = useState(null);
      const [newSet, setNewSet] = useState({ name: "", lang1: "fr", lang2: "ar" });
      const [loginData, setLoginData] = useState({ name: "", email: "" });

      // Firebase auth handlers
      const handleGoogleSignIn = useCallback(async () => {
        if (!IS_FIREBASE_CONFIGURED || !firebaseAuth) {
          // Fallback: simulated sign-in
          const name = prompt("Enter your name (Google sign-in simulation):") || "Guest";
          setAuthUser({ name, email: "guest@demo.com", photoURL: null });
          setIsGuest(false);
          toast(t("savedMsg"), "success");
          return;
        }
        setAuthLoading(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          const result = await firebaseAuth.signInWithPopup(provider);
          const user = result.user;
          const userData = {
            name: user.displayName || "User",
            email: user.email,
            photoURL: user.photoURL,
            uid: user.uid,
            isGuest: false
          };
          setAuthUser(userData);
          setIsGuest(false);
          toast(t("savedMsg"), "success");

          // Load user data from Firestore
          if (firestore) {
            const doc = await firestore.collection("users").doc(user.uid).get();
            if (doc.exists) {
              const data = doc.data();
              if (data.sets) setSets(data.sets);
              if (data.savedIds) setSavedIds(data.savedIds);
              if (data.theme) setTheme(data.theme);
              if (data.locale) setLocale(data.locale);
            } else {
              // First time user — save initial data
              await firestore.collection("users").doc(user.uid).set({
                email: user.email,
                displayName: user.displayName,
                photoURL: user.photoURL,
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString(),
                theme: theme,
                locale: locale,
                sets: sets,
                savedIds: savedIds
              });
            }
          }
        } catch (err) {
          console.error("Google sign-in error:", err);
          toast(t("error") || "Sign-in failed", "error");
        }
        setAuthLoading(false);
      }, [sets, savedIds, theme, locale]);

      // Guest sign-in
      const handleGuestContinue = useCallback(() => {
        setAuthUser({ name: "Guest", email: "guest@demo.com", photoURL: null, isGuest: true });
        setIsGuest(true);
        toast(t("savedMsg"), "success");
      }, []);

      // Logout
      const handleLogout = useCallback(() => {
        if (firebaseAuth && !isGuest) {
          firebaseAuth.signOut().catch(() => {});
        }
        setAuthUser(null);
        setIsGuest(false);
        toast(t("logout"), "info");
      }, [isGuest]);

      // Check for existing Firebase session
      useEffect(() => {
        if (IS_FIREBASE_CONFIGURED && firebaseAuth && !authUser && !isGuest) {
          const unsubscribe = firebaseAuth.onAuthStateChanged(async (user) => {
            if (user) {
              const userData = {
                name: user.displayName || "User",
                email: user.email,
                photoURL: user.photoURL,
                uid: user.uid,
                isGuest: false
              };
              setAuthUser(userData);
              if (firestore) {
                try {
                  const doc = await firestore.collection("users").doc(user.uid).get();
                  if (doc.exists) {
                    const data = doc.data();
                    if (data.sets) setSets(data.sets);
                    if (data.savedIds) setSavedIds(data.savedIds);
                    if (data.theme) setTheme(data.theme);
                    if (data.locale) setLocale(data.locale);
                  }
                } catch (e) { /* ignore */ }
              }
            }
          });
          return () => unsubscribe();
        }
      }, []);

      // Auto-save to Firestore
      useEffect(() => {
        if (IS_FIREBASE_CONFIGURED && firestore && authUser && !authUser.isGuest && authUser.uid) {
          const saveTimeout = setTimeout(() => {
            firestore.collection("users").doc(authUser.uid).set({
              email: authUser.email,
              displayName: authUser.name,
              photoURL: authUser.photoURL,
              lastLogin: new Date().toISOString(),
              theme: theme,
              locale: locale,
              sets: sets,
              savedIds: savedIds
            }, { merge: true }).catch(() => {});
          }, 1000);
          return () => clearTimeout(saveTimeout);
        }
      }, [sets, savedIds, theme, locale, authUser]);

      // If not authenticated and not guest, show login
      if (!authUser) {
        return (
          <LoginScreen
            onGoogleSignIn={handleGoogleSignIn}
            onGuestContinue={handleGuestContinue}
            loading={authLoading}
          />
        );
      }

      // Main app
      useEffect(() => {
        if (!currentSetId && sets.length) setCurrentSetId(sets[0].id);
        if (currentSetId && !sets.find(s => s.id === currentSetId)) {
          setCurrentSetId(sets[0]?.id || null);
        }
      }, [sets, currentSetId]);

      const currentSet = sets.find(s => s.id === currentSetId) || null;
      const savedWords = sets.flatMap(s =>
        s.words.filter(w => savedIds.includes(w.id)).map(w => ({ ...w, lang1: s.lang1, lang2: s.lang2 }))
      );
      const savedSet = savedWords.length ? {
        id: "saved",
        name: t("sanctuary"),
        lang1: savedWords[0].lang1,
        lang2: savedWords[0].lang2,
        words: savedWords
      } : null;

      const baseSet = gameType === "saved" ? savedSet : currentSet;
      const wrongIds = gameResults ? [...new Set(gameResults.filter(r => !r.correct).map(r => r.id))] : [];
      const gameSet = retryWrong && gameResults && baseSet ?
        { ...baseSet, words: baseSet.words.filter(w => wrongIds.includes(w.id)) } :
        baseSet;

      const updateSet = (updated) => { setSets(prev => prev.map(s => s.id === updated.id ? updated : s)); };
      const deleteSet = (id) => { setSets(prev => prev.filter(s => s.id !== id));
        toast(t("deleted"), "info"); };
      const deleteWord = (setId, wordId) => {
        setSets(prev => prev.map(s => s.id !== setId ? s : { ...s, words: s.words.filter(w => w.id !== wordId) }));
      };
      const toggleSaved = (wordId) => {
        setSavedIds(prev => prev.includes(wordId) ? prev.filter(id => id !== wordId) : [...prev, wordId]);
      };

      const createSet = () => {
        if (!newSet.name.trim()) { toast(t("setName"), "error"); return; }
        const set = { id: "set" + uid(), name: newSet.name.trim(), lang1: newSet.lang1, lang2: newSet.lang2, words: [] };
        setSets(prev => [...prev, set]);
        setCurrentSetId(set.id);
        setModal(null);
        setNewSet({ name: "", lang1: "fr", lang2: "ar" });
        toast(t("created"), "success");
      };

      const startGame = (type) => {
        if (type === "saved") {
          if (!savedWords.length) { toast(t("noSaved"), "error"); return; }
          setGameType("saved");
          setRetryWrong(false);
          setGameKey(Date.now());
          setView("game");
          return;
        }
        if (!currentSet) { toast(t("needSelectSet"), "error"); return; }
        if (!currentSet.words.length) { toast(t("noWords"), "error"); return; }
        setGameType(type);
        setRetryWrong(false);
        setGameKey(Date.now());
        setView("game");
      };

      const finishGame = (results) => {
        setGameResults(results);
        setView("results");
      };

      const games = [
        { type: "flashcards", name: t("flashcards") },
        { type: "mcq", name: t("mcq") },
        { type: "spelling", name: t("spelling") },
        { type: "matching", name: t("matching") },
        { type: "speed", name: t("speed") }
      ];

      const renderHome = () => (
        <div>
          <div className="topbar">
            <div className="site-logo" onClick={() => setView("home")}>
              <h1>📚 {t("appName")}</h1>
              <div className="tagline">{t("tagline")}</div>
            </div>
            <div className="top-actions">
              <button className="theme-toggle" onClick={toggleTheme} title={theme === "light" ? t("darkMode") : t(
                  "lightMode")}>
                {theme === "light" ? "🌙" : "☀️"}
              </button>
            </div>
          </div>

          <ProfileCard
            user={authUser}
            usage={usage}
            savedCount={savedWords.length}
            onSettings={() => setModal("settings")}
            onLogin={() => setModal("login")}
            onLogout={handleLogout}
          />

          <div style={{ marginTop: 18 }}>
            <SelectSetDropdown
              sets={sets}
              currentSetId={currentSetId}
              onSelect={(id) => setCurrentSetId(id)}
              onEdit={(id) => { setCurrentSetId(id);
                setView("editor"); }}
              onDelete={deleteSet}
              onCreate={() => setModal("createSet")}
            />
          </div>

          <Sanctuary count={savedWords.length} onPlay={() => startGame("saved")} />

          <div className="section-title">🎮 {t("games")}</div>
          <div className="games-grid">
            {games.map(g => (
              <div key={g.type} className="game-card" onClick={() => startGame(g.type)}>
                <div className="game-icon-wrap" style={{ background: `rgba(102,126,234,0.08)` }}>
                  <GameIcon type={g.type} />
                </div>
                <div className="game-name">{g.name}</div>
              </div>
            ))}
          </div>
        </div>
      );

      const renderGame = () => {
        if (!gameSet) return null;
        if (gameType === "flashcards" || gameType === "saved") {
          return (
            <FlashcardsGame
              key={gameKey}
              set={gameSet}
              savedIds={savedIds}
              onToggleSaved={toggleSaved}
              onFinish={finishGame}
              onExit={() => setView("home")}
            />
          );
        }
        if (gameType === "mcq" || gameType === "speed") {
          return (
            <MCQGame
              key={gameKey}
              set={gameSet}
              onFinish={finishGame}
              onExit={() => setView("home")}
              speed={gameType === "speed"}
            />
          );
        }
        if (gameType === "spelling") {
          return (
            <SpellingGame
              key={gameKey}
              set={gameSet}
              onFinish={finishGame}
              onExit={() => setView("home")}
            />
          );
        }
        if (gameType === "matching") {
          return (
            <MatchingGame
              key={gameKey}
              set={gameSet}
              onFinish={finishGame}
              onExit={() => setView("home")}
            />
          );
        }
        return null;
      };

      const renderResults = () => {
        if (!gameResults) return null;
        return (
          <Results
            results={gameResults}
            onRetry={() => { setRetryWrong(false);
              setGameKey(Date.now());
              setView("game"); }}
            onRetryWrong={() => { setRetryWrong(true);
              setGameKey(Date.now());
              setView("game"); }}
            onHome={() => setView("home")}
          />
        );
      };

      const renderModal = () => {
        if (modal === "createSet") {
          return (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3>➕ {t("createSet")}</h3>
                <div className="field"><label>{t("setName")}</label><input value={newSet.name} onChange={e =>
                    setNewSet({ ...newSet, name: e.target.value })} autoFocus /></div>
                <div className="grid-2">
                  <div className="field"><label>{t("firstLang")}</label><select value={newSet.lang1} onChange={e =>
                      setNewSet({ ...newSet, lang1: e.target.value })}>{langs.map(l => <option key={l.code}
                        value={l.code}>{l.flag} {l.name}</option>)}</select></div>
                  <div className="field"><label>{t("secondLang")}</label><select value={newSet.lang2} onChange={e =>
                      setNewSet({ ...newSet, lang2: e.target.value })}>{langs.map(l => <option key={l.code}
                        value={l.code}>{l.flag} {l.name}</option>)}</select></div>
                </div>
                <div className="modal-actions">
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
                  <button className="btn btn-primary" onClick={createSet}>{t("save")}</button>
                </div>
              </div>
            </div>
          );
        }
        if (modal === "settings") {
          return (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3>⚙️ {t("settings")}</h3>
                <div className="field"><label>🌍 {t("language")}</label><select value={locale} onChange={e =>
                    setLocale(e.target.value)}>{langs.map(l => <option key={l.code} value={l.code}>{l.flag} {l
                        .name}</option>)}</select></div>
                <div className="field"><label>{t("theme")}</label><select value={theme} onChange={e => setTheme(e
                    .target.value)}><option value="light">☀️ {t("lightMode")}</option><option value="dark">🌙 {t(
                      "darkMode")}</option></select></div>
                <div className="modal-actions"><button className="btn btn-primary btn-block" onClick={() =>
                    setModal(null)}>{t("close")}</button></div>
              </div>
            </div>
          );
        }
        return null;
      };

      return (
        <div className="app">
          {view === "home" && renderHome()}
          {view === "editor" && currentSet && (
            <SetEditor
              set={currentSet}
              onBack={() => setView("home")}
              onUpdate={updateSet}
              onDeleteWord={deleteWord}
            />
          )}
          {view === "game" && renderGame()}
          {view === "results" && renderResults()}
          {renderModal()}
        </div>
      );
    }

    // ================================================================
    //  ROOT
    // ================================================================
    function Root() {
      return (
        <I18nProvider>
          <ToastProvider>
            <AppContent />
          </ToastProvider>
        </I18nProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#667EEA" />
  <title>VOCAflow — Learn words the fun way ✨</title>

  <!-- Google Fonts: Inter + Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
         THEME VARIABLES (Light default, Dark via .dark-mode)
         ============================================================ */
    :root {
      --bg-primary: #F8F9FA;
      --bg-secondary: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-strong: rgba(255, 255, 255, 0.97);
      --bg-input: rgba(255, 255, 255, 0.95);
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --text-inverse: #FFFFFF;
      --border-light: rgba(255, 255, 255, 0.45);
      --border-dark: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 8px 32px rgba(102, 126, 234, 0.12);
      --shadow-md: 0 16px 48px rgba(102, 126, 234, 0.18);
      --shadow-lg: 0 24px 64px rgba(102, 126, 234, 0.25);
      --radius: 24px;
      --radius-sm: 14px;
      --radius-lg: 28px;
      --primary: #667EEA;
      --primary-dark: #5568D3;
      --secondary: #764BA2;
      --accent: #F093FB;
      --success: #10B981;
      --success-light: rgba(16, 185, 129, 0.15);
      --warning: #F59E0B;
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger: #EF4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(255, 255, 255, 0.45);
      --flame-red: #FF6B35;
      --flame-white: #FFFFFF;
      --flame-blue: #5B7FFF;
      --flame-purple: #A855F7;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Mode */
    .dark-mode {
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-card: rgba(30, 41, 59, 0.92);
      --bg-card-strong: rgba(30, 41, 59, 0.97);
      --bg-input: rgba(30, 41, 59, 0.95);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-inverse: #1F2937;
      --border-light: rgba(255, 255, 255, 0.12);
      --border-dark: rgba(255, 255, 255, 0.06);
      --shadow-sm: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 16px 48px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.6);
      --glass-bg: rgba(30, 41, 59, 0.92);
      --glass-border: rgba(255, 255, 255, 0.10);
      --success-light: rgba(16, 185, 129, 0.20);
      --warning-light: rgba(245, 158, 11, 0.20);
      --danger-light: rgba(239, 68, 68, 0.20);
    }

    /* ============================================================
         GLOBAL RESET & BASE
         ============================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    input,
    textarea,
    select,
    button {
      font-family: inherit;
    }

    html,
    body {
      font-family: 'Tajawal', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    /* Animated gradient background (light) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg,
          rgba(102, 126, 234, 0.06) 0%,
          rgba(118, 75, 162, 0.06) 30%,
          rgba(240, 147, 251, 0.04) 60%,
          rgba(102, 126, 234, 0.06) 100%);
      background-size: 300% 300%;
      animation: gradientBg 18s ease-in-out infinite alternate;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    .dark-mode body::before {
      opacity: 0.3;
    }

    @keyframes gradientBg {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    #root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ============================================================
         SCROLLBAR
         ============================================================ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(102, 126, 234, 0.06);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(102, 126, 234, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(102, 126, 234, 0.5);
    }

    ::selection {
      background: rgba(102, 126, 234, 0.25);
      color: var(--text-primary);
    }

    /* ============================================================
         GLASSMORPHISM
         ============================================================ */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius);
      transition: all var(--transition);
    }

    .glass:hover {
      box-shadow: var(--shadow-md);
    }

    .glass-strong {
      background: var(--bg-card-strong);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
      border-radius: var(--radius);
    }

    /* ============================================================
         BUTTONS
         ============================================================ */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:active::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0) scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
    }

    .btn-success {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #fff;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }
    .btn-success:hover:not(:disabled) {
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.5);
    }

    .btn-danger {
      background: linear-gradient(135deg, #EF4444, #DC2626);
      color: #fff;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover:not(:disabled) {
      box-shadow: 0 10px 28px rgba(239, 68, 68, 0.5);
    }

    .btn-warning {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #fff;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-google {
      background: #4285F4;
      color: #fff;
      box-shadow: 0 6px 20px rgba(66, 133, 244, 0.35);
      font-size: 16px;
      padding: 14px 28px;
    }
    .btn-google:hover:not(:disabled) {
      box-shadow: 0 10px 30px rgba(66, 133, 244, 0.5);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg-card-strong);
      color: var(--text-primary);
      border: 1px solid var(--border-dark);
      backdrop-filter: blur(10px);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-card);
      border-color: var(--primary);
    }

    .btn-gold {
      background: linear-gradient(135deg, #F59E0B, #FCD34D);
      color: #7C2D12;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      font-weight: 800;
    }
    .btn-gold:hover:not(:disabled) {
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.6);
      transform: translateY(-2px);
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    .btn-sm {
      padding: 9px 16px;
      min-height: 38px;
      font-size: 13px;
      border-radius: 12px;
    }

    .btn-lg {
      padding: 16px 28px;
      font-size: 17px;
      min-height: 56px;
    }

    .icon-btn {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-dark);
      font-size: 18px;
      cursor: pointer;
      padding: 10px;
      border-radius: 12px;
      transition: all 0.2s;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }
    .icon-btn:hover {
      background: var(--bg-card-strong);
      transform: scale(1.06);
      box-shadow: var(--shadow-sm);
    }
    .icon-btn.danger:hover {
      background: var(--danger-light);
      color: var(--danger);
    }

    /* ============================================================
         UTILITY
         ============================================================ */
    .muted {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .gap-sm {
      gap: 8px;
    }
    .gap-md {
      gap: 14px;
    }
    .mt-2 {
      margin-top: 10px;
    }
    .mb-2 {
      margin-bottom: 10px;
    }
    .mt-4 {
      margin-top: 20px;
    }

    .text-center {
      text-align: center;
    }

    /* ============================================================
         TOP BAR
         ============================================================ */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .site-logo {
      cursor: pointer;
      padding: 4px 0;
    }

    .site-logo h1 {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }
    .dark-mode .site-logo h1 {
      background: linear-gradient(135deg, #818CF8, #A78BFA, #C4B5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-logo .tagline {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }
    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.08);
      box-shadow: var(--shadow-sm);
    }

    /* ============================================================
         PROFILE CARD
         ============================================================ */
    .profile-card {
      background: var(--bg-card-strong);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      transition: all var(--transition);
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(240, 147, 251, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .profile-card::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.10) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
      position: relative;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      z-index: -1;
      opacity: 0.3;
      filter: blur(12px);
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-greeting {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .profile-greeting .wave {
      display: inline-block;
      animation: wave 2.5s ease-in-out infinite;
    }
    @keyframes wave {
      0%,
      100% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(16deg);
      }
      75% {
        transform: rotate(-8deg);
      }
    }

    .profile-email {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .profile-stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid var(--border-dark);
      position: relative;
      z-index: 2;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .stat-item .value {
      color: var(--text-primary);
      font-weight: 800;
      font-size: 15px;
    }

    .profile-actions-right {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 3;
    }
    [dir="rtl"] .profile-actions-right {
      right: auto;
      left: 16px;
    }

    /* ============================================================
         ADVANCED FLAME (Realistic SVG with Rainbow for 50+)
         ============================================================ */
    .flame-advanced {
      width: 56px;
      height: 56px;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s;
      cursor: default;
    }
    .flame-advanced:hover {
      transform: scale(1.12);
    }
    .flame-advanced svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .flame-advanced .flame-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 19px;
      z-index: 3;
      line-height: 1;
      font-family: 'Inter', 'Tajawal', sans-serif;
      pointer-events: none;
      letter-spacing: -0.02em;
    }

    /* Color variants */
    .flame-red .flame-num {
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 107, 53, 0.8);
    }
    .flame-white .flame-num {
      color: #1F2937;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.9);
    }
    .flame-blue .flame-num {
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 20px rgba(91, 127, 255, 0.9);
    }
    .flame-purple .flame-num {
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 20px rgba(168, 85, 247, 0.9);
    }
    .flame-rainbow .flame-num {
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      animation: rainbowText 3s ease-in-out infinite;
    }

    @keyframes rainbowText {
      0%,
      100% {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 24px rgba(255, 107, 53, 1);
      }
      25% {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 28px rgba(255, 255, 255, 1);
      }
      50% {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 24px rgba(91, 127, 255, 1);
      }
      75% {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 24px rgba(168, 85, 247, 1);
      }
    }

    .flame-rainbow svg {
      animation: rainbowFlameGlow 3s ease-in-out infinite;
    }

    @keyframes rainbowFlameGlow {
      0%,
      100% {
        filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.9)) drop-shadow(0 0 40px rgba(255, 107, 53, 0.4));
      }
      25% {
        filter: drop-shadow(0 0 28px rgba(255, 255, 255, 1)) drop-shadow(0 0 48px rgba(255, 255, 255, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(91, 127, 255, 0.9)) drop-shadow(0 0 40px rgba(91, 127, 255, 0.4));
      }
      75% {
        filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.9)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.4));
      }
    }

    .flame-rainbow .rainbow-stop-1 {
      animation: rainbowStop1 3s ease-in-out infinite;
    }
    .flame-rainbow .rainbow-stop-2 {
      animation: rainbowStop2 3s ease-in-out infinite;
    }

    @keyframes rainbowStop1 {
      0%,
      100% {
        stop-color: #FFB088;
      }
      25% {
        stop-color: #FFFFFF;
      }
      50% {
        stop-color: #B8CDFF;
      }
      75% {
        stop-color: #D4B5FD;
      }
    }
    @keyframes rainbowStop2 {
      0%,
      100% {
        stop-color: #FF6B35;
      }
      25% {
        stop-color: #FFFFFF;
      }
      50% {
        stop-color: #5B7FFF;
      }
      75% {
        stop-color: #A855F7;
      }
    }

    /* ============================================================
         DROPDOWN
         ============================================================ */
    .dropdown-wrapper {
      position: relative;
      margin-bottom: 18px;
    }
    .dropdown-trigger {
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-card-strong);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 58px;
      color: var(--text-primary);
      transition: all var(--transition);
      font-family: inherit;
    }
    .dropdown-trigger:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .dropdown-trigger .arrow {
      transition: transform 0.3s;
      font-size: 14px;
      color: var(--primary);
    }
    .dropdown-trigger .arrow.open {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      right: 0;
      background: var(--bg-card-strong);
      backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 50;
      max-height: 420px;
      overflow-y: auto;
      padding: 10px;
      animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .dropdown-search {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-dark);
      background: var(--bg-input);
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text-primary);
      transition: border 0.2s;
    }
    .dropdown-search:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .dropdown-item:hover {
      background: rgba(102, 126, 234, 0.08);
      transform: translateX(4px);
    }
    [dir="rtl"] .dropdown-item:hover {
      transform: translateX(-4px);
    }
    .dropdown-item-main {
      flex: 1;
      min-width: 0;
    }
    .dropdown-item-name {
      font-weight: 700;
      font-size: 14px;
    }
    .dropdown-item-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .dropdown-item-actions {
      display: flex;
      gap: 6px;
    }

    .dropdown-item.primary {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.12), rgba(118, 75, 162, 0.12));
      color: var(--primary);
      font-weight: 700;
      justify-content: center;
      margin-top: 10px;
      border: 1px dashed rgba(102, 126, 234, 0.25);
    }
    .dropdown-item.primary:hover {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
      transform: translateY(-1px);
    }

    /* ============================================================
         SANCTUARY
         ============================================================ */
    .sanctuary {
      background: linear-gradient(135deg, #FFF7ED 0%, #FED7AA 40%, #FDE68A 100%);
      border: 2px solid rgba(245, 158, 11, 0.2);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin: 20px 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(245, 158, 11, 0.15);
      transition: all var(--transition);
    }
    .dark-mode .sanctuary {
      background: linear-gradient(135deg, #451A03 0%, #78350F 40%, #92400E 100%);
      border-color: rgba(245, 158, 11, 0.25);
    }
    .dark-mode .sanctuary .sanctuary-title {
      color: #FCD34D;
    }
    .dark-mode .sanctuary .sanctuary-subtitle {
      color: #FDE68A;
    }
    .dark-mode .sanctuary .sanctuary-count {
      color: #FCD34D;
      background: rgba(0, 0, 0, 0.3);
    }

    .sanctuary::before {
      content: '';
      position: absolute;
      top: -50px;
      left: -50px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .sanctuary::after {
      content: '✨';
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 22px;
      opacity: 0.6;
      animation: sparkleFloat 3s ease-in-out infinite;
    }
    @keyframes sparkleFloat {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.6;
      }
      50% {
        transform: translateY(-6px) rotate(15deg);
        opacity: 1;
      }
    }

    .sanctuary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }
    .sanctuary-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sanctuary-icon {
      font-size: 44px;
      filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.3));
      animation: floatCastle 4s ease-in-out infinite;
    }
    @keyframes floatCastle {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }
    .sanctuary-title {
      font-size: 19px;
      font-weight: 900;
      color: #7C2D12;
      margin-bottom: 2px;
    }
    .sanctuary-subtitle {
      font-size: 13px;
      color: #92400E;
      font-weight: 600;
    }
    .sanctuary-count {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.7);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #92400E;
      font-weight: 800;
      margin-top: 6px;
      backdrop-filter: blur(10px);
    }

    /* ============================================================
         GAMES GRID
         ============================================================ */
    .section-title {
      margin: 28px 0 14px;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .game-card {
      background: var(--bg-card-strong);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-dark);
      padding: 18px 12px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      position: relative;
      overflow: hidden;
      color: var(--text-primary);
    }
    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(102, 126, 234, 0.06) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }
    .game-card:hover::before {
      opacity: 1;
    }
    .game-card:active {
      transform: scale(0.97);
    }

    .game-icon-wrap {
      width: 54px;
      height: 54px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      transition: transform 0.3s;
    }
    .game-card:hover .game-icon-wrap {
      transform: scale(1.1) rotate(-3deg);
    }
    .game-icon-wrap svg {
      width: 100%;
      height: 100%;
    }
    .game-name {
      font-size: 13px;
      font-weight: 800;
    }
    .game-desc {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-weight: 500;
    }

    /* ============================================================
         EDITOR
         ============================================================ */
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .page-header h2 {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .editor-box {
      padding: 22px;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 13px 15px;
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--bg-input);
      color: var(--text-primary);
      transition: all 0.25s;
      font-weight: 500;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }

    .translation-box {
      position: relative;
    }
    .translation-status {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }
    [dir="rtl"] .translation-status {
      right: auto;
      left: 14px;
    }

    .suggestions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .suggestion-chip {
      padding: 5px 14px;
      background: rgba(102, 126, 234, 0.10);
      border: 1px solid rgba(102, 126, 234, 0.2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--primary);
    }
    .suggestion-chip:hover {
      background: rgba(102, 126, 234, 0.2);
      transform: translateY(-1px);
    }

    .translate-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .word-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      margin-bottom: 10px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-dark);
      transition: all 0.2s;
      color: var(--text-primary);
    }
    .word-row:hover {
      background: var(--bg-card-strong);
      transform: translateX(2px);
    }
    [dir="rtl"] .word-row:hover {
      transform: translateX(-2px);
    }
    .word-row-main {
      flex: 1;
      min-width: 0;
    }
    .word-row-text {
      font-weight: 700;
      font-size: 16px;
    }
    .word-row-translation {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* ============================================================
         GAME PAGES
         ============================================================ */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }
    .game-title {
      font-weight: 700;
      font-size: 17px;
      color: var(--text-primary);
    }
    .game-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-weight: 500;
    }

    .progress-bar {
      height: 10px;
      background: var(--border-dark);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
      backdrop-filter: blur(10px);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
      background-size: 200% 100%;
      animation: progressGradient 3s linear infinite;
      transition: width 0.4s ease;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(102, 126, 234, 0.3);
    }
    @keyframes progressGradient {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    /* Flashcard */
    .flashcard-wrap {
      max-width: 460px;
      margin: 0 auto;
      perspective: 1200px;
    }
    .flashcard {
      position: relative;
      width: 100%;
      min-height: 400px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 26px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .face.front {
      background: linear-gradient(145deg, #667EEA 0%, #764BA2 100%);
    }
    .face.back {
      background: linear-gradient(145deg, #F093FB 0%, #F5576C 100%);
      transform: rotateY(180deg);
    }
    .face::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .face::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -20%;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.10) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .face .big {
      font-size: 38px;
      font-weight: 900;
      word-break: break-word;
      position: relative;
      z-index: 2;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
      letter-spacing: -0.01em;
    }
    .face .lang-label {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
      font-weight: 600;
      padding: 3px 14px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    .face .hint {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 14px;
      position: relative;
      z-index: 2;
      font-weight: 500;
    }

    .card-top-actions {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    .card-chip {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
    }
    .card-round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }
    .card-round-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1);
    }
    .card-round-btn.saved {
      background: rgba(252, 211, 77, 0.3);
      color: #FCD34D;
    }
    .card-round-btn.speaking {
      animation: pulseBtn 0.6s ease-in-out infinite;
    }
    @keyframes pulseBtn {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    .game-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }

    /* MCQ */
    .mcq-word-box {
      padding: 28px 20px;
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 18px;
      position: relative;
      background: var(--bg-card-strong);
      color: var(--text-primary);
      letter-spacing: -0.01em;
      border: 1px solid var(--border-dark);
    }
    .mcq-options {
      display: grid;
      gap: 12px;
    }
    .mcq-option {
      padding: 17px 18px;
      border-radius: var(--radius);
      border: 2px solid var(--border-dark);
      background: var(--bg-card);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      min-height: 54px;
      color: var(--text-primary);
      text-align: start;
      font-size: 16px;
    }
    .mcq-option:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .mcq-option.correct {
      background: var(--success-light);
      border-color: var(--success);
      color: var(--success);
    }
    .mcq-option.wrong {
      background: var(--danger-light);
      border-color: var(--danger);
      color: var(--danger);
    }
    .mcq-option:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Spelling */
    .spelling-box {
      padding: 24px;
      text-align: center;
      margin-bottom: 18px;
      background: var(--bg-card-strong);
      border: 1px solid var(--border-dark);
    }
    .spelling-translation {
      font-size: 30px;
      font-weight: 900;
      margin: 10px 0;
      color: var(--text-primary);
    }
    .spelling-input {
      width: 100%;
      padding: 17px;
      border-radius: var(--radius);
      border: 2px solid var(--border-dark);
      text-align: center;
      font-size: 23px;
      font-weight: 800;
      background: var(--bg-input);
      margin-bottom: 14px;
      color: var(--text-primary);
      transition: all 0.3s;
    }
    .spelling-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }
    .spelling-input.correct {
      border-color: var(--success);
      background: var(--success-light);
    }
    .spelling-input.wrong {
      border-color: var(--danger);
      background: var(--danger-light);
    }

    /* Matching */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .match-btn {
      min-height: 64px;
      border-radius: var(--radius);
      border: 2px solid var(--border-dark);
      background: var(--bg-card);
      font-weight: 800;
      cursor: pointer;
      padding: 14px;
      font-size: 15px;
      transition: all 0.25s;
      color: var(--text-primary);
    }
    .match-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .match-btn.selected {
      border-color: var(--primary);
      background: rgba(102, 126, 234, 0.12);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.2);
    }
    .match-btn.matched {
      background: var(--success-light);
      border-color: var(--success);
      opacity: 0.7;
      cursor: default;
    }
    .match-btn:disabled {
      cursor: not-allowed;
    }

    /* Results */
    .results-box {
      text-align: center;
      padding: 30px 24px;
    }
    .results-emoji {
      font-size: 64px;
      margin-bottom: 10px;
      animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    @keyframes bounceIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      60% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 20px auto;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      box-shadow: 0 16px 40px rgba(102, 126, 234, 0.35);
      position: relative;
    }
    .score-circle::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      z-index: -1;
      opacity: 0.25;
      filter: blur(16px);
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.25;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.4;
      }
    }

    .results-message {
      padding: 16px 22px;
      border-radius: var(--radius);
      background: rgba(102, 126, 234, 0.08);
      font-weight: 700;
      color: var(--primary);
      margin: 18px 0;
      font-size: 16px;
      border: 1px solid rgba(102, 126, 234, 0.15);
    }
    .wrong-words-section {
      text-align: start;
      margin: 22px 0;
    }
    .wrong-words-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-primary);
    }

    /* ============================================================
         AUTH / LOGIN SCREEN
         ============================================================ */
    .login-screen {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      background: var(--bg-card-strong);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .login-card .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .login-card h1 {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .login-card .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .login-card .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .login-card .divider::before,
    .login-card .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-dark);
    }

    /* ============================================================
         MODAL
         ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.25s;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .modal {
      background: var(--bg-card-strong);
      padding: 28px;
      border-radius: var(--radius-lg);
      width: min(560px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
    }
    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .modal h3 {
      margin-bottom: 18px;
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-actions .btn {
      flex: 1;
    }

    /* ============================================================
         TOASTS
         ============================================================ */
    .toast-container {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: grid;
      gap: 10px;
      width: min(92vw, 480px);
      pointer-events: none;
    }
    .toast {
      background: var(--bg-card-strong);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-sm);
      padding: 15px 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
    }
    @keyframes toastIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .toast.success {
      border-left: 4px solid var(--success);
    }
    .toast.error {
      border-left: 4px solid var(--danger);
    }
    .toast.info {
      border-left: 4px solid var(--primary);
    }
    .toast.warning {
      border-left: 4px solid var(--warning);
    }

    /* ============================================================
         EMPTY STATE
         ============================================================ */
    .empty-state {
      text-align: center;
      padding: 36px 18px;
      color: var(--text-secondary);
    }
    .empty-icon {
      font-size: 52px;
      margin-bottom: 14px;
      opacity: 0.5;
    }
    .empty-text {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-primary);
      font-size: 16px;
    }

    /* ============================================================
         SPARKLE CONTAINER
         ============================================================ */
    .sparkle-container {
      position: fixed;
      pointer-events: none;
      z-index: 999;
    }
    .sparkle {
      position: absolute;
      font-size: 22px;
      animation: sparkleFly 1.2s ease-out forwards;
    }
    @keyframes sparkleFly {
      0% {
        opacity: 1;
        transform: scale(0) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.4) rotate(180deg);
      }
      100% {
        opacity: 0;
        transform: scale(0.6) rotate(360deg) translateY(-50px);
      }
    }

    /* ============================================================
         RESPONSIVE
         ============================================================ */
    @media (max-width: 640px) {
      .topbar {
        flex-direction: column;
        gap: 12px;
      }
      .profile-card {
        padding: 18px 16px;
      }
      .profile-actions-right {
        position: static;
        margin-top: 10px;
        justify-content: flex-end;
      }
      .avatar {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
      .profile-greeting {
        font-size: 17px;
      }
      .grid-2,
      .game-actions,
      .match-grid {
        grid-template-columns: 1fr;
      }
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .game-card {
        padding: 14px 10px;
      }
      .game-icon-wrap {
        width: 46px;
        height: 46px;
      }
      .game-name {
        font-size: 11px;
      }
      .site-logo h1 {
        font-size: 26px;
      }
      .face .big {
        font-size: 28px;
      }
      .flashcard {
        min-height: 320px;
      }
      .login-card {
        padding: 30px 20px;
      }
      .modal {
        padding: 20px;
      }
    }

    @media (max-width: 400px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .profile-stats {
        gap: 12px;
      }
      .stat-item {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM + Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">

  </script>

  <!-- ============================================================
  FIREBASE SDK (compat)
  ============================================================ -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">

  </script>

  <script type="text/babel">
    // ================================================================
    //  FIREBASE CONFIG — REPLACE WITH YOUR OWN
    //  Create a project at https://console.firebase.google.com/
    //  Enable Authentication → Google Sign-In
    //  Enable Firestore Database
    // ================================================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDemoKeyPleaseReplaceWithYourOwn",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    // Check if Firebase is configured (not the demo key)
    const IS_FIREBASE_CONFIGURED = FIREBASE_CONFIG.apiKey !== "AIzaSyDemoKeyPleaseReplaceWithYourOwn";

    let firebaseApp = null;
    let firebaseAuth = null;
    let firestore = null;

    if (IS_FIREBASE_CONFIGURED) {
      try {
        firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
        firebaseAuth = firebase.auth();
        firestore = firebase.firestore();

        // Enable offline persistence
        firestore.enablePersistence({ synchronizeTabs: true })
          .catch(() => console.warn("Firestore persistence not available"));
      } catch (e) {
        console.warn("Firebase init error:", e);
      }
    } else {
      console.info("Firebase not configured — using localStorage fallback mode.");
    }

    // ================================================================
    //  REACT IMPORTS
    // ================================================================
    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

    // ================================================================
    //  UTILITIES
    // ================================================================
    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

    // ================================================================
    //  LANGUAGES
    // ================================================================
    const LANGS = [
      { code: "ar", name: "العربية", flag: "🇸🇦", dir: "rtl" },
      { code: "en", name: "English", flag: "🇬🇧", dir: "ltr" },
      { code: "fr", name: "Français", flag: "🇫🇷", dir: "ltr" },
      { code: "es", name: "Español", flag: "🇪🇸", dir: "ltr" },
      { code: "de", name: "Deutsch", flag: "🇩🇪", dir: "ltr" }
    ];
    const getLang = (code) => LANGS.find(l => l.code === code) || LANGS[1];

    // ================================================================
    //  I18N
    // ================================================================
    const LOCALES = {
      ar: {
        appName: "VOCAflow",
        tagline: "تعلم الكلمات بطريقة ممتعة ✨",
        selectSet: "اختر مجموعة",
        createSet: "إنشاء مجموعة جديدة",
        search: "ابحث عن مجموعة...",
        edit: "تعديل",
        delete: "حذف",
